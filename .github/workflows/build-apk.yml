name: PhilBuilder — Universal Build

# ============================================================
# Déclenché par le worker (dispatch) avec les mêmes inputs que
# ceux envoyés par apk-builder / api-philbuilder.
# api_key n'est utilisé que pour les builds venant de l'API v1
# (facultatif, ignoré sinon).
# ============================================================
on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      package_id:
        required: false
        type: string
        default: com.philbuilder.app
      build_id:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: debug
      output_format:
        required: false
        type: string
        default: apk
      project_type:
        required: true
        type: string
      platform:
        required: false
        type: string
        default: android
      icon_url:
        required: false
        type: string
        default: ""
      keystore_mode:
        required: false
        type: string
        default: generate
      keystore_url:
        required: false
        type: string
        default: ""
      keystore_password:
        required: false
        type: string
        default: PhilTech2026
      keystore_alias:
        required: false
        type: string
        default: release
      callback_url:
        required: true
        type: string
      build_base_url:
        required: true
        type: string
      api_key:
        required: false
        type: string
        default: ""

# Variables communes à tous les jobs
env:
  ZIP_URL: ${{ inputs.zip_url }}
  APP_NAME: ${{ inputs.app_name }}
  PACKAGE_ID: ${{ inputs.package_id }}
  BUILD_ID: ${{ inputs.build_id }}
  BUILD_TYPE: ${{ inputs.build_type }}
  OUTPUT_FORMAT: ${{ inputs.output_format }}
  PROJECT_TYPE: ${{ inputs.project_type }}
  PLATFORM: ${{ inputs.platform }}
  ICON_URL: ${{ inputs.icon_url }}
  KEYSTORE_MODE: ${{ inputs.keystore_mode }}
  KEYSTORE_URL: ${{ inputs.keystore_url }}
  KEYSTORE_PASSWORD: ${{ inputs.keystore_password }}
  KEYSTORE_ALIAS: ${{ inputs.keystore_alias }}
  CALLBACK_URL: ${{ inputs.callback_url }}
  BUILD_BASE_URL: ${{ inputs.build_base_url }}

jobs:

  # ===========================================================
  # 1) Web / Cordova — web, react, vue
  # ===========================================================
  build-cordova:
    if: contains(fromJSON('["web","react","vue"]'), inputs.project_type)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: bash scripts/build-cordova.sh
      - name: Callback en cas d'échec inattendu
        if: failure()
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Échec inattendu du job build-cordova (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 2) Web moderne / Capacitor — svelte, angular, solidjs,
  #    preact, ionic, capacitor, nativescript
  # ===========================================================
  build-capacitor:
    if: contains(fromJSON('["svelte","angular","solidjs","preact","ionic","capacitor","nativescript"]'), inputs.project_type)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: bash scripts/build-capacitor.sh
      - name: Callback en cas d'échec inattendu
        if: failure()
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Échec inattendu du job build-capacitor (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 3) Mobile natif — react-native, kotlin, java,
  #    kotlin-multiplatform
  # ===========================================================
  build-native:
    if: contains(fromJSON('["react-native","kotlin","java","kotlin-multiplatform"]'), inputs.project_type)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: bash scripts/build-native.sh
      - name: Callback en cas d'échec inattendu
        if: failure()
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Échec inattendu du job build-native (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 4) Flutter — Android (apk/aab) + Windows (exe)
  # ===========================================================
  build-flutter:
    if: inputs.project_type == 'flutter'
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: "stable" }
      - uses: actions/setup-java@v4
        if: inputs.platform != 'windows'
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
        if: inputs.platform != 'windows'
      - name: Build (bash)
        shell: bash
        run: bash scripts/build-flutter.sh
      - name: Callback en cas d'échec inattendu
        if: failure()
        shell: bash
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Échec inattendu du job build-flutter (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 5) .NET MAUI / C# — Android (apk) + Windows (exe)
  # ===========================================================
  build-dotnet:
    if: contains(fromJSON('["dotnet-maui","maui","csharp"]'), inputs.project_type)
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-java@v4
        if: inputs.platform != 'windows'
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
        if: inputs.platform != 'windows'
      - name: Build (bash)
        shell: bash
        run: bash scripts/build-dotnet.sh
      - name: Callback en cas d'échec inattendu
        if: failure()
        shell: bash
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Échec inattendu du job build-dotnet (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 6) Python — Android (Buildozer, fallback Briefcase) +
  #    Windows (PyInstaller)
  # ===========================================================
  build-python:
    if: inputs.project_type == 'python'
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        if: inputs.platform != 'windows'
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
        if: inputs.platform != 'windows'
      - name: Dépendances système Buildozer (Android uniquement)
        if: inputs.platform != 'windows'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
      - name: Build (bash)
        shell: bash
        run: bash scripts/build-python.sh
      - name: Callback en cas d'échec inattendu
        if: failure()
        shell: bash
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Échec inattendu du job build-python (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 7) Go — Android (gomobile) + Windows (cross-compile)
  # ===========================================================
  build-go:
    if: inputs.project_type == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-java@v4
        if: inputs.platform != 'windows'
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
        if: inputs.platform != 'windows'
      - name: NDK (nécessaire à gomobile)
        if: inputs.platform != 'windows'
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk-bundle" >> "$GITHUB_ENV"
      - name: Build
        run: bash scripts/build-go.sh
      - name: Callback en cas d'échec inattendu
        if: failure()
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Échec inattendu du job build-go (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 8) Autres — godot, lua (Solar2D), ruby (RubyMotion)
  # ===========================================================
  build-other:
    if: contains(fromJSON('["godot","lua","ruby"]'), inputs.project_type)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: bash scripts/build-other.sh
      - name: Callback en cas d'échec inattendu
        if: failure()
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Échec inattendu du job build-other (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 9) Garde-fou — se déclenche si project_type ne correspond à
  #    AUCUN job ci-dessus (évite un build qui reste bloqué en
  #    "building" indéfiniment côté worker)
  # ===========================================================
  guard-unknown-type:
    needs: []
    if: |
      !contains(fromJSON('["web","react","vue","svelte","angular","solidjs","preact","ionic","capacitor","nativescript","react-native","kotlin","java","kotlin-multiplatform","flutter","dotnet-maui","maui","csharp","python","go","godot","lua","ruby"]'), inputs.project_type)
    runs-on: ubuntu-latest
    steps:
      - name: Prévenir le worker d'un type inconnu
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" -H "Content-Type: application/json" \
            -d "{\"state\":\"error\",\"message\":\"Type de projet non supporté par le workflow: ${{ inputs.project_type }}\"}" || true
