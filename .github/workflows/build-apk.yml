name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL du zip source'
        required: true
        type: string
      app_name:
        description: 'Nom de l application'
        required: true
        type: string
      package_id:
        description: 'Package ID'
        required: false
        type: string
      build_id:
        description: 'ID du build'
        required: true
        type: string
      build_type:
        description: 'Type de build'
        required: true
        type: string
      output_format:
        description: 'Format de sortie (apk, aab, both)'
        required: false
        type: string
        default: 'apk'
      project_type:
        description: 'Type de projet'
        required: false
        type: string
        default: 'web'
      platform:
        description: 'Plateforme cible (android, windows)'
        required: false
        type: string
        default: 'android'
      keystore_mode:
        description: 'Mode keystore'
        required: true
        type: string
      keystore_url:
        description: 'URL du keystore'
        required: false
        type: string
      keystore_password:
        description: 'Mot de passe du keystore'
        required: false
        type: string
      keystore_alias:
        description: 'Alias du keystore'
        required: false
        type: string
      callback_url:
        description: 'URL de callback (notification finale, avec /callback)'
        required: true
        type: string
      build_base_url:
        description: 'URL de base du build sur le Worker (sans /callback), utilisee pour les uploads /upload/apk|aab|keystore'
        required: false
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # ============================================================
  # JOB 1: PREPARE — Download source & setup common tools
  # ============================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_dir: ${{ steps.detect.outputs.source_dir }}
      src_path: ${{ steps.detect.outputs.src_path }}
      has_keystore: ${{ steps.keystore.outputs.has_keystore || steps.keystore-download.outputs.has_keystore }}
      keystore_path: ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
      keystore_filename: ${{ steps.keystore.outputs.keystore_filename || steps.keystore-download.outputs.keystore_filename }}
    steps:
      - name: Download source zip
        run: |
          set -e
          curl -f -L -o source.zip "${{ github.event.inputs.zip_url }}"
          echo "=== Taille du fichier telecharge ==="
          ls -la source.zip
          file source.zip
          SIZE=$(stat -c%s source.zip 2>/dev/null || stat -f%z source.zip)
          if [ "$SIZE" -lt 100 ]; then
            echo "ERREUR: le fichier source.zip est suspicieusement petit ($SIZE octets)."
            echo "Contenu recu :"
            cat source.zip
            exit 1
          fi
          mkdir -p src
          unzip -o source.zip -d src/

      - name: Detect source directory
        id: detect
        run: |
          cd src
          ITEM_COUNT=$(ls -1 | wc -l)
          FIRST_ITEM=$(ls -1 | head -1)
          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            echo "source_dir=$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "src_path=src/$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "Single folder detected: $FIRST_ITEM"
          else
            echo "source_dir=." >> "$GITHUB_OUTPUT"
            echo "src_path=src" >> "$GITHUB_OUTPUT"
            echo "Files directly in src/"
          fi

      - &setup_java
        name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - &setup_android_sdk
        name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        id: keystore
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          KEYSTORE_NAME="my-release-key-${{ github.event.inputs.build_id }}.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_NAME" \
            -alias "${{ github.event.inputs.keystore_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 10950 \
            -storetype PKCS12 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=${{ github.event.inputs.app_name }}, O=${{ github.event.inputs.app_name }} Developer, C=CI"
          
          cat > keystore-info.txt << EOF
          Keystore généré pour le build ${{ github.event.inputs.build_id }}
          Alias: ${{ github.event.inputs.keystore_alias }}
          Password: ${{ github.event.inputs.keystore_password }}
          EOF
          
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_filename=$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download user keystore
        id: keystore-download
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'upload' && github.event.inputs.keystore_url != '' }}
        run: |
          set -e
          KEYSTORE_NAME="my-release-key-${{ github.event.inputs.build_id }}.keystore"
          curl -L -o "$KEYSTORE_NAME" "${{ github.event.inputs.keystore_url }}"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_filename=$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/
          retention-days: 1

      - name: Upload keystore artifact
        if: ${{ steps.keystore.outputs.has_keystore == 'true' || steps.keystore-download.outputs.has_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: |
            ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
            keystore-info.txt
          retention-days: 7

  # ============================================================
  # JOB 2: BUILD WEB (Cordova) — Projets web purs (React, Vue, Web)
  # ============================================================
  build-web:
    needs: [prepare, build-capacitor]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (
        (github.event.inputs.platform != 'windows' && contains(fromJson('["web","react","vue"]'), github.event.inputs.project_type))
        ||
        needs.build-capacitor.outputs.is_capacitor == 'false'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - &setup_node
        name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - *setup_java

      - *setup_android_sdk

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build web project
        run: |
          set -e
          cd src/
          
          # Trouver le projet
          PROJECT_ROOT=$(find . -name "package.json" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -not -path "*/dist/*" \
            -exec dirname {} \; | head -1)
          
          IS_STATIC=false
          if [ -z "$PROJECT_ROOT" ]; then
            echo "⚠️  Projet statique (pas de package.json)"
            IS_STATIC=true
            PROJECT_ROOT="${{ needs.prepare.outputs.source_dir }}"
          else
            echo "✅ Projet trouvé dans : $PROJECT_ROOT"
            cd "$PROJECT_ROOT"
            
            if [ -f "package.json" ]; then
              echo "=== Installation des dépendances ==="
              npm install
              
              if grep -q '"build"' package.json; then
                echo "=== Build du projet ==="
                # Vérifier si le build est interactif
                if grep -q '"build":.*"serve"' package.json || grep -q '"build":.*"start"' package.json || grep -q '"build":.*"dev"' package.json; then
                  echo "⚠️  Build en mode production (pas de watch)"
                  npm run build -- --no-watch --no-serve 2>/dev/null || npm run build -- --no-watch 2>/dev/null || npm run build
                else
                  npm run build
                fi
              fi
            fi
          fi
          
          # Build Cordova
          PKG_ID="${{ github.event.inputs.package_id }}"
          [ -z "$PKG_ID" ] && PKG_ID="com.philtech.app"
          
          CORDOVA_DIR="cordova-project-${{ github.event.inputs.build_id }}"
          cordova create "$CORDOVA_DIR" "$PKG_ID" "${{ github.event.inputs.app_name }}"
          rm -rf "$CORDOVA_DIR"/www/*
          
          # Déterminer la source à copier
          if [ "$IS_STATIC" = true ]; then
            COPY_FROM="$PROJECT_ROOT"
          else
            if [ -d "$PROJECT_ROOT/dist" ]; then
              COPY_FROM="$PROJECT_ROOT/dist"
            elif [ -d "$PROJECT_ROOT/build" ]; then
              COPY_FROM="$PROJECT_ROOT/build"
            else
              COPY_FROM="$PROJECT_ROOT"
            fi
          fi
          
          cp -r "$COPY_FROM"/* "$CORDOVA_DIR"/www/ 2>/dev/null || true
          
          cd "$CORDOVA_DIR"
          cordova platform add android
          
          KEYSTORE_PATH="../../my-release-key.keystore"
          FORMAT="${{ github.event.inputs.output_format }}"
          
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$KEYSTORE_PATH" ]; then
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- \
                --packageType=apk \
                --keystore="$KEYSTORE_PATH" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- \
                --packageType=bundle \
                --keystore="$KEYSTORE_PATH" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
          else
            cordova build android --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 3: BUILD CAPACITOR / IONIC — Angular, Svelte, SolidJS, Preact, Ionic
  # ============================================================
  build-capacitor:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["angular","svelte","solidjs","preact","ionic","capacitor"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    outputs:
      is_capacitor: ${{ steps.build.outputs.is_capacitor }}
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - *setup_node

      - *setup_java

      - *setup_android_sdk

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Build Capacitor project
        id: build
        run: |
          set -e
          
          echo "is_capacitor=true" >> "$GITHUB_OUTPUT"
          
          echo "=== Recherche du projet ==="
          cd src/
          
          # Chercher package.json
          PROJECT_ROOT=$(find . -name "package.json" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -not -path "*/dist/*" \
            -exec dirname {} \; | head -1)
          
          # Si pas de package.json, vérifier si c'est un projet Capacitor
          if [ -z "$PROJECT_ROOT" ]; then
            HAS_CAPACITOR_CONFIG=$(find . -name "capacitor.config.json" -o -name "capacitor.config.ts" 2>/dev/null | head -1)
            HAS_ANDROID_DIR=$(find . -name "android" -type d 2>/dev/null | head -1)
            
            if [ -z "$HAS_CAPACITOR_CONFIG" ] && [ -z "$HAS_ANDROID_DIR" ]; then
              echo "⚠️  Pas un projet Capacitor, sortie avec succès"
              echo "✅ build-web prendra le relais"
              echo "is_capacitor=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            
            echo "✅ Projet Capacitor détecté"
            PROJECT_ROOT="."
            
            # Créer package.json si absent
            if [ ! -f "package.json" ]; then
              echo "📦 Création d'un package.json minimal..."
              cat > package.json << 'EOF'
          {
            "name": "capacitor-project",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "npx cap sync android && cd android && ./gradlew assembleDebug"
            },
            "dependencies": {
              "@capacitor/core": "^5.0.0",
              "@capacitor/android": "^5.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^5.0.0"
            }
          }
          EOF
            fi
          fi
          
          echo "✅ Projet trouvé dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Vérifier que c'est bien un projet Capacitor
          if [ -f "package.json" ] && ! grep -q '"@capacitor/core"' package.json 2>/dev/null && [ ! -d "android" ]; then
            echo "⚠️  Pas un projet Capacitor identifiable, sortie avec succès"
            echo "✅ build-web prendra le relais"
            echo "is_capacitor=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "=== Installation des dépendances ==="
          npm install
          
          # Build du projet frontend (si nécessaire)
          if grep -q '"build"' package.json 2>/dev/null; then
            echo "=== Build du frontend ==="
            # Éviter les modes watch/serve
            if grep -q '"build":.*"serve"' package.json || grep -q '"build":.*"start"' package.json || grep -q '"build":.*"dev"' package.json; then
              npm run build -- --no-watch --no-serve 2>/dev/null || npm run build -- --no-watch 2>/dev/null || npm run build
            else
              npm run build
            fi
          fi
          
          # Sync Android
          echo "=== Synchronisation Android ==="
          npx cap sync android 2>/dev/null || echo "⚠️  Sync échouée, on continue..."
          
          # Build Android
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            
            if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
              echo "=== Build RELEASE ==="
              mkdir -p app
              cat > app/signing.gradle << 'GRADLE_EOF'
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
              echo "apply from: 'signing.gradle'" >> app/build.gradle
              
              export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-release-key.keystore"
              export STORE_PASSWORD="${{ github.event.inputs.keystore_password }}"
              export KEY_ALIAS="${{ github.event.inputs.keystore_alias }}"
              export KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
              
              ./gradlew assembleRelease
            else
              echo "=== Build DEBUG ==="
              ./gradlew assembleDebug
            fi
          else
            echo "⚠️  Dossier android non trouvé, création..."
            cd ..
            npx cap add android 2>/dev/null || echo "⚠️  Échec de l'ajout d'Android"
            
            if [ -d "android" ]; then
              cd android
              chmod +x gradlew
              if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
                # Build release...
                mkdir -p app
                cat > app/signing.gradle << 'GRADLE_EOF'
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
                echo "apply from: 'signing.gradle'" >> app/build.gradle
                
                export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-release-key.keystore"
                export STORE_PASSWORD="${{ github.event.inputs.keystore_password }}"
                export KEY_ALIAS="${{ github.event.inputs.keystore_alias }}"
                export KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
                
                ./gradlew assembleRelease
              else
                ./gradlew assembleDebug
              fi
            fi
          fi
          
          # Nettoyer les processus
          echo "🧹 Nettoyage..."
          pkill -f "node" 2>/dev/null || true
          pkill -f "npm" 2>/dev/null || true
          pkill -f "gradle" 2>/dev/null || true
          pkill -f "java" 2>/dev/null || true

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 4: BUILD REACT NATIVE
  # ============================================================
  build-react-native:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.project_type == 'react-native' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - *setup_node

      - *setup_java

      - *setup_android_sdk

      - name: Build React Native
        run: |
          set -e
          cd src/
          
          PROJECT_ROOT=$(find . -name "package.json" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -exec dirname {} \; | head -1)
          
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          
          echo "✅ Projet trouvé dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          npm install
          cd android
          chmod +x gradlew
          
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            mkdir -p app
            cat > app/signing.gradle << 'GRADLE_EOF'
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
            echo "apply from: 'signing.gradle'" >> app/build.gradle
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-release-key.keystore"
            export STORE_PASSWORD="${{ github.event.inputs.keystore_password }}"
            export KEY_ALIAS="${{ github.event.inputs.keystore_alias }}"
            export KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 5: BUILD KOTLIN / JAVA
  # ============================================================
  build-kotlin-java:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["kotlin","java","kotlin-multiplatform"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - *setup_java

      - *setup_android_sdk

      - name: Build Kotlin/Java
        run: |
          set -e
          cd src/
          
          PROJECT_ROOT=$(find . -name "build.gradle" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -exec dirname {} \; | head -1)
          
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          
          echo "✅ Projet trouvé dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            if ! grep -q "signingConfigs" app/build.gradle 2>/dev/null; then
              cat > app/signing.gradle << 'GRADLE_EOF'
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
              echo "apply from: 'signing.gradle'" >> app/build.gradle
            fi
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-release-key.keystore"
            export STORE_PASSWORD="${{ github.event.inputs.keystore_password }}"
            export KEY_ALIAS="${{ github.event.inputs.keystore_alias }}"
            export KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 6: BUILD FLUTTER
  # ============================================================
  build-flutter:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && github.event.inputs.project_type == 'flutter' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - *setup_java

      - *setup_android_sdk

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter
        run: |
          set -e
          cd src/
          
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -exec dirname {} \; | head -1)
          
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          
          echo "✅ Projet trouvé dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          flutter pub get
          FORMAT="${{ github.event.inputs.output_format }}"
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            mkdir -p android
            cat > android/key.properties << EOF
          storePassword=${{ github.event.inputs.keystore_password }}
          keyPassword=${{ github.event.inputs.keystore_password }}
          keyAlias=${{ github.event.inputs.keystore_alias }}
          storeFile=$GITHUB_WORKSPACE/my-release-key.keystore
          EOF
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              flutter build apk --release
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              flutter build appbundle --release
            fi
          else
            flutter build apk --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 7: BUILD PYTHON
  # ============================================================
  build-python:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && github.event.inputs.project_type == 'python' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - *setup_java

      - *setup_android_sdk

      - name: Build Python with Briefcase
        run: |
          set -e
          cd src/
          
          PROJECT_ROOT=$(find . -name "setup.py" -o -name "pyproject.toml" -o -name "app.py" -o -name "main.py" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/__pycache__/*" \
            -exec dirname {} \; | head -1)
          
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          
          echo "✅ Projet trouvé dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          pip install briefcase
          briefcase create android
          briefcase build android
          briefcase package android -p apk --adhoc-sign

      - name: Sign APK with real keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          cd src/
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -z "$APK_SIGNER" ]; then
            echo "ERROR: apksigner introuvable"
            exit 0
          fi
          for apk in $(find . -name "*.apk"); do
            "$APK_SIGNER" sign \
              --ks "$GITHUB_WORKSPACE/my-release-key.keystore" \
              --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
              --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
              --ks-key-alias "${{ github.event.inputs.keystore_alias }}" \
              "$apk"
          done

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 8: BUILD .NET MAUI
  # ============================================================
  build-dotnet:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && contains(fromJson('["dotnet-maui","maui","csharp"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - *setup_java

      - *setup_android_sdk

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build .NET MAUI
        run: |
          set -e
          cd src/
          
          PROJECT_ROOT=$(find . -name "*.csproj" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/bin/*" \
            -not -path "*/obj/*" \
            -exec dirname {} \; | head -1)
          
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          
          echo "✅ Projet trouvé dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            dotnet publish "$CSPROJ" -f net8.0-android -c Release
          else
            dotnet build "$CSPROJ" -f net8.0-android -c Debug
          fi

      - name: Sign APK with real keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          cd src/
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -z "$APK_SIGNER" ]; then
            echo "ERROR: apksigner introuvable"
            exit 0
          fi
          for apk in $(find . -name "*.apk"); do
            "$APK_SIGNER" sign \
              --ks "$GITHUB_WORKSPACE/my-release-key.keystore" \
              --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
              --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
              --ks-key-alias "${{ github.event.inputs.keystore_alias }}" \
              "$apk"
          done

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 9: BUILD OTHER (Go, Godot, Lua, Ruby, NativeScript)
  # ============================================================
  build-other:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["go","godot","lua","ruby","nativescript"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - *setup_java

      - *setup_android_sdk

      - name: Setup Go
        if: ${{ github.event.inputs.project_type == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Ruby
        if: ${{ github.event.inputs.project_type == 'ruby' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Godot
        if: ${{ github.event.inputs.project_type == 'godot' }}
        run: |
          set -e
          GODOT_VERSION="4.2.2"
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Setup Lua/Solar2D
        if: ${{ github.event.inputs.project_type == 'lua' }}
        run: |
          set -e
          wget -q https://github.com/coronalabs/corona/releases/download/3700/Solar2DConsole.tgz
          tar -xzf Solar2DConsole.tgz
          sudo mv Solar2DConsole /opt/solar2d
          echo "/opt/solar2d" >> $GITHUB_PATH

      - name: Setup Node for NativeScript
        if: ${{ github.event.inputs.project_type == 'nativescript' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install NativeScript CLI
        if: ${{ github.event.inputs.project_type == 'nativescript' }}
        run: npm install -g nativescript

      - name: Install gomobile
        if: ${{ github.event.inputs.project_type == 'go' }}
        run: |
          set -e
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Install RubyMotion
        if: ${{ github.event.inputs.project_type == 'ruby' }}
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y build-essential
          gem install motion-game || true

      - name: Build project
        run: |
          set -e
          cd src/
          
          case "${{ github.event.inputs.project_type }}" in
            go)
              PROJECT_ROOT=$(find . -name "go.mod" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              gomobile build -target=android -o app.apk .
              ;;
            godot)
              PROJECT_ROOT=$(find . -name "project.godot" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              godot --headless --export-release "Android" build.apk
              ;;
            lua)
              PROJECT_ROOT=$(find . -name "build.settings" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              /opt/solar2d/solar2d.sh build android
              ;;
            ruby)
              PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              rake android:build || echo "Build RubyMotion echoue — licence requise."
              ;;
            nativescript)
              PROJECT_ROOT=$(find . -name "package.json" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              npm install
              ns platform add android
              if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
                ns build android --release --key-store-path "$GITHUB_WORKSPACE/my-release-key.keystore" --key-store-password "${{ github.event.inputs.keystore_password }}" --key-store-alias "${{ github.event.inputs.keystore_alias }}" --key-store-alias-password "${{ github.event.inputs.keystore_password }}"
              else
                ns build android --debug
              fi
              ;;
          esac

      - name: Universal APK signing
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          APK_SIGNER=$(find $ANDROID_SDK_ROOT -name "apksigner" -type f 2>/dev/null | head -1)
          [ -z "$APK_SIGNER" ] && APK_SIGNER=$(find /usr -name "apksigner" -type f 2>/dev/null | head -1)
          [ -z "$APK_SIGNER" ] && APK_SIGNER=$(find /opt -name "apksigner" -type f 2>/dev/null | head -1)
          
          if [ -n "$APK_SIGNER" ]; then
            for apk in $(find . -name "*.apk" -not -path "./output/*"); do
              $APK_SIGNER sign \
                --ks "$GITHUB_WORKSPACE/my-release-key.keystore" \
                --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --ks-key-alias "${{ github.event.inputs.keystore_alias }}" \
                "$apk"
            done
          else
            for apk in $(find . -name "*.apk" -not -path "./output/*"); do
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$GITHUB_WORKSPACE/my-release-key.keystore" \
                -storepass "${{ github.event.inputs.keystore_password }}" \
                "$apk" "${{ github.event.inputs.keystore_alias }}"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 10: BUILD WINDOWS — Flutter
  # ============================================================
  build-windows-flutter:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && github.event.inputs.project_type == 'flutter' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter for Windows
        shell: bash
        run: |
          set -e
          cd src/
          
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -exec dirname {} \; | head -1)
          
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          
          echo "✅ Projet trouvé dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          flutter config --enable-windows-desktop
          flutter pub get
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            flutter build windows --release
          else
            flutter build windows --debug
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p output
          EXE=$(find src/build/windows -name "*.exe" | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" output/app.exe
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 11: BUILD WINDOWS — .NET MAUI
  # ============================================================
  build-windows-dotnet:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && contains(fromJson('["dotnet-maui","maui","csharp"]'), github.event.inputs.project_type) }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build .NET MAUI for Windows
        shell: bash
        run: |
          set -e
          cd src/
          
          PROJECT_ROOT=$(find . -name "*.csproj" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/bin/*" \
            -not -path "*/obj/*" \
            -exec dirname {} \; | head -1)
          
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          
          echo "✅ Projet trouvé dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          CONFIG="Debug"
          [ "${{ github.event.inputs.build_type }}" == "release" ] && CONFIG="Release"
          dotnet publish "$CSPROJ" -f net8.0-windows10.0.19041.0 -c "$CONFIG" -p:WindowsPackageType=None -p:SelfContained=true -r win-x64

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p output
          EXE=$(find src -path "*win-x64*" -name "*.exe" | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" output/app.exe
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 12: BUILD WINDOWS — Python
  # ============================================================
  build-windows-python:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && github.event.inputs.project_type == 'python' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build with Briefcase for Windows
        shell: bash
        run: |
          set -e
          cd src/
          
          PROJECT_ROOT=$(find . -name "setup.py" -o -name "pyproject.toml" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/__pycache__/*" \
            -exec dirname {} \; | head -1)
          
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          
          echo "✅ Projet trouvé dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          pip install briefcase
          briefcase create windows app
          briefcase build windows app
          briefcase package windows app -p app

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p output
          EXE=$(find src -name "*.exe" | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" output/app.exe
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 13: BUILD WINDOWS — Go (cross-compilation)
  # ============================================================
  build-windows-go:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && github.event.inputs.project_type == 'go' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cross-compile for Windows
        run: |
          set -e
          cd src/
          
          PROJECT_ROOT=$(find . -name "go.mod" -type f -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          
          echo "✅ Projet trouvé dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          GOOS=windows GOARCH=amd64 go build -o app.exe .

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "app.exe" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 14: POST-BUILD — Upload to R2 & Notify
  # ============================================================
  post-build:
    needs: [prepare, build-web, build-capacitor, build-react-native, build-kotlin-java, build-flutter, build-python, build-dotnet, build-other, build-windows-flutter, build-windows-dotnet, build-windows-python, build-windows-go]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.upload.outputs.status }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: build-*
          merge-multiple: true

      - name: Download keystore artifact
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: keystore/

      - name: List artifacts
        run: |
          echo "=== Artifacts downloaded ==="
          find artifacts/ -type f || true
          echo "=== Keystore ==="
          find keystore/ -type f 2>/dev/null || true

      - name: Upload APK to R2
        id: upload-apk
        run: |
          set -e
          APK_FILE=$(find artifacts/ -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "Uploading APK: $APK_FILE"
            curl -sf -X POST \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK_FILE" \
              "${{ github.event.inputs.build_base_url }}/upload/apk"
            echo "apk_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No APK found"
            echo "apk_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to R2
        id: upload-aab
        run: |
          set -e
          AAB_FILE=$(find artifacts/ -name "*.aab" -type f | head -1)
          if [ -n "$AAB_FILE" ]; then
            echo "Uploading AAB: $AAB_FILE"
            curl -sf -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$AAB_FILE" \
              "${{ github.event.inputs.build_base_url }}/upload/aab"
            echo "aab_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No AAB found"
            echo "aab_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload EXE to R2
        id: upload-exe
        if: ${{ github.event.inputs.platform == 'windows' }}
        run: |
          set -e
          EXE_FILE=$(find artifacts/ -name "*.exe" -type f | head -1)
          if [ -n "$EXE_FILE" ]; then
            echo "Uploading EXE: $EXE_FILE"
            curl -sf -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$EXE_FILE" \
              "${{ github.event.inputs.build_base_url }}/upload/exe"
            echo "exe_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No EXE found"
            echo "exe_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated keystore to R2
        id: upload-keystore
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          KS_FILE=$(find keystore/ -name "*.keystore" -type f | head -1)
          if [ -n "$KS_FILE" ]; then
            echo "Uploading keystore: $KS_FILE"
            curl -sf -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$KS_FILE" \
              "${{ github.event.inputs.build_base_url }}/upload/keystore"
            echo "keystore_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore found"
            echo "keystore_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine build status
        id: build-status
        run: |
          if [ "${{ steps.upload-apk.outputs.apk_uploaded }}" == "true" ] || [ "${{ steps.upload-aab.outputs.aab_uploaded }}" == "true" ] || [ "${{ steps.upload-exe.outputs.exe_uploaded }}" == "true" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify callback URL
        id: upload
        run: |
          set -e
          BUILD_ID="${{ github.event.inputs.build_id }}"
          STATUS="${{ steps.build-status.outputs.status }}"

          JSON_PAYLOAD=$(cat <<EOF
          {
            "build_id": "$BUILD_ID",
            "state": "$STATUS",
            "message": "Build $STATUS"
          }
          EOF
          )

          echo "Sending notification with state=$STATUS ..."
          RESPONSE=$(curl -sf -X POST -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "${{ github.event.inputs.callback_url }}") || echo "Callback notification failed"

          echo "Callback response: $RESPONSE"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
