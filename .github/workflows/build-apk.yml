name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL du zip source'
        required: true
        type: string
      app_name:
        description: 'Nom de l application'
        required: true
        type: string
      package_id:
        description: 'Package ID'
        required: false
        type: string
      build_id:
        description: 'ID du build'
        required: true
        type: string
      build_type:
        description: 'Type de build (debug ou release)'
        required: true
        type: string
      output_format:
        description: 'Format de sortie (apk, aab, both)'
        required: false
        type: string
        default: 'apk'
      project_type:
        description: 'Type de projet (web, flutter, react-native, kotlin, java, dotnet-maui, go, svelte, angular, solidjs, preact, nativescript, kotlin-multiplatform, ruby, lua, godot, react, vue, python)'
        required: false
        type: string
        default: 'web'
      keystore_mode:
        description: 'Mode keystore (generate ou upload)'
        required: true
        type: string
      keystore_url:
        description: 'URL du keystore'
        required: false
        type: string
      keystore_password:
        description: 'Mot de passe du keystore'
        required: false
        type: string
      keystore_alias:
        description: 'Alias du keystore'
        required: false
        type: string
      callback_url:
        description: 'URL de callback'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # 1. DOWNLOAD & DETECT SOURCE
      # ============================================================
      - name: Download source zip
        run: |
          set -e
          curl -L -o source.zip "${{ github.event.inputs.zip_url }}"
          mkdir -p src
          unzip -o source.zip -d src/

      - name: Detect source directory
        id: detect
        run: |
          cd src
          ITEM_COUNT=$(ls -1 | wc -l)
          FIRST_ITEM=$(ls -1 | head -1)
          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            echo "SOURCE_DIR=$FIRST_ITEM" >> "$GITHUB_ENV"
            echo "SRC_PATH=src/$FIRST_ITEM" >> "$GITHUB_ENV"
          else
            echo "SOURCE_DIR=." >> "$GITHUB_ENV"
            echo "SRC_PATH=src" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 2. SETUP TOOLCHAINS (Node, Java, Android SDK, Flutter, Python, .NET, Go, Ruby, Godot, Lua)
      # ============================================================
      - name: Setup Node
        if: ${{ contains(fromJson('["web","react","vue","svelte","angular","solidjs","preact","nativescript","ionic","capacitor","react-native"]'), github.event.inputs.project_type) }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: ${{ contains(fromJson('["kotlin","java","react-native","nativescript","kotlin-multiplatform","web","react","vue","svelte","angular","solidjs","preact","ionic","capacitor"]'), github.event.inputs.project_type) }}
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        if: ${{ github.event.inputs.project_type == 'flutter' }}
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        if: ${{ github.event.inputs.project_type == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET
        if: ${{ contains(fromJson('["dotnet-maui","maui","csharp"]'), github.event.inputs.project_type) }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET MAUI workload
        if: ${{ contains(fromJson('["dotnet-maui","maui","csharp"]'), github.event.inputs.project_type) }}
        run: dotnet workload install maui-android

      - name: Setup Go
        if: ${{ github.event.inputs.project_type == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Ruby
        if: ${{ github.event.inputs.project_type == 'ruby' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Godot
        if: ${{ github.event.inputs.project_type == 'godot' }}
        run: |
          set -e
          GODOT_VERSION="4.2.2"
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Setup Lua/Solar2D
        if: ${{ github.event.inputs.project_type == 'lua' }}
        run: |
          set -e
          wget -q https://github.com/coronalabs/corona/releases/download/3700/Solar2DConsole.tgz
          tar -xzf Solar2DConsole.tgz
          sudo mv Solar2DConsole /opt/solar2d
          echo "/opt/solar2d" >> $GITHUB_PATH

      # ============================================================
      # 3. INSTALL GLOBAL DEPENDENCIES
      # ============================================================
      - name: Install Cordova
        if: ${{ contains(fromJson('["web","react","vue"]'), github.event.inputs.project_type) }}
        run: npm install -g cordova

      - name: Install Capacitor CLI
        if: ${{ contains(fromJson('["svelte","angular","solidjs","preact","ionic","capacitor"]'), github.event.inputs.project_type) }}
        run: npm install -g @capacitor/cli

      - name: Install NativeScript CLI
        if: ${{ github.event.inputs.project_type == 'nativescript' }}
        run: npm install -g nativescript

      - name: Install gomobile
        if: ${{ github.event.inputs.project_type == 'go' }}
        run: |
          set -e
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Install RubyMotion
        if: ${{ github.event.inputs.project_type == 'ruby' }}
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y build-essential
          gem install motion-game || true

      # ============================================================
      # 4. KEYSTORE MANAGEMENT
      # ============================================================
      - name: Generate Play Store compliant keystore
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore my-release-key.keystore \
            -alias "${{ github.event.inputs.keystore_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 10950 \
            -storetype PKCS12 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=${{ github.event.inputs.app_name }}, O=${{ github.event.inputs.app_name }} Developer, C=CI"

      - name: Download user keystore
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'upload' && github.event.inputs.keystore_url != '' }}
        run: |
          set -e
          curl -
                # ============================================================
      # 5. BUILD — WEB PROJECTS (Cordova)
      # ============================================================
      - name: Install & build (React / Vue)
        if: ${{ contains(fromJson('["react","vue"]'), github.event.inputs.project_type) }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          if [ -f "package.json" ]; then
            npm install
            if grep -q '"build"' package.json; then
              npm run build
            fi
          fi

      - name: Build with Cordova (web project)
        if: ${{ contains(fromJson('["web","react","vue"]'), github.event.inputs.project_type) }}
        run: |
          set -e
          cd src
          SOURCE_DIR="${{ env.SOURCE_DIR }}"
          COPY_FROM="$SOURCE_DIR"
          if [ -d "$SOURCE_DIR/dist" ]; then
            COPY_FROM="$SOURCE_DIR/dist"
          elif [ -d "$SOURCE_DIR/build" ]; then
            COPY_FROM="$SOURCE_DIR/build"
          fi
          PKG_ID="${{ github.event.inputs.package_id }}"
          if [ -z "$PKG_ID" ]; then
            PKG_ID="com.philtech.app"
          fi
          cordova create app "$PKG_ID" "${{ github.event.inputs.app_name }}"
          rm -rf app/www/*
          cp -r "$COPY_FROM"/* app/www/
          cd app
          cordova platform add android
          KEYSTORE_PATH="../../my-release-key.keystore"
          FORMAT="${{ github.event.inputs.output_format }}"
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$KEYSTORE_PATH" ]; then
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- \
                --packageType=apk \
                --keystore="$KEYSTORE_PATH" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- \
                --packageType=bundle \
                --keystore="$KEYSTORE_PATH" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
          else
            cordova build android --debug
          fi
      # ============================================================
      # 6. BUILD — CAPACITOR PROJECTS
      # ============================================================
      - name: Build Capacitor projects
        if: ${{ contains(fromJson('["svelte","angular","solidjs","preact","ionic","capacitor"]'), github.event.inputs.project_type) }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          npm install
          npx cap sync android
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
      # ============================================================
      # 7. BUILD — REACT NATIVE
      # ============================================================
      - name: Build React Native
        if: ${{ github.event.inputs.project_type == 'react-native' }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          npm install
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
      # ============================================================
      # 8. BUILD — NATIVESCRIPT
      # ============================================================
      - name: Build NativeScript
        if: ${{ github.event.inputs.project_type == 'nativescript' }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi
          npm install
          ns platform add android
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            ns build android --release \
              --key-store-path "$GITHUB_WORKSPACE/my-release-key.keystore" \
              --key-store-password "${{ github.event.inputs.keystore_password }}" \
              --key-store-alias "${{ github.event.inputs.keystore_alias }}" \
              --key-store-alias-password "${{ github.event.inputs.keystore_password }}"
          else
            ns build android --debug
          fi
      # ============================================================
      # 11. BUILD — FLUTTER
      # ============================================================
      - name: Build Flutter
        if: ${{ github.event.inputs.project_type == 'flutter' }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi
          flutter pub get
          FORMAT="${{ github.event.inputs.output_format }}"
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              flutter build apk --release
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              flutter build appbundle --release
            fi
          else
            flutter build apk --debug
          fi
      # ============================================================
      # 12. BUILD — PYTHON (Briefcase)
      # ============================================================
      - name: Build with Briefcase (Python/Kivy)
        if: ${{ github.event.inputs.project_type == 'python' }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          if [ ! -f "pyproject.toml" ] || ! grep -q "tool.briefcase" pyproject.toml; then
            echo "ERROR: pyproject.toml avec [tool.briefcase] requis"
            exit 1
          fi
          pip install briefcase
          briefcase create android
          briefcase build android
          briefcase package android -p apk --adhoc-sign
      # ============================================================
      # 13. BUILD — .NET MAUI
      # ============================================================
      - name: Build .NET MAUI
        if: ${{ contains(fromJson('["dotnet-maui","maui","csharp"]'), github.event.inputs.project_type) }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "ERROR: Aucun fichier .csproj trouvé."
            exit 1
          fi
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            dotnet publish "$CSPROJ" -f net8.0-android -c Release
          else
            dotnet build "$CSPROJ" -f net8.0-android -c Debug
          fi
      # ============================================================
      # 14. BUILD — GO (gomobile)
      # ============================================================
      - name: Build Go (gomobile)
        if: ${{ github.event.inputs.project_type == 'go' }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          if [ ! -f "go.mod" ]; then
            echo "ERROR: go.mod non trouvé"
            exit 1
          fi
          gomobile build -target=android -o app.apk .
      # ============================================================
      # 15. BUILD — RUBY (RubyMotion)
      # ============================================================
      - name: Build Ruby (RubyMotion)
        if: ${{ github.event.inputs.project_type == 'ruby' }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          if [ ! -f "Rakefile" ]; then
            echo "ERROR: Rakefile non trouvé"
            exit 1
          fi
          rake android:build || echo "Build RubyMotion échoué — licence requise."
      # ============================================================
      # 16. BUILD — LUA (Solar2D)
      # ============================================================
      - name: Build Lua (Solar2D)
        if: ${{ github.event.inputs.project_type == 'lua' }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          if [ ! -f "build.settings" ]; then
            echo "ERROR: build.settings non trouvé"
            exit 1
          fi
          echo "Building Lua project avec Solar2D..."
          /opt/solar2d/solar2d.sh build android
      # ============================================================
      # 17. BUILD — GODOT
      # ============================================================
      - name: Build Godot
        if: ${{ github.event.inputs.project_type == 'godot' }}
        run: |
          set -e
          cd "${{ env.SRC_PATH }}"
          if [ ! -f "project.godot" ]; then
            echo "ERROR: project.godot non trouvé"
            exit 1
          fi
          godot --export-release Android build.apk
      # ============================================================
      # 18. POST-BUILD — COLLECT ARTIFACTS
      # ============================================================
      - name: Collect APK/AAB artifacts
        run: |
          set -e
          echo "=== Recherche des fichiers APK/AAB générés ==="
          find . -name "*.apk" -o -name "*.aab" || true
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: output/
      # ============================================================
      # 19. CALLBACK NOTIFICATION
      # ============================================================
      - name: Notify callback URL
        run: |
          set -e
          echo "Envoi notification au callback..."
          curl -X POST -H "Content-Type: application/json" \
            -d '{"build_id":"${{ github.event.inputs.build_id}}","status":"success"}' \
            "${{ github.event.inputs.callback_url }}"
