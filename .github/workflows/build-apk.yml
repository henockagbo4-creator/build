name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL du zip source'
        required: true
        type: string
      app_name:
        description: 'Nom de l application'
        required: true
        type: string
      package_id:
        description: 'Package ID'
        required: true
        type: string
      build_id:
        description: 'ID du build'
        required: true
        type: string
      build_type:
        description: 'Type de build'
        required: true
        type: string
      output_format:
        description: 'Format de sortie (apk, aab, both)'
        required: false
        type: string
        default: 'apk'
      keystore_mode:
        description: 'Mode keystore'
        required: true
        type: string
      keystore_url:
        description: 'URL du keystore'
        required: false
        type: string
      keystore_password:
        description: 'Mot de passe du keystore'
        required: false
        type: string
      keystore_alias:
        description: 'Alias du keystore'
        required: false
        type: string
      callback_url:
        description: 'URL de callback'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source zip
        run: |
          set -e
          curl -L -o source.zip "${{ github.event.inputs.zip_url }}"
          mkdir -p src
          unzip -o source.zip -d src/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: |
          set -e
          npm install -g cordova

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          keytool -genkey -v \
            -keystore my-release-key.keystore \
            -alias "${{ github.event.inputs.keystore_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=PhilTech, O=PhilTech, C=CI"

      - name: Download user keystore
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'upload' && github.event.inputs.keystore_url != '' }}
        run: |
          set -e
          curl -L -o my-release-key.keystore "${{ github.event.inputs.keystore_url }}"

      - name: Build APK with Cordova
        run: |
          set -e
          
          cd src
          
          echo "=== Contents of src/ ==="
          ls -la
          
          # Détecter si le zip contenait un seul dossier
          ITEM_COUNT=$(ls -1 | wc -l)
          FIRST_ITEM=$(ls -1 | head -1)
          
          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            SOURCE_DIR="$FIRST_ITEM"
            echo "Single folder detected: $SOURCE_DIR"
          else
            SOURCE_DIR="."
            echo "Files directly in src/"
          fi
          
          # Créer le projet Cordova
          cordova create app "${{ github.event.inputs.package_id }}" "${{ github.event.inputs.app_name }}"
          
          # Vider www/ et copier les fichiers
          rm -rf app/www/*
          cp -r "$SOURCE_DIR"/* app/www/ 2>/dev/null || true
          
          cd app
          
          echo "=== Contents of www/ ==="
          ls -la www/
          
          # Vérifier index.html
          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html not found!"
            find www/ -type f | head -20
            exit 1
          fi
          
          cordova platform add android
          
          KEYSTORE_PATH="../../my-release-key.keystore"
          FORMAT="${{ github.event.inputs.output_format }}"
          
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$KEYSTORE_PATH" ]; then
          
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ] || [ -z "$FORMAT" ]; then
              echo "Building RELEASE APK"
              cordova build android --release -- \
                --packageType=apk \
                --keystore="$KEYSTORE_PATH" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
          
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              echo "Building RELEASE AAB (bundle)"
              cordova build android --release -- \
                --packageType=bundle \
                --keystore="$KEYSTORE_PATH" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
          
          else
            echo "Building DEBUG"
            cordova build android --debug
          fi

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_id }}
          path: src/app/platforms/android/app/build/outputs/apk/*/*.apk
          retention-days: 1

      - name: Upload APK to R2 (via Worker)
        if: ${{ github.event.inputs.output_format != 'aab' }}
        run: |
          set -e
          APK_DIR="src/app/platforms/android/app/build/outputs/apk"

          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            APK_FILE=$(find "${APK_DIR}/release" -name "*.apk" 2>/dev/null | head -1)
          else
            APK_FILE=$(find "${APK_DIR}/debug" -name "*.apk" 2>/dev/null | head -1)
          fi

          if [ -f "$APK_FILE" ]; then
            echo "Uploading $APK_FILE to R2..."
            curl -X POST \
              --data-binary "@${APK_FILE}" \
              -H "Content-Type: application/octet-stream" \
              "https://apk-builder.philtech-organisation.workers.dev/api/build/${{ github.event.inputs.build_id }}/upload/apk"
          else
            echo "No APK file found, skipping R2 upload."
          fi

      - name: Upload AAB to R2 (via Worker)
        if: ${{ github.event.inputs.build_type == 'release' && (github.event.inputs.output_format == 'aab' || github.event.inputs.output_format == 'both') }}
        run: |
          set -e
          AAB_DIR="src/app/platforms/android/app/build/outputs/bundle"
          AAB_FILE=$(find "${AAB_DIR}/release" -name "*.aab" 2>/dev/null | head -1)

          if [ -f "$AAB_FILE" ]; then
            echo "Uploading $AAB_FILE to R2..."
            curl -X POST \
              --data-binary "@${AAB_FILE}" \
              -H "Content-Type: application/octet-stream" \
              "https://apk-builder.philtech-organisation.workers.dev/api/build/${{ github.event.inputs.build_id }}/upload/aab"
          else
            echo "No AAB file found, skipping R2 upload."
          fi

      - name: Upload generated keystore to R2 (via Worker)
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          if [ -f "my-release-key.keystore" ]; then
            echo "Uploading generated keystore to R2..."
            curl -X POST \
              --data-binary "@my-release-key.keystore" \
              -H "Content-Type: application/octet-stream" \
              "https://apk-builder.philtech-organisation.workers.dev/api/build/${{ github.event.inputs.build_id }}/upload/keystore"
          fi

      - name: Notify backend
        run: |
          APK_DIR="src/app/platforms/android/app/build/outputs/apk"
          AAB_DIR="src/app/platforms/android/app/build/outputs/bundle"
          FORMAT="${{ github.event.inputs.output_format }}"
          STATE="error"

          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            APK_OK=true
            AAB_OK=true
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ] || [ -z "$FORMAT" ]; then
              [ -n "$(find "${APK_DIR}/release" -name '*.apk' 2>/dev/null)" ] && APK_OK=true || APK_OK=false
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              [ -n "$(find "${AAB_DIR}/release" -name '*.aab' 2>/dev/null)" ] && AAB_OK=true || AAB_OK=false
            fi
            if [ "$APK_OK" == "true" ] && [ "$AAB_OK" == "true" ]; then
              STATE="success"
            fi
          else
            if [ -f "${APK_DIR}/debug/app-debug.apk" ]; then
              STATE="success"
            fi
          fi
          
          for i in 1 2 3 4 5; do
            curl -X POST "${{ github.event.inputs.callback_url }}" \
              -H "Content-Type: application/json" \
              -d "{\"state\":\"$STATE\",\"message\":\"Build $STATE\"}" && break
            echo "Retry $i..."
            sleep 15
          done
