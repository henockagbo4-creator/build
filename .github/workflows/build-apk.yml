# ============================================================================
# Build APK / AAB / EXE — pipeline multi-langages
# ============================================================================
# Structure :
#   JOB 1  : prepare               — telecharge le zip, detecte le type de
#                                     projet, prepare le keystore (Android)
#   JOB 2  : build-web             — Cordova (web / react / vue / svelte)
#   JOB 3  : build-capacitor       — Capacitor (angular / svelte / solidjs /
#                                     preact / ionic / capacitor)
#   JOB 4  : build-react-native    — React Native natif
#   JOB 5  : build-kotlin-java     — Android natif (Kotlin / Java / KMP)
#   JOB 6  : build-flutter         — Flutter (Android)
#   JOB 7  : build-python          — Python / Briefcase (Android)
#   JOB 8  : build-dotnet          — .NET MAUI / C# (Android)
#   JOB 9  : build-other           — Go / Godot / Lua / NativeScript
#   JOB 10 : build-windows-flutter — Flutter (Windows)
#   JOB 11 : build-windows-dotnet  — .NET MAUI / C# (Windows)
#   JOB 12 : build-windows-python  — Python / Briefcase (Windows)
#   JOB 13 : build-windows-go      — Go, cross-compile depuis Linux
#   JOB 14 : post-build            — collecte tous les artefacts, upload sur
#                                     R2 et notifie le Worker (callback_url)
#
# Chaque job "build-*" ne se declenche que si prepare.outputs.detected_type
# correspond a sa famille ET que prepare.outputs.build_should_run == 'true'.
# post-build tourne toujours (if: always()) pour notifier meme en cas
# d'echec d'un job de build.
#
# CORRECTIF ICONE/SPLASH :
#   - input icon_url (optionnel)
#   - job build-web (Cordova)      : etape "Apply custom icon and splash"
#     via cordova-res, executee juste apres "cordova platform add android"
#   - job build-capacitor          : etape "Apply custom icon and splash"
#     via @capacitor/assets, executee juste avant "npx cap sync android"
#     + fallback qui reduit le splash Capacitor par defaut a 0ms si aucune
#     icone n'est fournie (evite d'afficher le logo Capacitor 2 secondes)
#
# CORRECTIF DETECTION (ajout) :
#   - Kotlin/Java : prise en compte de build.gradle.kts (Kotlin DSL, defaut
#     d'Android Studio depuis 2022), en plus de build.gradle (Groovy)
#   - Python : prise en compte de buildozer.spec (projets Kivy/Buildozer)
#   - Go : detection AVANT Python pour eviter les faux positifs
#
# CORRECTIF DIAGNOSTIC D'ERREUR (ajout) :
#   - quand aucun type de projet n'est detecte, le job "prepare" inspecte
#     les fichiers presents pour donner un indice cible (error_code +
#     hint) plutot qu'un message generique, et liste les fichiers trouves
#     (found_files) pour faciliter le diagnostic cote client
#   - le payload JSON envoye au callback_url en cas d'erreur est construit
#     avec jq (au lieu d'un heredoc a interpolation brute), pour eviter
#     tout JSON invalide si un chemin de fichier contient des guillemets
#     ou si la liste de fichiers contient des retours a la ligne
#   - post-build capture la vraie erreur du job qui a echoue au lieu d'un
#     message generique "aucun fichier n'a ete produit"
# ============================================================================

name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL du zip source'
        required: true
        type: string
      app_name:
        description: 'Nom de l application'
        required: true
        type: string
      package_id:
        description: 'Package ID'
        required: false
        type: string
      build_id:
        description: 'ID du build'
        required: true
        type: string
      build_type:
        description: 'Type de build'
        required: true
        type: string
      output_format:
        description: 'Format de sortie (apk, aab, both)'
        required: false
        type: string
        default: 'apk'
      project_type:
        description: 'Type de projet (optionnel - auto-detecte si vide)'
        required: false
        type: string
        default: ''
      platform:
        description: 'Plateforme cible (android, windows)'
        required: false
        type: string
        default: 'android'
      icon_url:
        description: 'URL de l icone personnalisee (optionnel)'
        required: false
        type: string
        default: ''
      keystore_mode:
        description: 'Mode keystore'
        required: true
        type: string
      keystore_url:
        description: 'URL du keystore'
        required: false
        type: string
      keystore_password:
        description: 'Mot de passe du keystore'
        required: false
        type: string
      keystore_alias:
        description: 'Alias du keystore'
        required: false
        type: string
      callback_url:
        description: 'URL de callback (notification finale, avec /callback)'
        required: true
        type: string
      build_base_url:
        description: 'URL de base du build sur le Worker (sans /callback)'
        required: false
        type: string

# Version Node commune a tous les jobs qui en ont besoin. Node 20 est en
# fin de vie (EOL avril 2026) ; 24 est la LTS active actuelle recommandee.
# Un seul endroit a changer ici plutot que dans chaque job.
env:
  NODE_VERSION: '24'

jobs:
  # ============================================================
  # JOB 1: PREPARE (avec auto-detection du type de projet)
  # ============================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_dir: ${{ steps.detect.outputs.source_dir }}
      src_path: ${{ steps.detect.outputs.src_path }}
      detected_type: ${{ steps.detect-project.outputs.detected_type }}
      has_keystore: ${{ steps.keystore.outputs.has_keystore || steps.keystore-download.outputs.has_keystore }}
      keystore_path: ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
      keystore_filename: ${{ steps.keystore.outputs.keystore_filename || steps.keystore-download.outputs.keystore_filename }}
      build_should_run: ${{ steps.detect-project.outputs.build_should_run }}
      error_message: ${{ steps.detect-project.outputs.error_message }}
      error_code: ${{ steps.detect-project.outputs.error_code }}
      error_hint: ${{ steps.detect-project.outputs.error_hint }}
      found_files: ${{ steps.detect-project.outputs.found_files }}
    steps:
      - name: Download source zip
        id: download
        run: |
          set -e
          curl -f -L -o source.zip "${{ github.event.inputs.zip_url }}"
          echo "=== Taille du fichier telecharge ==="
          ls -la source.zip
          file source.zip
          SIZE=$(stat -c%s source.zip 2>/dev/null || stat -f%z source.zip)
          if [ "$SIZE" -lt 100 ]; then
            echo "ERREUR: le fichier source.zip est suspicieusement petit ($SIZE octets)."
            echo "Contenu recu :"
            cat source.zip
            exit 1
          fi
          mkdir -p src
          unzip -o source.zip -d src/

      - name: Detect source directory
        id: detect
        run: |
          cd src
          ITEM_COUNT=$(ls -1 | wc -l)
          FIRST_ITEM=$(ls -1 | head -1)
          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            echo "source_dir=$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "src_path=src/$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "Single folder detected: $FIRST_ITEM"
          else
            echo "source_dir=." >> "$GITHUB_OUTPUT"
            echo "src_path=src" >> "$GITHUB_OUTPUT"
            echo "Files directly in src/"
          fi

      # ============================================================
      # NETTOYAGE DES FICHIERS SOURCE (ajout)
      # Corrige deux motifs recurrents observes sur des zips clients :
      #   - extensions dupliquees (main.py.py, buildozer.spec.py...),
      #     souvent produites par un export brut de cellules Colab/Jupyter
      #   - ligne magique Colab/Jupyter (%%writefile, %%bash...) laissee
      #     en tete de fichier, qui invalide le fichier pour l'outil cible
      #     (ex: buildozer refuse un buildozer.spec dont la 1ere ligne
      #     n'est pas une section [app])
      # Le fix de casse (find_file -iname) couvre deja Package.json vs
      # package.json ; cette etape se concentre sur ce qu'un simple match
      # insensible a la casse ne peut pas resoudre.
      # ============================================================
      - name: Sanitize source files (duplicate extensions, notebook artifacts)
        run: |
          set -e
          cd src/${{ steps.detect.outputs.source_dir }}

          echo "=== Nettoyage des fichiers source ==="

          # IMPORTANT : la suppression des lignes magiques doit se faire
          # AVANT le renommage. Un fichier "buildozer.spec.py" est repere
          # par le motif "*.py" ; une fois renomme en "buildozer.spec" il
          # ne matche plus ce motif et la ligne magique resterait figee
          # dedans si on inversait l'ordre.

          # Suppression des lignes magiques Colab/Jupyter (%%writefile, %%bash...)
          # en tete de fichier .py, qui rendent le fichier invalide pour l'outil cible
          find . -type f -iname "*.py"             -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null | while read -r f; do
            if head -1 "$f" 2>/dev/null | grep -q '^%%'; then
              echo "Suppression de la ligne magique Colab en tete de: $f"
              sed -i '1{/^%%/d}' "$f"
            fi
          done

          # main.py.py -> main.py / app.py.py -> app.py
          find . -type f \( -iname "main.py.py" -o -iname "app.py.py" \)             -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null | while read -r f; do
            BASE=$(basename "$f" .py.py)
            TARGET="$(dirname "$f")/${BASE}.py"
            echo "Renommage (extension dupliquee): $f -> $TARGET"
            mv "$f" "$TARGET"
          done

          # buildozer.spec.py -> buildozer.spec (autres marqueurs avec .py en trop)
          for MARKER in buildozer.spec pubspec.yaml package.json capacitor.config.json go.mod; do
            find . -type f -iname "${MARKER}.py"               -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null | while read -r f; do
              TARGET="$(dirname "$f")/${MARKER}"
              echo "Renommage (extension dupliquee): $f -> $TARGET"
              mv "$f" "$TARGET"
            done
          done

          echo "=== Nettoyage termine ==="

      # ============================================================
      # AUTO-DETECTION DU TYPE DE PROJET
      # ============================================================
      - name: Auto-detect project type
        id: detect-project
        run: |
          set -e
          cd src/${{ steps.detect.outputs.source_dir }}

          echo "=== Analyse de la structure du projet ==="

          # Fonction utilitaire : chercher un fichier en excluant node_modules, .git, build, dist
          # CORRECTIF : -iname (insensible a la casse) au lieu de -name.
          # Les runners GitHub Actions tournent sur Linux, ou la casse des
          # noms de fichiers compte : "Package.json" ne matchait jamais
          # "package.json", ce qui faisait echouer toute la detection pour
          # les zips clients dont les fichiers etaient mal casses.
          find_file() {
            find . -iname "$1" -type f               -not -path "*/node_modules/*"               -not -path "*/.git/*"               -not -path "*/build/*"               -not -path "*/dist/*"               -not -path "*/bin/*"               -not -path "*/obj/*"               2>/dev/null | head -1
          }

          DETECTED="unknown"
          BUILD_SHOULD_RUN="true"
          ERROR_MSG=""

          # --- 1. Flutter (priorite haute, tres specifique) ---
          if [ -n "$(find_file "pubspec.yaml")" ]; then
            DETECTED="flutter"
            echo "Flutter detecte (pubspec.yaml trouve)"

          # --- 2. .NET MAUI / C# ---
          elif [ -n "$(find_file "*.csproj")" ]; then
            DETECTED="dotnet-maui"
            echo ".NET MAUI detecte (.csproj trouve)"

          # --- 3. React Native (metro.config = RN specifique) ---
          elif [ -n "$(find_file "metro.config.js")" ] || [ -n "$(find_file "metro.config.ts")" ]; then
            DETECTED="react-native"
            echo "React Native detecte (metro.config trouve)"

          # --- 4. Capacitor / Ionic (DOIT avoir config OU dependance explicite) ---
          elif [ -n "$(find_file "capacitor.config.ts")" ] ||                [ -n "$(find_file "capacitor.config.json")" ] ||                [ -n "$(find_file "capacitor.config.js")" ] ||                ( [ -n "$(find_file "package.json")" ] &&                  ( grep -q "@capacitor/core" "$(find_file "package.json")" 2>/dev/null ||                    grep -q "@capacitor/android" "$(find_file "package.json")" 2>/dev/null ||                    grep -q "@ionic/core" "$(find_file "package.json")" 2>/dev/null ) ); then
            DETECTED="capacitor"
            echo "Capacitor/Ionic detecte (config ou dependance explicite)"

          # --- 4b. Expo (ajout) : distinguer bare workflow (supporte comme
          # React Native, car dossier android/ deja genere) du managed
          # workflow (PAS supporte : aucun job ne sait faire "expo
          # prebuild". Le laisser tomber dans la detection web generique
          # produirait un APK qui compile mais ne fonctionne pas, pire
          # qu'une erreur claire). ---
          elif [ -n "$(find_file "package.json")" ] && grep -q '"expo"' "$(find_file "package.json")" 2>/dev/null; then
            PKG_DIR=$(dirname "$(find_file "package.json")")
            if [ -d "$PKG_DIR/android" ] || [ -d "$PKG_DIR/ios" ]; then
              DETECTED="react-native"
              echo "Expo bare workflow detecte (dossier android/ ou ios/ present) - traite comme React Native"
            else
              DETECTED="unknown"
              BUILD_SHOULD_RUN="false"
              ERROR_CODE="expo_managed_not_supported"
              HINT="Projet Expo en mode managed detecte (dependance expo dans package.json, sans dossier android/ ni ios/). Ce mode n'est pas encore supporte par le pipeline. Executez 'npx expo prebuild' avant d'exporter le projet, ou passez en bare workflow."
              ERROR_MSG="Type de projet non supporte : Expo managed workflow. $HINT"
              echo "Expo managed workflow detecte - non supporte"
              echo "error_code=$ERROR_CODE" >> "$GITHUB_OUTPUT"
              echo "error_hint=$HINT" >> "$GITHUB_OUTPUT"
              {
                echo "found_files<<FOUND_FILES_EOF"
                find . -maxdepth 3 -type f -not -path "*/node_modules/*" -not -path "*/.git/*" | sed 's|^\./||' | head -20
                echo "FOUND_FILES_EOF"
              } >> "$GITHUB_OUTPUT"
            fi

          # --- 5. Kotlin / Java natif (build.gradle[.kts] MAIS PAS package.json) ---
          # CORRECTIF : Android Studio genere du Kotlin DSL (build.gradle.kts,
          # settings.gradle.kts) par defaut depuis 2022. Ne verifier que
          # build.gradle (Groovy) faisait tomber tout projet natif recent
          # en "unknown".
          elif { [ -n "$(find_file "build.gradle")" ] || [ -n "$(find_file "build.gradle.kts")" ]; } && [ -z "$(find_file "package.json")" ]; then
            DETECTED="kotlin"
            echo "Kotlin/Java natif detecte (build.gradle ou build.gradle.kts sans package.json)"

          # --- 6. Go (PRIORITE PLUS HAUTE QUE PYTHON pour eviter les faux positifs) ---
          elif [ -n "$(find_file "go.mod")" ]; then
            DETECTED="go"
            echo "Go detecte (go.mod trouve)"

          # --- 7. Python ---
          # CORRECTIF : ajout de buildozer.spec (projets Kivy/Buildozer dont
          # le script principal ne s'appelle ni main.py ni app.py).
          elif [ -n "$(find_file "setup.py")" ] || [ -n "$(find_file "pyproject.toml")" ] ||                [ -n "$(find_file "main.py")" ] || [ -n "$(find_file "app.py")" ] ||                [ -n "$(find_file "buildozer.spec")" ]; then
            DETECTED="python"
            echo "Python detecte"

          # --- 8. Godot ---
          elif [ -n "$(find_file "project.godot")" ]; then
            DETECTED="godot"
            echo "Godot detecte (project.godot trouve)"

          # --- 9. Lua / Solar2D ---
          elif [ -n "$(find_file "build.settings")" ]; then
            DETECTED="lua"
            echo "Lua/Solar2D detecte (build.settings trouve)"

          # --- 10. NativeScript ---
          elif [ -n "$(find_file "package.json")" ] &&                grep -q "nativescript" "$(find_file "package.json")" 2>/dev/null; then
            DETECTED="nativescript"
            echo "NativeScript detecte (dependance nativescript dans package.json)"

          # --- 11. Projets Web (React, Vue, Svelte, Preact, SolidJS, etc.) ---
          elif [ -n "$(find_file "package.json")" ]; then
            PKG_JSON="$(find_file "package.json")"
            if grep -q '"react"' "$PKG_JSON" 2>/dev/null && [ -z "$(find_file "metro.config.js")" ] && [ -z "$(find_file "metro.config.ts")" ]; then
              DETECTED="react"
              echo "React detecte (package.json avec react, sans metro.config)"
            elif grep -q '"vue"' "$PKG_JSON" 2>/dev/null; then
              DETECTED="vue"
              echo "Vue detecte"
            elif grep -q '"svelte"' "$PKG_JSON" 2>/dev/null; then
              DETECTED="svelte"
              echo "Svelte detecte"
            elif grep -q '"preact"' "$PKG_JSON" 2>/dev/null || grep -q '"solid-js"' "$PKG_JSON" 2>/dev/null; then
              DETECTED="web"
              echo "Projet web detecte (Preact/SolidJS)"
            else
              DETECTED="web"
              echo "Projet web generique detecte (package.json sans framework connu)"
            fi

          # --- 12. Statique (aucun fichier reconnu) ---
          elif [ -n "$(find_file "index.html")" ] || [ -n "$(find_file "*.html")" ]; then
            DETECTED="web"
            echo "Site statique detecte (HTML trouve)"

          # --- Aucun projet identifiable : diagnostic detaille ---
          else
            DETECTED="unknown"
            BUILD_SHOULD_RUN="false"

            FOUND_FILES=$(find . -maxdepth 3 -type f               -not -path "*/node_modules/*" -not -path "*/.git/*"               -not -path "*/__MACOSX/*" | sed 's|^\./||' | head -20)

            ERROR_CODE="no_marker_found"
            HINT=""
            if [ -n "$(find_file "*.py")" ]; then
              ERROR_CODE="python_missing_entrypoint"
              HINT="Des fichiers .py ont ete trouves, mais aucun n'est nomme main.py ou app.py, et aucun pyproject.toml/buildozer.spec n'est present. Renommez votre script principal ou ajoutez un buildozer.spec."
            elif [ -n "$(find_file "*.kt")" ] || [ -n "$(find_file "*.java")" ]; then
              ERROR_CODE="android_missing_gradle"
              HINT="Des fichiers Kotlin/Java ont ete trouves, mais aucun build.gradle ou build.gradle.kts n'est present a la racine du module. Verifiez que le projet Android Studio complet (avec settings.gradle) est bien inclus dans le zip."
            elif [ -n "$(find_file "*.js")" ] || [ -n "$(find_file "*.ts")" ]; then
              ERROR_CODE="js_missing_package_json"
              HINT="Des fichiers JS/TS ont ete trouves, mais aucun package.json n'est present a la racine. Assurez-vous que package.json est bien inclus dans le zip (pas seulement le dossier src/)."
            elif [ -z "$FOUND_FILES" ]; then
              ERROR_CODE="empty_zip"
              HINT="Le zip semble vide ou ne contient aucun fichier source exploitable."
            else
              HINT="Aucun marqueur de projet reconnu (package.json, pubspec.yaml, build.gradle, *.csproj, go.mod, main.py, project.godot...) n'a ete trouve parmi les fichiers presents."
            fi

            ERROR_MSG="Impossible de detecter le type de projet. $HINT"
            echo "Aucun type de projet detecte: $ERROR_CODE"

            echo "error_code=$ERROR_CODE" >> "$GITHUB_OUTPUT"
            echo "error_hint=$HINT" >> "$GITHUB_OUTPUT"
            # Sortie multi-ligne : syntaxe delimiter obligatoire pour GITHUB_OUTPUT
            {
              echo "found_files<<FOUND_FILES_EOF"
              echo "$FOUND_FILES"
              echo "FOUND_FILES_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          # Si le client a fourni un project_type explicite, on l'utilise comme override
          # sauf s'il est en conflit flagrant (ex: il dit "flutter" mais pas de pubspec.yaml)
          CLIENT_TYPE="${{ github.event.inputs.project_type }}"
          if [ "$CLIENT_TYPE" != "" ] && [ "$CLIENT_TYPE" != "web" ]; then
            echo "Client a specifie: $CLIENT_TYPE"
            case "$CLIENT_TYPE" in
              flutter)
                if [ "$DETECTED" != "flutter" ] && [ -z "$(find_file "pubspec.yaml")" ]; then
                  echo "Client dit Flutter mais pas de pubspec.yaml - fallback sur detection"
                else
                  DETECTED="$CLIENT_TYPE"
                fi
                ;;
              capacitor|angular|svelte|solidjs|preact|ionic)
                # Toujours forcer "capacitor" ici, quel que soit ce que
                # l'auto-detection avait trouve : sinon un projet detecte
                # comme "svelte" tout court resterait distinct de
                # "capacitor" et pourrait matcher DEUX jobs de build a la
                # fois. build-web ne liste plus "svelte" dans son "if", mais
                # on force quand meme pour rester coherent : un seul job
                # (build-capacitor) sait traiter cette famille.
                DETECTED="capacitor"
                echo "Forcage Capacitor sur base du choix client ($CLIENT_TYPE)"
                ;;
              *)
                DETECTED="$CLIENT_TYPE"
                ;;
            esac
          fi

          echo "detected_type=$DETECTED" >> "$GITHUB_OUTPUT"
          echo "build_should_run=$BUILD_SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "error_message=$ERROR_MSG" >> "$GITHUB_OUTPUT"
          echo "=== Type final : $DETECTED | Build: $BUILD_SHOULD_RUN ==="

      # ============================================================
      # FALLBACK : Initialiser Capacitor si manquant
      # ============================================================
      - name: Auto-init Capacitor config if missing
        if: ${{ steps.detect-project.outputs.detected_type == 'capacitor' }}
        run: |
          set -e
          cd src/${{ steps.detect.outputs.source_dir }}

          PROJECT_ROOT=$(find . -name "package.json" -type f             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"

          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.js" ]; then
            echo "Config Capacitor manquante - initialisation automatique..."
            npm install -g @capacitor/cli
            npx cap init "${{ github.event.inputs.app_name }}"               "${{ github.event.inputs.package_id || 'com.philtech.app' }}"               --web-dir "dist" 2>/dev/null ||             npx cap init "${{ github.event.inputs.app_name }}"               "${{ github.event.inputs.package_id || 'com.philtech.app' }}"               --web-dir "build" 2>/dev/null ||             npx cap init "${{ github.event.inputs.app_name }}"               "${{ github.event.inputs.package_id || 'com.philtech.app' }}"               --web-dir "www" 2>/dev/null ||             npx cap init "${{ github.event.inputs.app_name }}"               "${{ github.event.inputs.package_id || 'com.philtech.app' }}"               --web-dir "." 2>/dev/null || true
            echo "Config Capacitor generee automatiquement"
          else
            echo "Config Capacitor existante"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        id: keystore
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          KEYSTORE_NAME="my-release-key-${{ github.event.inputs.build_id }}.keystore"
          keytool -genkeypair -v             -keystore "$KEYSTORE_NAME"             -alias "${{ github.event.inputs.keystore_alias }}"             -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 10950             -storetype PKCS12             -storepass "${{ github.event.inputs.keystore_password }}"             -keypass "${{ github.event.inputs.keystore_password }}"             -dname "CN=${{ github.event.inputs.app_name }}, O=${{ github.event.inputs.app_name }} Developer, C=CI"

          cat > keystore-info.txt << EOF
          Keystore genere pour le build ${{ github.event.inputs.build_id }}
          Alias: ${{ github.event.inputs.keystore_alias }}
          Password: ${{ github.event.inputs.keystore_password }}
          EOF

          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_filename=$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download user keystore
        id: keystore-download
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'upload' && github.event.inputs.keystore_url != '' }}
        run: |
          set -e
          KEYSTORE_NAME="my-release-key-${{ github.event.inputs.build_id }}.keystore"
          curl -L -o "$KEYSTORE_NAME" "${{ github.event.inputs.keystore_url }}"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_filename=$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/
          retention-days: 1

      - name: Upload keystore artifact
        if: ${{ steps.keystore.outputs.has_keystore == 'true' || steps.keystore-download.outputs.has_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: |
            ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
            keystore-info.txt
          retention-days: 7

      # ============================================================
      # NOTIFICATION EARLY-EXIT si projet non detecte
      # CORRECTIF : payload JSON construit avec jq (au lieu d'un heredoc a
      # interpolation brute) pour eviter tout JSON invalide si un chemin
      # de fichier contient des guillemets, ou si found_files contient
      # des retours a la ligne (ce qui est le cas ici par construction).
      # ============================================================
      - name: Notify error if project not detected
        if: ${{ steps.detect-project.outputs.build_should_run == 'false' }}
        run: |
          set -e
          JSON_PAYLOAD=$(jq -n             --arg build_id "${{ github.event.inputs.build_id }}"             --arg message "${{ steps.detect-project.outputs.error_message }}"             --arg error_code "${{ steps.detect-project.outputs.error_code }}"             --arg hint "${{ steps.detect-project.outputs.error_hint }}"             --arg found_files "${{ steps.detect-project.outputs.found_files }}"             '{
              build_id: $build_id,
              state: "error",
              detected_type: "unknown",
              error_code: $error_code,
              message: $message,
              hint: $hint,
              found_files: ($found_files | split("\n") | map(select(length > 0)))
            }')

          echo "Payload envoye :"
          echo "$JSON_PAYLOAD"

          for i in 1 2 3; do
            echo "Tentative $i de notification d'erreur..."
            curl -sf -X POST -H "Content-Type: application/json"               -d "$JSON_PAYLOAD"               "${{ github.event.inputs.callback_url }}" && break || sleep 5
          done
          echo "Build annule - type de projet non detecte"
          exit 1

  # ============================================================
  # JOB 2: BUILD WEB (Cordova) - React, Vue, Svelte generique, Web statique
  # ============================================================
  build-web:
    needs: prepare
    # CORRECTION : ajout de "svelte" pour que les projets Svelte sans
    # Capacitor soient bien routes vers Cordova au lieu de ne matcher aucun job.
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["web","react","vue","svelte"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build web project
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "package.json" -type f             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -not -path "*/build/*"             -not -path "*/dist/*"             -exec dirname {} \; | head -1)

          IS_STATIC=false
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Projet statique (pas de package.json)"
            IS_STATIC=true
            PROJECT_ROOT="${{ needs.prepare.outputs.source_dir }}"
          else
            echo "Projet trouve dans : $PROJECT_ROOT"
            cd "$PROJECT_ROOT"

            if [ -f "package.json" ]; then
              echo "=== Installation des dependances ==="
              npm install

              if grep -q '"build"' package.json; then
                echo "=== Build du projet ==="
                npm run build
              fi
            fi
          fi

          PKG_ID="${{ github.event.inputs.package_id }}"
          [ -z "$PKG_ID" ] && PKG_ID="com.philtech.app"

          CORDOVA_DIR="cordova-project-${{ github.event.inputs.build_id }}"
          cordova create "$CORDOVA_DIR" "$PKG_ID" "${{ github.event.inputs.app_name }}"
          rm -rf "$CORDOVA_DIR"/www/*

          if [ "$IS_STATIC" = true ]; then
            COPY_FROM="$PROJECT_ROOT"
          else
            if [ -d "$PROJECT_ROOT/dist" ]; then
              COPY_FROM="$PROJECT_ROOT/dist"
            elif [ -d "$PROJECT_ROOT/build" ]; then
              COPY_FROM="$PROJECT_ROOT/build"
            else
              COPY_FROM="$PROJECT_ROOT"
            fi
          fi

          echo "=== Nettoyage node_modules ==="
          rm -rf "$COPY_FROM"/node_modules
          rm -rf "$COPY_FROM"/.git

          echo "=== Copie vers Cordova www/ ==="
          cp -r "$COPY_FROM"/* "$CORDOVA_DIR"/www/ 2>/dev/null || true

          echo "=== Ajout des preferences Android au config.xml genere ==="
          # FIX IMPORTANT : on n'ecrase plus le config.xml genere par
          # "cordova create" (il contient deja l'attribut id, l'attribut
          # version et l'element <name> requis par cordova-android). Un
          # widget sans id/name fait planter l'ajout de la plateforme avec
          # "Cannot read properties of null (reading 'replace')", car les
          # hooks internes de cordova-android lisent ces valeurs pour
          # generer AndroidManifest.xml et strings.xml. On se contente
          # d'INSERER nos preferences juste avant la fermeture </widget>.
          sed -i 's#</widget>#  <preference name="android-minSdkVersion" value="24" />\n  <preference name="android-targetSdkVersion" value="34" />\n  <preference name="AndroidPersistentFileLocation" value="Compatibility" />\n  <preference name="SplashScreenDelay" value="0" />\n  <preference name="AutoHideSplashScreen" value="true" />\n  <preference name="ShowSplashScreenSpinner" value="false" />\n  <preference name="FadeSplashScreen" value="false" />\n</widget>#' "$CORDOVA_DIR"/config.xml

          echo "SAVED_CORDOVA_DIR=$PWD/$CORDOVA_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # ORDRE IMPORTANT : la plateforme Android doit exister AVANT de
      # generer les icones. cordova-res --copy tente de copier les assets
      # generes dans platforms/android/.../res/ ; si ce dossier n'existe
      # pas encore, cordova-res se comporte de facon incoherente (cree un
      # dossier "android/" errone a la racine du projet), ce qui fait
      # ensuite planter "cordova platform add android" (qui interprete ce
      # dossier comme un chemin local plutot que comme le nom de la
      # plateforme a installer). On ajoute donc la plateforme d'abord.
      # ============================================================
      - name: Add Cordova Android platform
        run: |
          set -e
          cd "$SAVED_CORDOVA_DIR"
          cordova platform add android

          if [ ! -d "platforms/android" ]; then
            echo "ERREUR: la plateforme Android n'a pas ete ajoutee correctement (platforms/android absent apres 'cordova platform add android')."
            exit 1
          fi

      - name: Apply custom icon (Cordova)
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          set -e
          cd "$SAVED_CORDOVA_DIR"
          echo "=== Telechargement de l'icone personnalisee ==="
          mkdir -p resources
          curl -f -L -o resources/icon.png "${{ github.event.inputs.icon_url }}"
          # NOTE : on ne genere PAS de splash a partir de l'icone.
          # cordova-res exige une image source d'au moins 1920x1920px pour
          # le splash Android ; une icone uploadee (souvent 512x512 ou
          # 648x648) est trop petite et fait echouer TOUTE la generation
          # (icone incluse) si on la fournit comme source du splash. On se
          # limite donc a l'icone, qui accepte des tailles plus modestes.
          # Le splash Cordova par defaut (generique, pas Capacitor) reste
          # affiche au demarrage, ce qui est acceptable.
          echo "=== Generation de l'icone Android (cordova-res) ==="
          npm install -g cordova-res
          # IMPORTANT : pas de --skip-config ici. "cordova build" declenche
          # en interne une etape "prepare" qui resynchronise les
          # ressources de la plateforme a partir des declarations du
          # config.xml. Si cordova-res ne declare pas l'icone dans
          # config.xml (--skip-config), "prepare" ecrase silencieusement
          # notre icone personnalisee par l'icone par defaut du template
          # Cordova au moment du build. Laisser cordova-res editer
          # config.xml est donc necessaire pour que l'icone survive.
          cordova-res android --copy --type icon

      - name: Build Cordova platform and package
        run: |
          set -e
          cd "$SAVED_CORDOVA_DIR"

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
          FORMAT="${{ github.event.inputs.output_format }}"

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            echo "=== Build RELEASE ==="
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release --                 --packageType=apk                 --keystore="$KEYSTORE_FILE"                 --storePassword="${{ github.event.inputs.keystore_password }}"                 --alias="${{ github.event.inputs.keystore_alias }}"                 --password="${{ github.event.inputs.keystore_password }}"
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release --                 --packageType=bundle                 --keystore="$KEYSTORE_FILE"                 --storePassword="${{ github.event.inputs.keystore_password }}"                 --alias="${{ github.event.inputs.keystore_alias }}"                 --password="${{ github.event.inputs.keystore_password }}"
            fi
          else
            echo "=== Build DEBUG ==="
            cordova build android --debug
          fi

          echo "=== Verification des artefacts ==="
          find . -name "*.apk" -o -name "*.aab" | head -5

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-web-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 3: BUILD CAPACITOR (avec fallback robuste)
  # ============================================================
  build-capacitor:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["angular","svelte","solidjs","preact","ionic","capacitor"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      is_capacitor: ${{ steps.build.outputs.is_capacitor }}
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Prepare Capacitor project (install, build frontend, add android)
        id: build
        run: |
          set -e
          echo "is_capacitor=true" >> "$GITHUB_OUTPUT"

          echo "=== Recherche du projet ==="
          cd src/

          PROJECT_ROOT=$(find . -name "package.json" -type f             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -not -path "*/build/*"             -not -path "*/dist/*"             -exec dirname {} \; | head -1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "Pas de package.json trouve"
            echo "is_capacitor=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          echo "SAVED_PROJECT_ROOT=$PWD" >> "$GITHUB_ENV"

          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.js" ]; then
            echo "Pas de capacitor.config.* trouve - tentative d'init"
            npx cap init "${{ github.event.inputs.app_name }}"               "${{ github.event.inputs.package_id || 'com.philtech.app' }}"               --web-dir "dist" 2>/dev/null ||             npx cap init "${{ github.event.inputs.app_name }}"               "${{ github.event.inputs.package_id || 'com.philtech.app' }}"               --web-dir "build" 2>/dev/null ||             npx cap init "${{ github.event.inputs.app_name }}"               "${{ github.event.inputs.package_id || 'com.philtech.app' }}"               --web-dir "www" 2>/dev/null ||             npx cap init "${{ github.event.inputs.app_name }}"               "${{ github.event.inputs.package_id || 'com.philtech.app' }}"               --web-dir "." 2>/dev/null || {
              echo "ERREUR: Impossible d'initialiser Capacitor"
              echo "is_capacitor=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi

          echo "=== Installation des dependances ==="
          npm install

          if grep -q '"build"' package.json 2>/dev/null; then
            echo "=== Build du frontend ==="
            npm run build
          fi

          if [ ! -d "android" ]; then
            echo "=== Ajout de la plateforme Android ==="
            npx cap add android || {
              echo "ERREUR: Impossible d'ajouter la plateforme Android avec Capacitor"
              echo "is_capacitor=false" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi

      # ============================================================
      # CORRECTIF ICONE/SPLASH : genere icone + splash avec
      # @capacitor/assets, APRES "cap add android" (le dossier
      # android/ doit exister) mais AVANT "cap sync android" (pour que
      # les resources generees soient bien copiees dans le projet natif).
      # ============================================================
      - name: Apply custom icon (Capacitor)
        if: ${{ github.event.inputs.icon_url != '' && steps.build.outputs.is_capacitor == 'true' }}
        run: |
          set -e
          cd "$SAVED_PROJECT_ROOT"
          echo "=== Telechargement de l'icone personnalisee ==="
          mkdir -p resources
          curl -f -L -o resources/icon.png "${{ github.event.inputs.icon_url }}"
          # NOTE : pas de splash genere a partir de l'icone (voir job
          # build-web pour le detail). @capacitor/assets recommande une
          # source bien plus grande pour le splash (2732x2732) qu'une
          # simple icone uploadee ; on se limite donc a l'icone. Sans
          # fichier resources/splash.png, capacitor-assets ignore
          # simplement la generation du splash au lieu d'echouer.
          echo "=== Generation de l'icone Android (@capacitor/assets) ==="
          npm install -g @capacitor/assets
          npx capacitor-assets generate --android             --iconBackgroundColor '#ffffff'

      # ============================================================
      # Splash desactive systematiquement : on ne genere plus de splash
      # personnalise (source trop petite pour les exigences de
      # @capacitor/assets), donc plutot que de laisser le splash
      # Capacitor par defaut (logo Capacitor visible ~2s), on force sa
      # duree a 0ms dans tous les cas pour qu'il ne s'affiche jamais.
      # ============================================================
      - name: Disable default splash screen
        if: ${{ steps.build.outputs.is_capacitor == 'true' }}
        run: |
          cd "$SAVED_PROJECT_ROOT" 2>/dev/null || exit 0
          if [ -f "capacitor.config.json" ]; then
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json'));
              cfg.plugins = cfg.plugins || {};
              cfg.plugins.SplashScreen = Object.assign({}, cfg.plugins.SplashScreen, { launchShowDuration: 0 });
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
              console.log('SplashScreen.launchShowDuration force a 0 dans capacitor.config.json');
            " || echo "Impossible de patcher capacitor.config.json, on continue"
          else
            echo "Pas de capacitor.config.json (probablement .ts/.js) - patch ignore"
          fi

      - name: Sync and build Capacitor Android
        run: |
          set -e
          cd "$SAVED_PROJECT_ROOT" 2>/dev/null || exit 0

          echo "=== Synchronisation Android ==="
          npx cap sync android || {
            echo "ERREUR: cap sync a echoue"
            exit 0
          }

          if [ -d "android" ]; then
            cd android
            chmod +x gradlew

            KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
            FORMAT="${{ github.event.inputs.output_format }}"

            if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
              echo "=== Build RELEASE ==="

              mkdir -p app
              cat > app/signing.gradle << GRADLE_EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_FILE")
                storePassword "${{ github.event.inputs.keystore_password }}"
                keyAlias "${{ github.event.inputs.keystore_alias }}"
                keyPassword "${{ github.event.inputs.keystore_password }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF

              if ! grep -q "signing.gradle" app/build.gradle 2>/dev/null; then
                echo "apply from: 'signing.gradle'" >> app/build.gradle
              fi

              # CORRECTIF : respecter output_format (apk/aab/both) au lieu
              # de ne generer que l'APK. assembleRelease -> APK,
              # bundleRelease -> AAB (App Bundle).
              if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
                ./gradlew assembleRelease
              fi
              if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
                ./gradlew bundleRelease
              fi
            else
              echo "=== Build DEBUG ==="
              ./gradlew assembleDebug
            fi
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-capacitor-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 4: BUILD REACT NATIVE
  # ============================================================
  build-react-native:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && needs.prepare.outputs.detected_type == 'react-native' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build React Native
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "package.json" -type f             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          if [ ! -f "metro.config.js" ] && [ ! -f "metro.config.ts" ]; then
            echo "ATTENTION: metro.config.js non trouve"
          fi

          npm install
          cd android
          chmod +x gradlew

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
          FORMAT="${{ github.event.inputs.output_format }}"

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            mkdir -p app
            cat > app/signing.gradle << GRADLE_EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_FILE")
                storePassword "${{ github.event.inputs.keystore_password }}"
                keyAlias "${{ github.event.inputs.keystore_alias }}"
                keyPassword "${{ github.event.inputs.keystore_password }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
            if ! grep -q "signing.gradle" app/build.gradle 2>/dev/null; then
              echo "apply from: 'signing.gradle'" >> app/build.gradle
            fi
            # CORRECTIF : respecter output_format (apk/aab/both)
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              ./gradlew assembleRelease
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              ./gradlew bundleRelease
            fi
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-react-native-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 5: BUILD KOTLIN / JAVA
  # ============================================================
  build-kotlin-java:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["kotlin","java","kotlin-multiplatform"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Kotlin/Java
        run: |
          set -e
          cd src/

          # CORRECTIF : cherche aussi build.gradle.kts (Kotlin DSL) et pas
          # seulement build.gradle (Groovy), pour rester coherent avec la
          # detection du job prepare.
          PROJECT_ROOT=$(find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -type f             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          chmod +x gradlew

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
          FORMAT="${{ github.event.inputs.output_format }}"

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            if ! grep -q "signingConfigs" app/build.gradle 2>/dev/null && ! grep -q "signingConfigs" app/build.gradle.kts 2>/dev/null; then
              mkdir -p app
              cat > app/signing.gradle << GRADLE_EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_FILE")
                storePassword "${{ github.event.inputs.keystore_password }}"
                keyAlias "${{ github.event.inputs.keystore_alias }}"
                keyPassword "${{ github.event.inputs.keystore_password }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
              if [ -f "app/build.gradle" ]; then
                echo "apply from: 'signing.gradle'" >> app/build.gradle
              elif [ -f "app/build.gradle.kts" ]; then
                echo "apply(from = \"signing.gradle\")" >> app/build.gradle.kts
              fi
            fi
            # CORRECTIF : respecter output_format (apk/aab/both)
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              ./gradlew assembleRelease
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              ./gradlew bundleRelease
            fi
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-kotlin-java-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 6: BUILD FLUTTER
  # ============================================================
  build-flutter:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && needs.prepare.outputs.detected_type == 'flutter' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Verify Flutter
        run: flutter doctor

      - name: Build Flutter
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "pubspec.yaml" -type f             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -not -path "*/build/*"             -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERREUR: pubspec.yaml non trouve"
            exit 1
          fi

          flutter pub get
          FORMAT="${{ github.event.inputs.output_format }}"

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            mkdir -p android
            cat > android/key.properties << EOF
          storePassword=${{ github.event.inputs.keystore_password }}
          keyPassword=${{ github.event.inputs.keystore_password }}
          keyAlias=${{ github.event.inputs.keystore_alias }}
          storeFile=$KEYSTORE_FILE
          EOF
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              flutter build apk --release
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              flutter build appbundle --release
            fi
          else
            flutter build apk --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-flutter-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 7: BUILD PYTHON
  # ============================================================
  build-python:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && needs.prepare.outputs.detected_type == 'python' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Python with Briefcase
        run: |
          set -e
          cd src/

          # CORRECTIF : ajout de buildozer.spec dans la recherche du
          # dossier racine du projet, pour rester coherent avec la
          # detection du job prepare.
          PROJECT_ROOT=$(find . -name "setup.py" -o -name "pyproject.toml" -o -name "app.py" -o -name "main.py" -o -name "buildozer.spec"             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -not -path "*/__pycache__/*"             -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          pip install briefcase
          briefcase create android
          briefcase build android
          # CORRECTION : suppression de l'option -p apk invalide avec
          # --adhoc-sign. Briefcase n'accepte pas ces deux options
          # combinees. --adhoc-sign suffit pour generer un APK non signe.
          briefcase package android --adhoc-sign

      - name: Sign APK with keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ -n "$APK_SIGNER" ] && [ -n "$KEYSTORE_FILE" ]; then
            for apk in $(find $GITHUB_WORKSPACE/src/ -name "*.apk"); do
              "$APK_SIGNER" sign                 --ks "$KEYSTORE_FILE"                 --ks-pass pass:"${{ github.event.inputs.keystore_password }}"                 --key-pass pass:"${{ github.event.inputs.keystore_password }}"                 --ks-key-alias "${{ github.event.inputs.keystore_alias }}"                 "$apk"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-python-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 8: BUILD .NET MAUI
  # ============================================================
  build-dotnet:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && contains(fromJson('["dotnet-maui","maui","csharp"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build .NET MAUI
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "*.csproj" -type f             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -not -path "*/bin/*"             -not -path "*/obj/*"             -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "ERREUR: Aucun fichier .csproj trouve"
            exit 1
          fi

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            dotnet publish "$CSPROJ" -f net8.0-android -c Release
          else
            dotnet build "$CSPROJ" -f net8.0-android -c Debug
          fi

      - name: Sign APK with keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ -n "$APK_SIGNER" ] && [ -n "$KEYSTORE_FILE" ]; then
            for apk in $(find $GITHUB_WORKSPACE/src/ -name "*.apk"); do
              "$APK_SIGNER" sign                 --ks "$KEYSTORE_FILE"                 --ks-pass pass:"${{ github.event.inputs.keystore_password }}"                 --key-pass pass:"${{ github.event.inputs.keystore_password }}"                 --ks-key-alias "${{ github.event.inputs.keystore_alias }}"                 "$apk"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dotnet-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 9: BUILD OTHER (Go, Godot, Lua, NativeScript)
  # ============================================================
  build-other:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["go","godot","lua","nativescript"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Go
        if: ${{ needs.prepare.outputs.detected_type == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Godot
        if: ${{ needs.prepare.outputs.detected_type == 'godot' }}
        run: |
          set -e
          GODOT_VERSION="4.2.2"
          # CORRECTION : ajout de verification d'erreur apres wget pour
          # eviter un echec silencieux si le serveur est indisponible.
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" || {
            echo "ERREUR: telechargement Godot engine impossible"
            exit 1
          }
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" || {
            echo "ERREUR: telechargement templates Godot impossible"
            exit 1
          }
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Setup Lua/Solar2D
        if: ${{ needs.prepare.outputs.detected_type == 'lua' }}
        run: |
          set -e
          wget -q https://github.com/coronalabs/corona/releases/download/3700/Solar2DConsole.tgz
          tar -xzf Solar2DConsole.tgz
          sudo mv Solar2DConsole /opt/solar2d
          echo "/opt/solar2d" >> $GITHUB_PATH

      - name: Setup Node for NativeScript
        if: ${{ needs.prepare.outputs.detected_type == 'nativescript' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NativeScript CLI
        if: ${{ needs.prepare.outputs.detected_type == 'nativescript' }}
        run: npm install -g nativescript

      - name: Install gomobile
        if: ${{ needs.prepare.outputs.detected_type == 'go' }}
        run: |
          set -e
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          sdkmanager "ndk;25.2.9519653" 2>/dev/null || true
          # CORRECTIF : "export" ne survit pas au-dela de cette etape sur
          # GitHub Actions (chaque step tourne dans un nouveau shell).
          # Il faut passer par $GITHUB_ENV pour que l'etape "Build project"
          # (qui appelle gomobile build) recoive bien cette variable au
          # lieu de retomber sur le NDK par defaut installe par
          # android-actions/setup-android (NDK 27+, qui ne supporte plus
          # les API < 21 et fait donc echouer gomobile avec son API cible
          # par defaut de 16).
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          gomobile init

      - name: Build project
        run: |
          set -e
          cd src/

          case "${{ needs.prepare.outputs.detected_type }}" in
            go)
              PROJECT_ROOT=$(find . -name "go.mod" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              # CORRECTIF : sans -androidapi, gomobile cible l'API 16 par
              # defaut, ce que les NDK recents (r23+) ne supportent plus
              # (minimum 19, 21 pour les plus recents). On fixe une API
              # compatible avec le NDK 25.2.9519653 installe ci-dessus.
              gomobile build -target=android -androidapi 21 -o app.apk .
              ;;
            godot)
              PROJECT_ROOT=$(find . -name "project.godot" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              if [ ! -f "export_presets.cfg" ]; then
                echo "ATTENTION: export_presets.cfg non trouve, creation d'un preset par defaut"
                cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          android_architectures/arm64-v8a=true
          EOF
              fi
              godot --headless --export-release "Android" build.apk
              ;;
            lua)
              PROJECT_ROOT=$(find . -name "build.settings" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              /opt/solar2d/solar2d.sh build android
              ;;
            nativescript)
              PROJECT_ROOT=$(find . -name "package.json" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              npm install
              [ -d "android" ] || ns platform add android

              KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

              if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
                ns build android --release --key-store-path "$KEYSTORE_FILE" --key-store-password "${{ github.event.inputs.keystore_password }}" --key-store-alias "${{ github.event.inputs.keystore_alias }}" --key-store-alias-password "${{ github.event.inputs.keystore_password }}"
              else
                ns build android --debug
              fi
              ;;
          esac

      - name: Sign APK with keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          [ -z "$APK_SIGNER" ] && APK_SIGNER=$(find /usr -name "apksigner" -type f 2>/dev/null | head -1)
          [ -z "$APK_SIGNER" ] && APK_SIGNER=$(find /opt -name "apksigner" -type f 2>/dev/null | head -1)
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ -n "$APK_SIGNER" ] && [ -n "$KEYSTORE_FILE" ]; then
            for apk in $(find $GITHUB_WORKSPACE/src/ -name "*.apk" -not -path "*/output/*"); do
              $APK_SIGNER sign                 --ks "$KEYSTORE_FILE"                 --ks-pass pass:"${{ github.event.inputs.keystore_password }}"                 --key-pass pass:"${{ github.event.inputs.keystore_password }}"                 --ks-key-alias "${{ github.event.inputs.keystore_alias }}"                 "$apk"
            done
          else
            for apk in $(find $GITHUB_WORKSPACE/src/ -name "*.apk" -not -path "*/output/*"); do
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256                 -keystore "$KEYSTORE_FILE"                 -storepass "${{ github.event.inputs.keystore_password }}"                 "$apk" "${{ github.event.inputs.keystore_alias }}"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-other-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 10: BUILD WINDOWS - Flutter
  # ============================================================
  build-windows-flutter:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && needs.prepare.outputs.detected_type == 'flutter' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter for Windows
        shell: bash
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "pubspec.yaml" -type f             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -not -path "*/build/*"             -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          flutter config --enable-windows-desktop
          flutter pub get
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            flutter build windows --release
          else
            flutter build windows --debug
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.exe" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-flutter-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 11: BUILD WINDOWS - .NET MAUI
  # ============================================================
  build-windows-dotnet:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && contains(fromJson('["dotnet-maui","maui","csharp"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build .NET MAUI for Windows
        shell: bash
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "*.csproj" -type f             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -not -path "*/bin/*"             -not -path "*/obj/*"             -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "ERREUR: Aucun fichier .csproj trouve"
            exit 1
          fi

          CONFIG="Debug"
          [ "${{ github.event.inputs.build_type }}" == "release" ] && CONFIG="Release"
          dotnet publish "$CSPROJ" -f net8.0-windows10.0.19041.0 -c "$CONFIG" -p:WindowsPackageType=None -p:SelfContained=true -r win-x64

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.exe" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-dotnet-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 12: BUILD WINDOWS - Python
  # ============================================================
  build-windows-python:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && needs.prepare.outputs.detected_type == 'python' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build with Briefcase for Windows
        shell: bash
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "setup.py" -o -name "pyproject.toml"             -not -path "*/node_modules/*"             -not -path "*/.git/*"             -not -path "*/__pycache__/*"             -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          pip install briefcase
          briefcase create windows app
          briefcase build windows app
          briefcase package windows app -p app

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.exe" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-python-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 13: BUILD WINDOWS - Go (cross-compilation depuis Linux)
  # ============================================================
  build-windows-go:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && needs.prepare.outputs.detected_type == 'go' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cross-compile for Windows
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "go.mod" -type f -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          GOOS=windows GOARCH=amd64 go build -o app.exe .

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "app.exe" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          echo "=== Fichiers dans output/ ==="
          ls -la $GITHUB_WORKSPACE/output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-go-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 14: POST-BUILD - Upload to R2 & Notify
  # ============================================================
  post-build:
    needs: [prepare, build-web, build-capacitor, build-react-native, build-kotlin-java, build-flutter, build-python, build-dotnet, build-other, build-windows-flutter, build-windows-dotnet, build-windows-python, build-windows-go]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.upload.outputs.status }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: build-*-${{ github.event.inputs.build_id }}
          merge-multiple: true
          continue-on-error: true

      - name: Download keystore artifact
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: keystore/
          continue-on-error: true

      - name: List artifacts
        run: |
          echo "=== Artifacts downloaded ==="
          find artifacts/ -type f 2>/dev/null || echo "No artifacts found"
          echo "=== Keystore ==="
          find keystore/ -type f 2>/dev/null || echo "No keystore found"

      - name: Upload APK to R2
        id: upload-apk
        run: |
          set -e
          APK_FILE=$(find artifacts/ -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "Uploading APK: $APK_FILE"
            curl -sf -X POST               -H "Content-Type: application/vnd.android.package-archive"               --data-binary @"$APK_FILE"               "${{ github.event.inputs.build_base_url }}/upload/apk" || echo "APK upload failed"
            echo "apk_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No APK found"
            echo "apk_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to R2
        id: upload-aab
        run: |
          set -e
          AAB_FILE=$(find artifacts/ -name "*.aab" -type f | head -1)
          if [ -n "$AAB_FILE" ]; then
            echo "Uploading AAB: $AAB_FILE"
            curl -sf -X POST               -H "Content-Type: application/octet-stream"               --data-binary @"$AAB_FILE"               "${{ github.event.inputs.build_base_url }}/upload/aab" || echo "AAB upload failed"
            echo "aab_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No AAB found"
            echo "aab_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload EXE to R2
        id: upload-exe
        if: ${{ github.event.inputs.platform == 'windows' }}
        run: |
          set -e
          EXE_FILE=$(find artifacts/ -name "*.exe" -type f | head -1)
          if [ -n "$EXE_FILE" ]; then
            echo "Uploading EXE: $EXE_FILE"
            curl -sf -X POST               -H "Content-Type: application/octet-stream"               --data-binary @"$EXE_FILE"               "${{ github.event.inputs.build_base_url }}/upload/exe" || echo "EXE upload failed"
            echo "exe_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No EXE found"
            echo "exe_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated keystore to R2
        id: upload-keystore
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          KS_FILE=$(find keystore/ -name "*.keystore" -type f | head -1)
          if [ -n "$KS_FILE" ]; then
            echo "Uploading keystore: $KS_FILE"
            curl -sf -X POST               -H "Content-Type: application/octet-stream"               --data-binary @"$KS_FILE"               "${{ github.event.inputs.build_base_url }}/upload/keystore" || echo "Keystore upload failed"
            echo "keystore_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore found"
            echo "keystore_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine build status and collect error messages
        id: build-status
        run: |
          # Vérifier si des artefacts ont été uploadés
          if [ "${{ steps.upload-apk.outputs.apk_uploaded }}" == "true" ] || [ "${{ steps.upload-aab.outputs.aab_uploaded }}" == "true" ] || [ "${{ steps.upload-exe.outputs.exe_uploaded }}" == "true" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "message=Build successful" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Récupérer la vraie erreur du job de build concerné
          echo "status=error" >> "$GITHUB_OUTPUT"
          
          # Collecter les erreurs de tous les jobs qui ont échoué
          ERROR_MSG="Build failed: "
          FOUND_ERROR=false
          
          # Vérifier chaque job de build qui aurait dû tourner
          if [ "${{ needs.build-web.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}Web build failed (cordova). "
            FOUND_ERROR=true
          fi
          if [ "${{ needs.build-capacitor.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}Capacitor build failed. "
            FOUND_ERROR=true
          fi
          if [ "${{ needs.build-react-native.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}React Native build failed. "
            FOUND_ERROR=true
          fi
          if [ "${{ needs.build-kotlin-java.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}Kotlin/Java build failed. "
            FOUND_ERROR=true
          fi
          if [ "${{ needs.build-flutter.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}Flutter build failed. "
            FOUND_ERROR=true
          fi
          if [ "${{ needs.build-python.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}Python build failed. "
            FOUND_ERROR=true
          fi
          if [ "${{ needs.build-dotnet.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}.NET MAUI build failed. "
            FOUND_ERROR=true
          fi
          if [ "${{ needs.build-other.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}Other build failed. "
            FOUND_ERROR=true
          fi
          
          if [ "$FOUND_ERROR" = true ]; then
            echo "message=${ERROR_MSG}Check the build logs for more details." >> "$GITHUB_OUTPUT"
          else
            echo "message=No artifacts were produced. Check the build logs for the error." >> "$GITHUB_OUTPUT"
          fi

      - name: Notify callback URL with download links
        # CORRECTIF : si "prepare" a deja envoye une notification d'erreur
        # detaillee (build_should_run == 'false'), on evite d'en renvoyer
        # une seconde ici qui ecraserait le message detaille.
        if: ${{ needs.prepare.outputs.build_should_run != 'false' }}
        id: upload
        run: |
          set -e
          BUILD_ID="${{ github.event.inputs.build_id }}"
          STATUS="${{ steps.build-status.outputs.status }}"
          MESSAGE="${{ steps.build-status.outputs.message }}"

          JSON_PAYLOAD=$(jq -n             --arg build_id "$BUILD_ID"             --arg state "$STATUS"             --arg message "$MESSAGE"             --arg detected_type "${{ needs.prepare.outputs.detected_type }}"             '{ 
                build_id: $build_id, 
                state: $state, 
                message: $message,
                detected_type: $detected_type 
              }')

          echo "Sending notification..."
          echo "$JSON_PAYLOAD"

          curl -sf -X POST -H "Content-Type: application/json"             -d "$JSON_PAYLOAD"             "${{ github.event.inputs.callback_url }}" || echo "Callback notification failed"

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"