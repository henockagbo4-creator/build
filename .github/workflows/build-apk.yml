name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      package_id:
        required: true
        type: string
      build_id:
        required: true
        type: string
      build_type:
        required: true
        type: string
      keystore_mode:
        required: true
        type: string
      keystore_url:
        required: false
        type: string
      keystore_password:
        required: false
        type: string
      keystore_alias:
        required: false
        type: string
      supabase_url:
        required: true
        type: string
      supabase_key:
        required: true
        type: string
      bucket:
        required: true
        type: string
      callback_url:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source zip
        run: |
          curl -L -o source.zip "${{ inputs.zip_url }}"
          ls -la source.zip
          file source.zip
          mkdir -p src
          unzip source.zip -d src/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: |
          npm install -g cordova

      - name: Download keystore if needed
        run: |
          if [ "${{ inputs.keystore_url }}" != "" ]; then
            curl -L -o my-release-key.keystore "${{ inputs.keystore_url }}"
            echo "Keystore downloaded"
            ls -la my-release-key.keystore
          fi

      - name: Build APK
        run: |
          cd src
          cordova create app ${{ inputs.package_id }} "${{ inputs.app_name }}"
          cd app
          cp -r ../www/* www/ 2>/dev/null || cp -r ../* www/ 2>/dev/null || true
          cordova platform add android
          
          if [ "${{ inputs.build_type }}" == "release" ] && [ -f "../../my-release-key.keystore" ]; then
            echo "Building RELEASE with signing"
            cordova build android --release -- \
              --keystore=../../my-release-key.keystore \
              --storePassword="${{ inputs.keystore_password }}" \
              --alias="${{ inputs.keystore_alias }}" \
              --password="${{ inputs.keystore_password }}"
          else
            echo "Building DEBUG"
            cordova build android --debug
          fi
          
          echo "=== APK built ==="
          ls -la platforms/android/app/build/outputs/apk/${{ inputs.build_type == 'release' && 'release' || 'debug' }}/

      - name: Upload APK to Supabase
        run: |
          APK_DIR="src/app/platforms/android/app/build/outputs/apk"
          if [ "${{ inputs.build_type }}" == "release" ]; then
            if [ -f "${APK_DIR}/release/app-release.apk" ]; then
              APK_PATH="${APK_DIR}/release/app-release.apk"
            else
              APK_PATH="${APK_DIR}/release/app-release-unsigned.apk"
            fi
          else
            APK_PATH="${APK_DIR}/debug/app-debug.apk"
          fi
          
          ls -la "$APK_PATH"
          curl -X POST "${{ inputs.supabase_url }}/storage/v1/object/${{ inputs.bucket }}/${{ inputs.build_id }}/app.apk" \
            -H "Authorization: Bearer ${{ inputs.supabase_key }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_PATH" \
            -w "\nHTTP Status: %{http_code}\n"

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: src/app/platforms/android/app/build/outputs/apk/*/*.apk
          retention-days: 1

      - name: Check build and notify backend
        run: |
          APK_DIR="src/app/platforms/android/app/build/outputs/apk"
          if [ "${{ inputs.build_type }}" == "release" ]; then
            if [ -f "${APK_DIR}/release/app-release.apk" ]; then
              APK_PATH="${APK_DIR}/release/app-release.apk"
              STATE="success"
            elif [ -f "${APK_DIR}/release/app-release-unsigned.apk" ]; then
              APK_PATH="${APK_DIR}/release/app-release-unsigned.apk"
              STATE="success"
            else
              STATE="error"
            fi
          else
            if [ -f "${APK_DIR}/debug/app-debug.apk" ]; then
              APK_PATH="${APK_DIR}/debug/app-debug.apk"
              STATE="success"
            else
              STATE="error"
            fi
          fi
          
          echo "Build state: $STATE"
          
          for i in 1 2 3 4 5; do
            curl -X POST "${{ inputs.callback_url }}" \
              -H "Content-Type: application/json" \
              -d "{\"state\":\"$STATE\",\"message\":\"Build $STATE\"}" && break
            echo "Retry $i..."
            sleep 15
          done
