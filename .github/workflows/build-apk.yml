name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL du zip source'
        required: true
        type: string
      app_name:
        description: 'Nom de l application'
        required: true
        type: string
      package_id:
        description: 'Package ID'
        required: false
        type: string
      build_id:
        description: 'ID du build'
        required: true
        type: string
      build_type:
        description: 'Type de build'
        required: true
        type: string
      output_format:
        description: 'Format de sortie (apk, aab, both)'
        required: false
        type: string
        default: 'apk'
      project_type:
        description: 'Type de projet'
        required: false
        type: string
        default: 'web'
      keystore_mode:
        description: 'Mode keystore'
        required: true
        type: string
      keystore_url:
        description: 'URL du keystore'
        required: false
        type: string
      keystore_password:
        description: 'Mot de passe du keystore'
        required: false
        type: string
      keystore_alias:
        description: 'Alias du keystore'
        required: false
        type: string
      callback_url:
        description: 'URL de callback'
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # ============================================================
  # JOB 1: PREPARE — Download source & setup common tools
  # ============================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_dir: ${{ steps.detect.outputs.source_dir }}
      src_path: ${{ steps.detect.outputs.src_path }}
      has_keystore: ${{ steps.keystore.outputs.has_keystore }}
      keystore_path: ${{ steps.keystore.outputs.keystore_path }}
    steps:
      - name: Download source zip
        run: |
          set -e
          curl -L -o source.zip "${{ github.event.inputs.zip_url }}"
          mkdir -p src
          unzip -o source.zip -d src/

      - name: Detect source directory
        id: detect
        run: |
          cd src
          ITEM_COUNT=$(ls -1 | wc -l)
          FIRST_ITEM=$(ls -1 | head -1)
          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            echo "source_dir=$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "src_path=src/$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "Single folder detected: $FIRST_ITEM"
          else
            echo "source_dir=." >> "$GITHUB_OUTPUT"
            echo "src_path=src" >> "$GITHUB_OUTPUT"
            echo "Files directly in src/"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle') }}
          restore-keys: android-sdk-${{ runner.os }}-

      - name: Generate keystore
        id: keystore
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore my-release-key.keystore \
            -alias "${{ github.event.inputs.keystore_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 10950 \
            -storetype PKCS12 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=${{ github.event.inputs.app_name }}, O=${{ github.event.inputs.app_name }} Developer, C=CI"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/my-release-key.keystore" >> "$GITHUB_OUTPUT"

      - name: Download user keystore
        id: keystore-download
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'upload' && github.event.inputs.keystore_url != '' }}
        run: |
          set -e
          curl -L -o my-release-key.keystore "${{ github.event.inputs.keystore_url }}"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/my-release-key.keystore" >> "$GITHUB_OUTPUT"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/
          retention-days: 1

      - name: Upload keystore artifact
        if: ${{ steps.keystore.outputs.has_keystore == 'true' || steps.keystore-download.outputs.has_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: my-release-key.keystore
          retention-days: 1

  # ============================================================
  # JOB 2: BUILD WEB (Cordova) — React, Vue, Web
  # ============================================================
  build-web:
    needs: prepare
    if: ${{ contains(fromJson('["web","react","vue"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install & build (React / Vue)
        if: ${{ contains(fromJson('["react","vue"]'), github.event.inputs.project_type) }}
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          if [ -f "package.json" ]; then
            npm install
            if grep -q '"build"' package.json; then
              npm run build
            fi
          fi

      - name: Build with Cordova
        run: |
          set -e
          cd src
          SOURCE_DIR="${{ needs.prepare.outputs.source_dir }}"
          COPY_FROM="$SOURCE_DIR"
          if [ -d "$SOURCE_DIR/dist" ]; then
            COPY_FROM="$SOURCE_DIR/dist"
          elif [ -d "$SOURCE_DIR/build" ]; then
            COPY_FROM="$SOURCE_DIR/build"
          fi
          PKG_ID="${{ github.event.inputs.package_id }}"
          if [ -z "$PKG_ID" ]; then
            PKG_ID="com.philtech.app"
          fi
          cordova create app "$PKG_ID" "${{ github.event.inputs.app_name }}"
          rm -rf app/www/*
          cp -r "$COPY_FROM"/* app/www/
          cd app
          cordova platform add android
          KEYSTORE_PATH="../../my-release-key.keystore"
          FORMAT="${{ github.event.inputs.output_format }}"
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$KEYSTORE_PATH" ]; then
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- \
                --packageType=apk \
                --keystore="$KEYSTORE_PATH" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- \
                --packageType=bundle \
                --keystore="$KEYSTORE_PATH" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
          else
            cordova build android --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 3: BUILD CAPACITOR / IONIC
  # ============================================================
  build-capacitor:
    needs: prepare
    if: ${{ contains(fromJson('["svelte","angular","solidjs","preact","ionic","capacitor"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Build Capacitor project
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          npm install
          npx cap sync android
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            mkdir -p app
            cat > app/signing.gradle << 'GRADLE_EOF'
            android {
              signingConfigs {
                release {
                  storeFile file(System.getenv("KEYSTORE_PATH"))
                  storePassword System.getenv("STORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
                }
              }
              buildTypes {
                release {
                  signingConfig signingConfigs.release
                }
              }
            }
            GRADLE_EOF
            echo "apply from: 'signing.gradle'" >> app/build.gradle
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-release-key.keystore"
            export STORE_PASSWORD="${{ github.event.inputs.keystore_password }}"
            export KEY_ALIAS="${{ github.event.inputs.keystore_alias }}"
            export KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 4: BUILD REACT NATIVE
  # ============================================================
  build-react-native:
    needs: prepare
    if: ${{ github.event.inputs.project_type == 'react-native' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build React Native
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          npm install
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            mkdir -p app
            cat > app/signing.gradle << 'GRADLE_EOF'
            android {
              signingConfigs {
                release {
                  storeFile file(System.getenv("KEYSTORE_PATH"))
                  storePassword System.getenv("STORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
                }
              }
              buildTypes {
                release {
                  signingConfig signingConfigs.release
                }
              }
            }
            GRADLE_EOF
            echo "apply from: 'signing.gradle'" >> app/build.gradle
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-release-key.keystore"
            export STORE_PASSWORD="${{ github.event.inputs.keystore_password }}"
            export KEY_ALIAS="${{ github.event.inputs.keystore_alias }}"
            export KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 5: BUILD KOTLIN / JAVA / KOTLIN MULTIPLATFORM
  # ============================================================
  build-kotlin-java:
    needs: prepare
    if: ${{ contains(fromJson('["kotlin","java","kotlin-multiplatform"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Kotlin/Java
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            if ! grep -q "signingConfigs" app/build.gradle 2>/dev/null; then
              cat > app/signing.gradle << 'GRADLE_EOF'
              android {
                signingConfigs {
                  release {
                    storeFile file(System.getenv("KEYSTORE_PATH"))
                    storePassword System.getenv("STORE_PASSWORD")
                    keyAlias System.getenv("KEY_ALIAS")
                    keyPassword System.getenv("KEY_PASSWORD")
                  }
                }
                buildTypes {
                  release {
                    signingConfig signingConfigs.release
                  }
                }
              }
              GRADLE_EOF
              echo "apply from: 'signing.gradle'" >> app/build.gradle
            fi
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-release-key.keystore"
            export STORE_PASSWORD="${{ github.event.inputs.keystore_password }}"
            export KEY_ALIAS="${{ github.event.inputs.keystore_alias }}"
            export KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 6: BUILD FLUTTER
  # ============================================================
  build-flutter:
    needs: prepare
    if: ${{ github.event.inputs.project_type == 'flutter' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Build Flutter
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          flutter pub get
          FORMAT="${{ github.event.inputs.output_format }}"
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            mkdir -p android
            cat > android/key.properties << EOF
            storePassword=${{ github.event.inputs.keystore_password }}
            keyPassword=${{ github.event.inputs.keystore_password }}
            keyAlias=${{ github.event.inputs.keystore_alias }}
            storeFile=$GITHUB_WORKSPACE/my-release-key.keystore
            EOF
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              flutter build apk --release
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              flutter build appbundle --release
            fi
          else
            flutter build apk --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 7: BUILD PYTHON
  # ============================================================
  build-python:
    needs: prepare
    if: ${{ github.event.inputs.project_type == 'python' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Build with Briefcase
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          pip install briefcase
          briefcase create android
          briefcase build android
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            briefcase package android -p apk
          else
            briefcase package android -p apk --adhoc-sign
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 8: BUILD .NET MAUI
  # ============================================================
  build-dotnet:
    needs: prepare
    if: ${{ contains(fromJson('["dotnet-maui","maui","csharp"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build .NET MAUI
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            dotnet publish "$CSPROJ" -f net8.0-android -c Release
          else
            dotnet build "$CSPROJ" -f net8.0-android -c Debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 9: BUILD GO / GODOT / LUA / RUBY / NATIVESCRIPT
  # ============================================================
  build-other:
    needs: prepare
    if: ${{ contains(fromJson('["go","godot","lua","ruby","nativescript"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Go
        if: ${{ github.event.inputs.project_type == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Ruby
        if: ${{ github.event.inputs.project_type == 'ruby' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Godot
        if: ${{ github.event.inputs.project_type == 'godot' }}
        run: |
          set -e
          GODOT_VERSION="4.2.2"
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Setup Lua/Solar2D
        if: ${{ github.event.inputs.project_type == 'lua' }}
        run: |
          set -e
          wget -q https://github.com/coronalabs/corona/releases/download/3700/Solar2DConsole.tgz
          tar -xzf Solar2DConsole.tgz
          sudo mv Solar2DConsole /opt/solar2d
          echo "/opt/solar2d" >> $GITHUB_PATH

      - name: Setup Node for NativeScript
        if: ${{ github.event.inputs.project_type == 'nativescript' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install NativeScript CLI
        if: ${{ github.event.inputs.project_type == 'nativescript' }}
        run: npm install -g nativescript

      - name: Install gomobile
        if: ${{ github.event.inputs.project_type == 'go' }}
        run: |
          set -e
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Install RubyMotion
        if: ${{ github.event.inputs.project_type == 'ruby' }}
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y build-essential
          gem install motion-game || true

      - name: Build project
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          case "${{ github.event.inputs.project_type }}" in
            go)
              gomobile build -target=android -o app.apk .
              ;;
            godot)
              if [ ! -f "project.godot" ]; then
                echo "ERROR: project.godot not found"
                exit 1
              fi
              godot --headless --export-release "Android" build.apk
              ;;
            lua)
              if [ ! -f "build.settings" ]; then
                echo "ERROR: build.settings not found"
                exit 1
              fi
              /opt/solar2d/solar2d.sh build android
              ;;
            ruby)
              rake android:build || echo "Build RubyMotion echoue — licence requise."
              ;;
            nativescript)
              npm install
              ns platform add android
              if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
                ns build android --release --key-store-path "$GITHUB_WORKSPACE/my-release-key.keystore" --key-store-password "${{ github.event.inputs.keystore_password }}" --key-store-alias "${{ github.event.inputs.keystore_alias }}" --key-store-alias-password "${{ github.event.inputs.keystore_password }}"
              else
                ns build android --debug
              fi
              ;;
          esac

      - name: Universal APK signing (apksigner)
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          echo "=== Universal APK signing with apksigner ==="
          APK_SIGNER=$(find $ANDROID_SDK_ROOT -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -z "$APK_SIGNER" ]; then
            APK_SIGNER=$(find /usr -name "apksigner" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_SIGNER" ]; then
            APK_SIGNER=$(find /opt -name "apksigner" -type f 2>/dev/null | head -1)
          fi

          if [ -n "$APK_SIGNER" ]; then
            echo "Found apksigner at: $APK_SIGNER"
            for apk in $(find . -name "*.apk" -not -path "./output/*"); do
              echo "Signing $apk with apksigner..."
              $APK_SIGNER sign \
                --ks "$GITHUB_WORKSPACE/my-release-key.keystore" \
                --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --ks-key-alias "${{ github.event.inputs.keystore_alias }}" \
                "$apk"
              echo "Signed: $apk"
            done
          else
            echo "apksigner not found, falling back to jarsigner..."
            for apk in $(find . -name "*.apk" -not -path "./output/*"); do
              echo "Signing $apk with jarsigner..."
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$GITHUB_WORKSPACE/my-release-key.keystore" \
                -storepass "${{ github.event.inputs.keystore_password }}" \
                "$apk" "${{ github.event.inputs.keystore_alias }}"
              echo "Signed: $apk"
            done
          fi
          echo "=== Universal signing complete ==="

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 10: POST-BUILD — Upload to R2 & Notify
  # ============================================================
  post-build:
    needs: [prepare, build-web, build-capacitor, build-react-native, build-kotlin-java, build-flutter, build-python, build-dotnet, build-other]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: build-*
          merge-multiple: true

      - name: Download keystore artifact
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: keystore/

      - name: List artifacts
        run: |
          echo "=== Artifacts downloaded ==="
          find artifacts/ -type f || true
          echo "=== Keystore ==="
          find keystore/ -type f 2>/dev/null || true

      - name: Upload APK to R2
        if: ${{ hashFiles('artifacts/*.apk') != '' }}
        run: |
          set -e
          for apk in artifacts/*.apk; do
            echo "Uploading $apk..."
            curl -X POST \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @$apk \
              "${{ github.event.inputs.callback_url }}/upload/apk"
          done

      - name: Upload AAB to R2
        if: ${{ hashFiles('artifacts/*.aab') != '' }}
        run: |
          set -e
          for aab in artifacts/*.aab; do
            echo "Uploading $aab..."
            curl -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary @$aab \
              "${{ github.event.inputs.callback_url }}/upload/aab"
          done

      - name: Upload generated keystore to R2
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' && hashFiles('keystore/*.keystore') != '' }}
        run: |
          set -e
          for ks in keystore/*.keystore; do
            echo "Uploading keystore $ks..."
            curl -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary @$ks \
              "${{ github.event.inputs.callback_url }}/upload/keystore"
          done

      - name: Notify callback URL
        run: |
          set -e
          echo "Notifying callback..."
          # Check if any build job succeeded
          NEEDS_JSON='${{ toJson(needs) }}'
          if echo "$NEEDS_JSON" | grep -q '"result": "success"'; then
            STATUS="success"
          else
            STATUS="error"
          fi
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"build_id\":\"${{ github.event.inputs.build_id }}\",\"status\":\"$STATUS\",\"message\":\"Build $STATUS\"}" \
            "${{ github.event.inputs.callback_url }}"
