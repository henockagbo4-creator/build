name: PhilBuilder — Universal Build (tout-en-un)

# ============================================================
# Un seul fichier. Aucun script externe : chaque job embarque
# ses propres fonctions (callback, upload, extraction, icone,
# keystore) + sa logique de build, dans un unique bloc "run".
# Declenche par le worker (workflow_dispatch) avec les inputs
# deja utilises par apk-builder / api-philbuilder.
# ============================================================
on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      package_id:
        required: false
        type: string
        default: com.philbuilder.app
      build_id:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: debug
      output_format:
        required: false
        type: string
        default: apk
      project_type:
        required: true
        type: string
      platform:
        required: false
        type: string
        default: android
      icon_url:
        required: false
        type: string
        default: ""
      keystore_mode:
        required: false
        type: string
        default: generate
      keystore_url:
        required: false
        type: string
        default: ""
      keystore_password:
        required: false
        type: string
        default: PhilTech2026
      keystore_alias:
        required: false
        type: string
        default: release
      callback_url:
        required: true
        type: string
      build_base_url:
        required: true
        type: string
      api_key:
        required: false
        type: string
        default: ""

env:
  ZIP_URL: ${{ inputs.zip_url }}
  APP_NAME: ${{ inputs.app_name }}
  PACKAGE_ID: ${{ inputs.package_id }}
  BUILD_ID: ${{ inputs.build_id }}
  BUILD_TYPE: ${{ inputs.build_type }}
  OUTPUT_FORMAT: ${{ inputs.output_format }}
  PROJECT_TYPE: ${{ inputs.project_type }}
  PLATFORM: ${{ inputs.platform }}
  ICON_URL: ${{ inputs.icon_url }}
  KEYSTORE_MODE: ${{ inputs.keystore_mode }}
  KEYSTORE_URL: ${{ inputs.keystore_url }}
  KEYSTORE_PASSWORD: ${{ inputs.keystore_password }}
  KEYSTORE_ALIAS: ${{ inputs.keystore_alias }}
  CALLBACK_URL: ${{ inputs.callback_url }}
  BUILD_BASE_URL: ${{ inputs.build_base_url }}

jobs:

  # ===========================================================
  # 1) Web / Cordova — web, react, vue
  # ===========================================================
  build-cordova:
    if: contains(fromJSON('["web","react","vue"]'), inputs.project_type)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          # ============================================================
          # lib.sh — fonctions partagées par tous les builders PhilBuilder
          # À sourcer en début de chaque script : `source scripts/lib.sh`
          # ============================================================
          set -uo pipefail
          # NB: pas de `set -e` global ici — chaque builder gère ses propres
          # erreurs et appelle `fail "message"` explicitement, pour pouvoir
          # toujours prévenir le callback avant de mourir.

          WORKDIR="${WORKDIR:-$PWD/work}"
          SRC_DIR="$WORKDIR/src"
          OUT_DIR="$WORKDIR/out"
          mkdir -p "$SRC_DIR" "$OUT_DIR"

          # ------------------------------------------------------------
          # Callback vers le worker (état + message)
          # ------------------------------------------------------------
          callback() {
            local state="$1"
            local message="$2"
            echo "➡️  [callback] $state — $message"
            curl -sS -m 15 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$(python3 - "$state" "$message" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "message": sys.argv[2]}))
          PY
          )" >/dev/null 2>&1 || echo "⚠️  callback injoignable (on continue quand même)"
          }

          # En cas d'échec définitif : prévient le worker puis stoppe le job
          fail() {
            local message="$1"
            echo "❌ ERREUR: $message"
            callback "error" "$message"
            exit 1
          }

          # ------------------------------------------------------------
          # Upload d'un artefact final vers R2 via le worker
          # type ∈ apk | aab | exe | keystore
          # ------------------------------------------------------------
          upload_artifact() {
            local file="$1"
            local type="$2"
            if [ ! -f "$file" ]; then
              echo "⚠️  upload_artifact: fichier introuvable ($file), ignoré"
              return 1
            fi
            echo "⬆️  Upload $type : $file ($(du -h "$file" | cut -f1))"
            local status
            status=$(curl -sS -m 300 -o /dev/null -w "%{http_code}" \
              -X POST "$BUILD_BASE_URL/upload/$type" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file")
            if [ "$status" != "200" ]; then
              echo "⚠️  upload $type a répondu HTTP $status"
              return 1
            fi
            return 0
          }

          # ------------------------------------------------------------
          # Téléchargement + extraction permissive du zip source
          # Ne suppose RIEN sur la structure : si tout est niché dans un
          # seul sous-dossier (cas fréquent des zips "glisser-déposer"),
          # on remonte automatiquement d'un niveau.
          # ------------------------------------------------------------
          download_source() {
            callback "building" "Téléchargement du projet..."
            curl -sSL -m 120 -o "$WORKDIR/source.zip" "$ZIP_URL" \
              || fail "Impossible de télécharger le zip source (zip_url injoignable)"

            [ -s "$WORKDIR/source.zip" ] || fail "Le zip source est vide ou introuvable"

            unzip -q -o "$WORKDIR/source.zip" -d "$SRC_DIR" \
              || fail "Archive .zip corrompue ou invalide"

            # Aplatir un unique sous-dossier racine (cas "MonProjet/MonProjet/src...")
            local entries
            entries=$(find "$SRC_DIR" -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$entries" -eq 1 ] && [ -d "$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)" ]; then
              local inner
              inner="$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)"
              echo "📂 Sous-dossier unique détecté ($inner) — aplatissement"
              shopt -s dotglob
              mv "$inner"/* "$SRC_DIR"/ 2>/dev/null || true
              shopt -u dotglob
              rmdir "$inner" 2>/dev/null || true
            fi

            echo "📁 Contenu du projet après extraction :"
            find "$SRC_DIR" -maxdepth 2 | sed "s|$SRC_DIR|.|"
            callback "building" "Projet extrait, analyse de la structure..."
          }

          # Cherche un fichier par motif n'importe où dans SRC_DIR (permissif,
          # insensible à l'emplacement exact demandé par le langage)
          find_any() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | head -n 1
          }

          find_dir_containing() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | xargs -r -n1 dirname | head -n 1
          }

          # ------------------------------------------------------------
          # Icône : téléchargement (utilisée par chaque builder pour
          # remplacer les icônes par défaut du framework généré)
          # ------------------------------------------------------------
          download_icon_if_any() {
            ICON_LOCAL=""
            if [ -n "${ICON_URL:-}" ]; then
              ICON_LOCAL="$WORKDIR/icon.png"
              if curl -sSL -m 30 -o "$ICON_LOCAL" "$ICON_URL"; then
                echo "🎨 Icône téléchargée : $ICON_LOCAL"
              else
                echo "⚠️  Icône fournie mais injoignable, utilisation de l'icône par défaut"
                ICON_LOCAL=""
              fi
            fi
            export ICON_LOCAL
          }

          # ------------------------------------------------------------
          # Keystore Android : génère une clé si demandé, ou télécharge
          # celle fournie par l'utilisateur.
          # Résultat : $KEYSTORE_PATH prêt à l'emploi pour la signature.
          # ------------------------------------------------------------
          prepare_keystore() {
            KEYSTORE_PATH="$WORKDIR/release.keystore"
            if [ "${KEYSTORE_MODE:-generate}" = "upload" ] && [ -n "${KEYSTORE_URL:-}" ]; then
              callback "building" "Récupération de votre clé de signature..."
              curl -sSL -m 30 -o "$KEYSTORE_PATH" "$KEYSTORE_URL" \
                || fail "Impossible de télécharger la clé de signature fournie"
            else
              callback "building" "Génération de la clé de signature..."
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_PATH" \
                -alias "${KEYSTORE_ALIAS:-release}" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -keypass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -dname "CN=${APP_NAME:-App}, OU=PhilBuilder, O=PhilTech, C=CI" \
                || fail "Échec de la génération de la clé de signature"
              upload_artifact "$KEYSTORE_PATH" "keystore" || true
            fi
            export KEYSTORE_PATH
          }

          # ------------------------------------------------------------
          # Renomme/copie le premier fichier trouvé matching $2 vers $1,
          # ne casse rien si absent (mode best-effort)
          # ------------------------------------------------------------
          copy_if_exists() {
            local dst="$1" pattern="$2"
            local src
            src=$(find_any "$pattern")
            if [ -n "$src" ]; then
              cp "$src" "$dst"
              return 0
            fi
            return 1
          }

          echo "✅ lib.sh chargée — WORKDIR=$WORKDIR"

          # ============================================================
          # BUILD LOGIC
          # ============================================================

          download_source
          download_icon_if_any

          WWW_DIR="$WORKDIR/www"
          mkdir -p "$WWW_DIR"

          if [ -f "$SRC_DIR/package.json" ] && [ "$PROJECT_TYPE" != "web" ]; then
            callback "building" "Détection d'un projet $PROJECT_TYPE — npm install..."
            cd "$SRC_DIR"
            npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tail -n 50 \
              || npm install --no-audit --no-fund --force 2>&1 | tail -n 50 \
              || fail "npm install a échoué"

            callback "building" "Build $PROJECT_TYPE (npm run build)..."
            npm run build 2>&1 | tail -n 80 || echo "⚠️  'npm run build' a échoué, on tente un fallback"

            # Fallback permissif : on cherche un dossier de build connu
            BUILD_OUT=""
            for cand in dist build out public www .output/public; do
              if [ -d "$SRC_DIR/$cand" ] && [ "$(find "$SRC_DIR/$cand" -name '*.html' | wc -l)" -gt 0 ]; then
                BUILD_OUT="$SRC_DIR/$cand"
                break
              fi
            done
            if [ -z "$BUILD_OUT" ]; then
              echo "⚠️  Aucun dossier de build standard trouvé — utilisation de la racine du projet telle quelle"
              BUILD_OUT="$SRC_DIR"
            fi
            cp -r "$BUILD_OUT"/* "$WWW_DIR"/ 2>/dev/null || true
          else
            # project_type == web (site statique) : on prend tel quel, en
            # excluant node_modules éventuels
            callback "building" "Projet statique détecté — copie directe"
            cd "$SRC_DIR"
            find . -maxdepth 1 ! -name node_modules ! -name '.' -exec cp -r {} "$WWW_DIR"/ \;
          fi

          [ -f "$WWW_DIR/index.html" ] || find "$WWW_DIR" -iname "index.htm*" -exec cp {} "$WWW_DIR/index.html" \; 2>/dev/null || true
          [ -f "$WWW_DIR/index.html" ] || fail "Aucun index.html trouvé après build — impossible de continuer"

          callback "building" "Création du projet Cordova..."
          cd "$WORKDIR"
          npm install -g cordova --no-audit --no-fund 2>&1 | tail -n 20
          cordova create cdvapp "$PACKAGE_ID" "$APP_NAME" || fail "cordova create a échoué"
          cd cdvapp
          rm -rf www
          cp -r "$WWW_DIR" www

          cordova platform add android || fail "Impossible d'ajouter la plateforme Android"

          if [ -n "${ICON_LOCAL:-}" ]; then
            mkdir -p res/icon/android
            for size in 36 48 72 96 144 192; do cp "$ICON_LOCAL" "res/icon/android/icon-$size.png"; done
          fi

          callback "building" "Compilation Gradle ($BUILD_TYPE)..."
          if [ "$BUILD_TYPE" = "release" ]; then
            prepare_keystore
            cordova build android --release -- \
              --keystore="$KEYSTORE_PATH" --storePassword="$KEYSTORE_PASSWORD" \
              --alias="$KEYSTORE_ALIAS" --password="$KEYSTORE_PASSWORD" \
              2>&1 | tail -n 100 || fail "Le build Cordova release a échoué"
          else
            cordova build android 2>&1 | tail -n 100 || fail "Le build Cordova debug a échoué"
          fi

          APK=$(find platforms/android/app/build/outputs/apk -iname "*.apk" | head -n 1)
          [ -n "$APK" ] || fail "Aucun APK produit par Cordova/Gradle"
          upload_artifact "$APK" "apk" || fail "Échec de l'upload de l'APK"

          if [ "$OUTPUT_FORMAT" = "aab" ] || [ "$OUTPUT_FORMAT" = "both" ]; then
            cd platforms/android
            ./gradlew bundleRelease 2>&1 | tail -n 60 || echo "⚠️  bundleRelease a échoué, AAB non fourni"
            AAB=$(find app/build/outputs/bundle -iname "*.aab" | head -n 1)
            [ -n "$AAB" ] && upload_artifact "$AAB" "aab"
            cd ../..
          fi

          callback "success" "Build terminé avec succès"
      - name: Callback en cas d'echec inattendu
        if: failure()
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Echec inattendu du job build-cordova (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 2) Web moderne / Capacitor — svelte, angular, solidjs, preact, ionic, capacitor, nativescript
  # ===========================================================
  build-capacitor:
    if: contains(fromJSON('["svelte","angular","solidjs","preact","ionic","capacitor","nativescript"]'), inputs.project_type)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          # ============================================================
          # lib.sh — fonctions partagées par tous les builders PhilBuilder
          # À sourcer en début de chaque script : `source scripts/lib.sh`
          # ============================================================
          set -uo pipefail
          # NB: pas de `set -e` global ici — chaque builder gère ses propres
          # erreurs et appelle `fail "message"` explicitement, pour pouvoir
          # toujours prévenir le callback avant de mourir.

          WORKDIR="${WORKDIR:-$PWD/work}"
          SRC_DIR="$WORKDIR/src"
          OUT_DIR="$WORKDIR/out"
          mkdir -p "$SRC_DIR" "$OUT_DIR"

          # ------------------------------------------------------------
          # Callback vers le worker (état + message)
          # ------------------------------------------------------------
          callback() {
            local state="$1"
            local message="$2"
            echo "➡️  [callback] $state — $message"
            curl -sS -m 15 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$(python3 - "$state" "$message" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "message": sys.argv[2]}))
          PY
          )" >/dev/null 2>&1 || echo "⚠️  callback injoignable (on continue quand même)"
          }

          # En cas d'échec définitif : prévient le worker puis stoppe le job
          fail() {
            local message="$1"
            echo "❌ ERREUR: $message"
            callback "error" "$message"
            exit 1
          }

          # ------------------------------------------------------------
          # Upload d'un artefact final vers R2 via le worker
          # type ∈ apk | aab | exe | keystore
          # ------------------------------------------------------------
          upload_artifact() {
            local file="$1"
            local type="$2"
            if [ ! -f "$file" ]; then
              echo "⚠️  upload_artifact: fichier introuvable ($file), ignoré"
              return 1
            fi
            echo "⬆️  Upload $type : $file ($(du -h "$file" | cut -f1))"
            local status
            status=$(curl -sS -m 300 -o /dev/null -w "%{http_code}" \
              -X POST "$BUILD_BASE_URL/upload/$type" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file")
            if [ "$status" != "200" ]; then
              echo "⚠️  upload $type a répondu HTTP $status"
              return 1
            fi
            return 0
          }

          # ------------------------------------------------------------
          # Téléchargement + extraction permissive du zip source
          # Ne suppose RIEN sur la structure : si tout est niché dans un
          # seul sous-dossier (cas fréquent des zips "glisser-déposer"),
          # on remonte automatiquement d'un niveau.
          # ------------------------------------------------------------
          download_source() {
            callback "building" "Téléchargement du projet..."
            curl -sSL -m 120 -o "$WORKDIR/source.zip" "$ZIP_URL" \
              || fail "Impossible de télécharger le zip source (zip_url injoignable)"

            [ -s "$WORKDIR/source.zip" ] || fail "Le zip source est vide ou introuvable"

            unzip -q -o "$WORKDIR/source.zip" -d "$SRC_DIR" \
              || fail "Archive .zip corrompue ou invalide"

            # Aplatir un unique sous-dossier racine (cas "MonProjet/MonProjet/src...")
            local entries
            entries=$(find "$SRC_DIR" -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$entries" -eq 1 ] && [ -d "$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)" ]; then
              local inner
              inner="$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)"
              echo "📂 Sous-dossier unique détecté ($inner) — aplatissement"
              shopt -s dotglob
              mv "$inner"/* "$SRC_DIR"/ 2>/dev/null || true
              shopt -u dotglob
              rmdir "$inner" 2>/dev/null || true
            fi

            echo "📁 Contenu du projet après extraction :"
            find "$SRC_DIR" -maxdepth 2 | sed "s|$SRC_DIR|.|"
            callback "building" "Projet extrait, analyse de la structure..."
          }

          # Cherche un fichier par motif n'importe où dans SRC_DIR (permissif,
          # insensible à l'emplacement exact demandé par le langage)
          find_any() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | head -n 1
          }

          find_dir_containing() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | xargs -r -n1 dirname | head -n 1
          }

          # ------------------------------------------------------------
          # Icône : téléchargement (utilisée par chaque builder pour
          # remplacer les icônes par défaut du framework généré)
          # ------------------------------------------------------------
          download_icon_if_any() {
            ICON_LOCAL=""
            if [ -n "${ICON_URL:-}" ]; then
              ICON_LOCAL="$WORKDIR/icon.png"
              if curl -sSL -m 30 -o "$ICON_LOCAL" "$ICON_URL"; then
                echo "🎨 Icône téléchargée : $ICON_LOCAL"
              else
                echo "⚠️  Icône fournie mais injoignable, utilisation de l'icône par défaut"
                ICON_LOCAL=""
              fi
            fi
            export ICON_LOCAL
          }

          # ------------------------------------------------------------
          # Keystore Android : génère une clé si demandé, ou télécharge
          # celle fournie par l'utilisateur.
          # Résultat : $KEYSTORE_PATH prêt à l'emploi pour la signature.
          # ------------------------------------------------------------
          prepare_keystore() {
            KEYSTORE_PATH="$WORKDIR/release.keystore"
            if [ "${KEYSTORE_MODE:-generate}" = "upload" ] && [ -n "${KEYSTORE_URL:-}" ]; then
              callback "building" "Récupération de votre clé de signature..."
              curl -sSL -m 30 -o "$KEYSTORE_PATH" "$KEYSTORE_URL" \
                || fail "Impossible de télécharger la clé de signature fournie"
            else
              callback "building" "Génération de la clé de signature..."
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_PATH" \
                -alias "${KEYSTORE_ALIAS:-release}" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -keypass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -dname "CN=${APP_NAME:-App}, OU=PhilBuilder, O=PhilTech, C=CI" \
                || fail "Échec de la génération de la clé de signature"
              upload_artifact "$KEYSTORE_PATH" "keystore" || true
            fi
            export KEYSTORE_PATH
          }

          # ------------------------------------------------------------
          # Renomme/copie le premier fichier trouvé matching $2 vers $1,
          # ne casse rien si absent (mode best-effort)
          # ------------------------------------------------------------
          copy_if_exists() {
            local dst="$1" pattern="$2"
            local src
            src=$(find_any "$pattern")
            if [ -n "$src" ]; then
              cp "$src" "$dst"
              return 0
            fi
            return 1
          }

          echo "✅ lib.sh chargée — WORKDIR=$WORKDIR"

          # ============================================================
          # BUILD LOGIC
          # ============================================================

          download_source
          download_icon_if_any
          cd "$SRC_DIR"

          # ---- NativeScript a un pipeline distinct (pas de "web build" classique) ----
          if [ "$PROJECT_TYPE" = "nativescript" ]; then
            callback "building" "Projet NativeScript détecté — installation..."
            npm install -g @nativescript/cli --no-audit --no-fund 2>&1 | tail -n 20
            npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tail -n 50 \
              || npm install --no-audit --no-fund --force 2>&1 | tail -n 50
            [ -f "nativescript.config.ts" ] || [ -f "nsconfig.json" ] \
              || echo "⚠️  Config NativeScript absente — ns tentera un mode par défaut"
            callback "building" "Compilation NativeScript Android ($BUILD_TYPE)..."
            if [ "$BUILD_TYPE" = "release" ]; then
              prepare_keystore
              ns build android --release \
                --key-store-path "$KEYSTORE_PATH" --key-store-password "$KEYSTORE_PASSWORD" \
                --key-store-alias "$KEYSTORE_ALIAS" --key-store-alias-password "$KEYSTORE_PASSWORD" \
                2>&1 | tail -n 100 || fail "Build NativeScript release échoué"
            else
              ns build android 2>&1 | tail -n 100 || fail "Build NativeScript debug échoué"
            fi
            APK=$(find platforms/android -iname "*.apk" 2>/dev/null | head -n 1)
            [ -n "$APK" ] || fail "Aucun APK produit par NativeScript"
            upload_artifact "$APK" "apk" || fail "Échec upload APK"
            callback "success" "Build terminé avec succès"
            exit 0
          fi

          # ---- Pipeline Capacitor générique (svelte/angular/solid/preact/ionic/capacitor) ----
          WEB_DIR="$WORKDIR/webdist"
          mkdir -p "$WEB_DIR"

          if [ -f "package.json" ]; then
            callback "building" "npm install ($PROJECT_TYPE)..."
            npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tail -n 60 \
              || npm install --no-audit --no-fund --force 2>&1 | tail -n 60 \
              || fail "npm install a échoué"

            callback "building" "Build $PROJECT_TYPE..."
            npm run build 2>&1 | tail -n 100 \
              || npm run build:prod 2>&1 | tail -n 100 \
              || echo "⚠️  Aucun script build standard n'a fonctionné — fallback"

            BUILD_OUT=""
            for cand in dist build www out .output/public dist/*/browser; do
              for d in $SRC_DIR/$cand; do
                if [ -d "$d" ] && [ "$(find "$d" -name '*.html' 2>/dev/null | wc -l)" -gt 0 ]; then
                  BUILD_OUT="$d"; break 2
                fi
              done
            done
            [ -z "$BUILD_OUT" ] && BUILD_OUT="$SRC_DIR" && echo "⚠️  Fallback : copie de la racine du projet"
            cp -r "$BUILD_OUT"/* "$WEB_DIR"/ 2>/dev/null || true
          else
            echo "⚠️  Pas de package.json — projet statique, copie directe"
            cp -r "$SRC_DIR"/* "$WEB_DIR"/ 2>/dev/null || true
          fi

          [ -f "$WEB_DIR/index.html" ] || fail "Aucun index.html trouvé dans le build — vérifie ton projet"

          callback "building" "Initialisation Capacitor..."
          cd "$WORKDIR"
          mkdir capapp && cd capapp
          cp -r "$WEB_DIR" www
          npm init -y >/dev/null 2>&1
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund 2>&1 | tail -n 30 \
            || fail "Installation Capacitor échouée"
          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=www 2>&1 | tail -n 20 || true
          npx cap add android 2>&1 | tail -n 40 || fail "Impossible d'ajouter la plateforme Android (Capacitor)"
          npx cap copy android 2>&1 | tail -n 20
          npx cap sync android 2>&1 | tail -n 40

          if [ -n "${ICON_LOCAL:-}" ]; then
            for d in android/app/src/main/res/mipmap-*; do cp "$ICON_LOCAL" "$d/ic_launcher.png" 2>/dev/null || true; done
          fi

          callback "building" "Compilation Gradle ($BUILD_TYPE)..."
          cd android
          chmod +x gradlew 2>/dev/null || true
          if [ "$BUILD_TYPE" = "release" ]; then
            prepare_keystore
            cp "$KEYSTORE_PATH" app/release.keystore
            cat >> app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "$KEYSTORE_PASSWORD"
                      keyAlias "$KEYSTORE_ALIAS"
                      keyPassword "$KEYSTORE_PASSWORD"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
            ./gradlew assembleRelease 2>&1 | tail -n 100 || fail "assembleRelease a échoué"
            APK=$(find app/build/outputs/apk/release -iname "*.apk" | head -n 1)
          else
            ./gradlew assembleDebug 2>&1 | tail -n 100 || fail "assembleDebug a échoué"
            APK=$(find app/build/outputs/apk/debug -iname "*.apk" | head -n 1)
          fi
          [ -n "$APK" ] || fail "Aucun APK produit"
          upload_artifact "$APK" "apk" || fail "Échec upload APK"

          callback "success" "Build terminé avec succès"
      - name: Callback en cas d'echec inattendu
        if: failure()
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Echec inattendu du job build-capacitor (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 3) Mobile natif — react-native, kotlin, java, kotlin-multiplatform
  # ===========================================================
  build-native:
    if: contains(fromJSON('["react-native","kotlin","java","kotlin-multiplatform"]'), inputs.project_type)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          # ============================================================
          # lib.sh — fonctions partagées par tous les builders PhilBuilder
          # À sourcer en début de chaque script : `source scripts/lib.sh`
          # ============================================================
          set -uo pipefail
          # NB: pas de `set -e` global ici — chaque builder gère ses propres
          # erreurs et appelle `fail "message"` explicitement, pour pouvoir
          # toujours prévenir le callback avant de mourir.

          WORKDIR="${WORKDIR:-$PWD/work}"
          SRC_DIR="$WORKDIR/src"
          OUT_DIR="$WORKDIR/out"
          mkdir -p "$SRC_DIR" "$OUT_DIR"

          # ------------------------------------------------------------
          # Callback vers le worker (état + message)
          # ------------------------------------------------------------
          callback() {
            local state="$1"
            local message="$2"
            echo "➡️  [callback] $state — $message"
            curl -sS -m 15 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$(python3 - "$state" "$message" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "message": sys.argv[2]}))
          PY
          )" >/dev/null 2>&1 || echo "⚠️  callback injoignable (on continue quand même)"
          }

          # En cas d'échec définitif : prévient le worker puis stoppe le job
          fail() {
            local message="$1"
            echo "❌ ERREUR: $message"
            callback "error" "$message"
            exit 1
          }

          # ------------------------------------------------------------
          # Upload d'un artefact final vers R2 via le worker
          # type ∈ apk | aab | exe | keystore
          # ------------------------------------------------------------
          upload_artifact() {
            local file="$1"
            local type="$2"
            if [ ! -f "$file" ]; then
              echo "⚠️  upload_artifact: fichier introuvable ($file), ignoré"
              return 1
            fi
            echo "⬆️  Upload $type : $file ($(du -h "$file" | cut -f1))"
            local status
            status=$(curl -sS -m 300 -o /dev/null -w "%{http_code}" \
              -X POST "$BUILD_BASE_URL/upload/$type" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file")
            if [ "$status" != "200" ]; then
              echo "⚠️  upload $type a répondu HTTP $status"
              return 1
            fi
            return 0
          }

          # ------------------------------------------------------------
          # Téléchargement + extraction permissive du zip source
          # Ne suppose RIEN sur la structure : si tout est niché dans un
          # seul sous-dossier (cas fréquent des zips "glisser-déposer"),
          # on remonte automatiquement d'un niveau.
          # ------------------------------------------------------------
          download_source() {
            callback "building" "Téléchargement du projet..."
            curl -sSL -m 120 -o "$WORKDIR/source.zip" "$ZIP_URL" \
              || fail "Impossible de télécharger le zip source (zip_url injoignable)"

            [ -s "$WORKDIR/source.zip" ] || fail "Le zip source est vide ou introuvable"

            unzip -q -o "$WORKDIR/source.zip" -d "$SRC_DIR" \
              || fail "Archive .zip corrompue ou invalide"

            # Aplatir un unique sous-dossier racine (cas "MonProjet/MonProjet/src...")
            local entries
            entries=$(find "$SRC_DIR" -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$entries" -eq 1 ] && [ -d "$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)" ]; then
              local inner
              inner="$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)"
              echo "📂 Sous-dossier unique détecté ($inner) — aplatissement"
              shopt -s dotglob
              mv "$inner"/* "$SRC_DIR"/ 2>/dev/null || true
              shopt -u dotglob
              rmdir "$inner" 2>/dev/null || true
            fi

            echo "📁 Contenu du projet après extraction :"
            find "$SRC_DIR" -maxdepth 2 | sed "s|$SRC_DIR|.|"
            callback "building" "Projet extrait, analyse de la structure..."
          }

          # Cherche un fichier par motif n'importe où dans SRC_DIR (permissif,
          # insensible à l'emplacement exact demandé par le langage)
          find_any() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | head -n 1
          }

          find_dir_containing() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | xargs -r -n1 dirname | head -n 1
          }

          # ------------------------------------------------------------
          # Icône : téléchargement (utilisée par chaque builder pour
          # remplacer les icônes par défaut du framework généré)
          # ------------------------------------------------------------
          download_icon_if_any() {
            ICON_LOCAL=""
            if [ -n "${ICON_URL:-}" ]; then
              ICON_LOCAL="$WORKDIR/icon.png"
              if curl -sSL -m 30 -o "$ICON_LOCAL" "$ICON_URL"; then
                echo "🎨 Icône téléchargée : $ICON_LOCAL"
              else
                echo "⚠️  Icône fournie mais injoignable, utilisation de l'icône par défaut"
                ICON_LOCAL=""
              fi
            fi
            export ICON_LOCAL
          }

          # ------------------------------------------------------------
          # Keystore Android : génère une clé si demandé, ou télécharge
          # celle fournie par l'utilisateur.
          # Résultat : $KEYSTORE_PATH prêt à l'emploi pour la signature.
          # ------------------------------------------------------------
          prepare_keystore() {
            KEYSTORE_PATH="$WORKDIR/release.keystore"
            if [ "${KEYSTORE_MODE:-generate}" = "upload" ] && [ -n "${KEYSTORE_URL:-}" ]; then
              callback "building" "Récupération de votre clé de signature..."
              curl -sSL -m 30 -o "$KEYSTORE_PATH" "$KEYSTORE_URL" \
                || fail "Impossible de télécharger la clé de signature fournie"
            else
              callback "building" "Génération de la clé de signature..."
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_PATH" \
                -alias "${KEYSTORE_ALIAS:-release}" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -keypass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -dname "CN=${APP_NAME:-App}, OU=PhilBuilder, O=PhilTech, C=CI" \
                || fail "Échec de la génération de la clé de signature"
              upload_artifact "$KEYSTORE_PATH" "keystore" || true
            fi
            export KEYSTORE_PATH
          }

          # ------------------------------------------------------------
          # Renomme/copie le premier fichier trouvé matching $2 vers $1,
          # ne casse rien si absent (mode best-effort)
          # ------------------------------------------------------------
          copy_if_exists() {
            local dst="$1" pattern="$2"
            local src
            src=$(find_any "$pattern")
            if [ -n "$src" ]; then
              cp "$src" "$dst"
              return 0
            fi
            return 1
          }

          echo "✅ lib.sh chargée — WORKDIR=$WORKDIR"

          # ============================================================
          # BUILD LOGIC
          # ============================================================

          download_source
          download_icon_if_any
          cd "$SRC_DIR"

          if [ "$PROJECT_TYPE" = "react-native" ]; then
            [ -f "package.json" ] || fail "react-native: package.json introuvable à la racine du projet"
            callback "building" "npm install (React Native)..."
            npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tail -n 60 \
              || npm install --no-audit --no-fund --force 2>&1 | tail -n 60 \
              || fail "npm install a échoué"
            ANDROID_DIR="$SRC_DIR/android"
            [ -d "$ANDROID_DIR" ] || fail "react-native: dossier android/ introuvable (projet non initialisé avec 'npx react-native init')"
          else
            # kotlin / java / kotlin-multiplatform : on cherche un projet gradle
            GRADLE_DIR="$(find_dir_containing 'settings.gradle*')"
            if [ -z "$GRADLE_DIR" ]; then
              GRADLE_DIR="$(find_dir_containing 'build.gradle*')"
            fi

            if [ -z "$GRADLE_DIR" ]; then
              # ---------- FALLBACK PERMISSIF ----------
              # Pas de projet Gradle du tout : on scaffold un projet Android minimal
              # autour des sources .kt / .java trouvées, pour maximiser le taux de succès.
              echo "⚠️  Aucun projet Gradle détecté — génération d'un projet Android minimal autour des sources fournies"
              callback "building" "Structure de projet absente — génération d'un squelette Android..."
              SCAFFOLD="$WORKDIR/scaffold"
              mkdir -p "$SCAFFOLD/app/src/main/java" "$SCAFFOLD/app/src/main/res/values"
              # Copie de toutes les sources kt/java trouvées dans le zip
              find "$SRC_DIR" \( -iname "*.kt" -o -iname "*.java" \) -exec cp {} "$SCAFFOLD/app/src/main/java/" \;
              cat > "$SCAFFOLD/app/src/main/AndroidManifest.xml" <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PACKAGE_ID">
            <application android:label="$APP_NAME" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
              cat > "$SCAFFOLD/app/src/main/res/values/strings.xml" <<EOF
          <resources><string name="app_name">$APP_NAME</string></resources>
          EOF
              cat > "$SCAFFOLD/settings.gradle" <<EOF
          include ':app'
          EOF
              cat > "$SCAFFOLD/build.gradle" <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
              cat > "$SCAFFOLD/app/build.gradle" <<EOF
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace "$PACKAGE_ID"
            compileSdk 34
            defaultConfig { applicationId "$PACKAGE_ID"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
              gradle wrapper --gradle-version 8.4 -p "$SCAFFOLD" 2>&1 | tail -n 20
              GRADLE_DIR="$SCAFFOLD"
            fi
            ANDROID_DIR="$GRADLE_DIR"
          fi

          cd "$ANDROID_DIR"
          [ -f "gradlew" ] || { echo "⚠️  gradlew manquant — génération du wrapper"; gradle wrapper --gradle-version 8.4 2>&1 | tail -n 20; }
          chmod +x gradlew 2>/dev/null || true

          if [ -n "${ICON_LOCAL:-}" ]; then
            for d in app/src/main/res/mipmap-*; do [ -d "$d" ] && cp "$ICON_LOCAL" "$d/ic_launcher.png" 2>/dev/null; done
          fi

          callback "building" "Compilation Gradle ($BUILD_TYPE)..."
          if [ "$BUILD_TYPE" = "release" ]; then
            prepare_keystore
            cp "$KEYSTORE_PATH" app/release.keystore 2>/dev/null || true
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$ANDROID_DIR/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEYSTORE_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD" \
              2>&1 | tail -n 120 || fail "assembleRelease a échoué"
            APK=$(find . -path "*/outputs/apk/release/*.apk" | head -n 1)
          else
            ./gradlew assembleDebug 2>&1 | tail -n 120 || fail "assembleDebug a échoué"
            APK=$(find . -path "*/outputs/apk/debug/*.apk" | head -n 1)
          fi
          [ -n "$APK" ] || APK=$(find . -iname "*.apk" | head -n 1)
          [ -n "$APK" ] || fail "Aucun APK produit par Gradle"
          upload_artifact "$APK" "apk" || fail "Échec upload APK"

          callback "success" "Build terminé avec succès"
      - name: Callback en cas d'echec inattendu
        if: failure()
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Echec inattendu du job build-native (voir logs GitHub Actions)"}' || true

