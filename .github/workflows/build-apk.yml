# ============================================================================
# Build APK / AAB / EXE — pipeline multi-langages
# ============================================================================
# VERSION AVEC TOLERANCE MAXIMALE DE STRUCTURE (fallback par extension,
# Buildozer/PyInstaller prioritaires pour Python, esbuild pour JS brut,
# scaffold Gradle complet pour Kotlin/Java, icone forcee, Expo managed
# auto-regenere au lieu de bloquer).
#
# RESUME DES CHANGEMENTS DE CETTE VERSION :
#   1. Detection (job prepare) :
#      - Expo managed workflow n'est plus bloque : classe en react-native,
#        le prebuild se fait dans build-react-native (deja code).
#      - Fallback par extension si aucun marqueur de structure trouve :
#        *.py -> python, *.kt/*.java -> kotlin, *.js/*.ts/*.jsx/*.tsx -> web.
#        Le build ne bloque plus, chaque job sait scaffolder ce qui manque.
#   2. build-web : bundling esbuild zero-config si JSX/TS/imports detectes
#      sans package.json. Icone forcee par ImageMagick apres cordova-res.
#   3. build-capacitor : icone forcee par ImageMagick apres capacitor-assets.
#   4. build-kotlin-java : scaffold Gradle complet (settings.gradle,
#      build.gradle racine, app/build.gradle, AndroidManifest minimal) si
#      aucun build.gradle trouve. Fix memoire org.gradle.jvmargs=2048m.
#   5. build-python (Android) : Buildozer par defaut (tolerant, juste besoin
#      d'un .py), Briefcase seulement si pyproject.toml a une config
#      [tool.briefcase] complexe (plusieurs apps ou requires etendus).
#   6. build-windows-python : PyInstaller par defaut, Briefcase seulement
#      si config Windows Briefcase complexe detectee.
# ============================================================================

name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL du zip source'
        required: true
        type: string
      app_name:
        description: 'Nom de l application'
        required: true
        type: string
      package_id:
        description: 'Package ID'
        required: false
        type: string
      build_id:
        description: 'ID du build'
        required: true
        type: string
      build_type:
        description: 'Type de build'
        required: true
        type: string
      output_format:
        description: 'Format de sortie (apk, aab, both)'
        required: false
        type: string
        default: 'apk'
      project_type:
        description: 'Type de projet (optionnel - auto-detecte si vide)'
        required: false
        type: string
        default: ''
      platform:
        description: 'Plateforme cible (android, windows)'
        required: false
        type: string
        default: 'android'
      icon_url:
        description: 'URL de l icone personnalisee (optionnel)'
        required: false
        type: string
        default: ''
      keystore_mode:
        description: 'Mode keystore'
        required: true
        type: string
      keystore_url:
        description: 'URL du keystore'
        required: false
        type: string
      keystore_password:
        description: 'Mot de passe du keystore'
        required: false
        type: string
      keystore_alias:
        description: 'Alias du keystore'
        required: false
        type: string
      callback_url:
        description: 'URL de callback (notification finale, avec /callback)'
        required: true
        type: string
      build_base_url:
        description: 'URL de base du build sur le Worker (sans /callback)'
        required: false
        type: string

env:
  NODE_VERSION: '24'

jobs:
  # ============================================================
  # JOB 1: PREPARE
  # ============================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_dir: ${{ steps.detect.outputs.source_dir }}
      src_path: ${{ steps.detect.outputs.src_path }}
      detected_type: ${{ steps.detect-project.outputs.detected_type }}
      has_keystore: ${{ steps.keystore.outputs.has_keystore || steps.keystore-download.outputs.has_keystore }}
      keystore_path: ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
      keystore_filename: ${{ steps.keystore.outputs.keystore_filename || steps.keystore-download.outputs.keystore_filename }}
      build_should_run: ${{ steps.detect-project.outputs.build_should_run }}
      error_message: ${{ steps.detect-project.outputs.error_message }}
      error_code: ${{ steps.detect-project.outputs.error_code }}
      error_hint: ${{ steps.detect-project.outputs.error_hint }}
    steps:
      - name: Download source zip
        id: download
        run: |
          set -e
          curl -f -L -o source.zip "${{ github.event.inputs.zip_url }}"
          echo "=== Taille du fichier telecharge ==="
          ls -la source.zip
          SIZE=$(stat -c%s source.zip 2>/dev/null || stat -f%z source.zip)
          if [ "$SIZE" -lt 100 ]; then
            echo "ERREUR: le fichier source.zip est suspicieusement petit ($SIZE octets)."
            cat source.zip
            exit 1
          fi
          mkdir -p src
          unzip -o source.zip -d src/

      - name: Detect source directory
        id: detect
        run: |
          cd src
          ITEM_COUNT=$(ls -1 | wc -l)
          FIRST_ITEM=$(ls -1 | head -1)
          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            echo "source_dir=$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "src_path=src/$FIRST_ITEM" >> "$GITHUB_OUTPUT"
          else
            echo "source_dir=." >> "$GITHUB_OUTPUT"
            echo "src_path=src" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # DETECTION + FALLBACK PAR EXTENSION (tolerance maximale) +
      # Expo managed n'est plus bloquant (auto-regenere dans le job
      # build-react-native via "npx expo prebuild").
      # ============================================================
      - name: Auto-detect project type
        id: detect-project
        run: |
          set -e
          cd src/${{ steps.detect.outputs.source_dir }}

          find_file() {
            find . -iname "$1" -type f \
              -not -path "*/node_modules/*" \
              -not -path "*/.git/*" \
              -not -path "*/build/*" \
              -not -path "*/dist/*" \
              -not -path "*/bin/*" \
              -not -path "*/obj/*" \
              2>/dev/null | head -1
          }

          count_files() {
            find . -iname "$1" -type f \
              -not -path "*/node_modules/*" \
              -not -path "*/.git/*" \
              -not -path "*/build/*" \
              -not -path "*/dist/*" \
              -not -path "*/bin/*" \
              -not -path "*/obj/*" \
              2>/dev/null | wc -l
          }

          DETECTED="unknown"
          BUILD_SHOULD_RUN="true"
          ERROR_MSG=""
          ERROR_CODE=""
          ERROR_HINT=""
          FALLBACK_USED="false"

          if [ -n "$(find_file "pubspec.yaml")" ]; then
            DETECTED="flutter"
            echo "Flutter detecte"
          elif [ -n "$(find_file "*.csproj")" ]; then
            DETECTED="dotnet-maui"
            echo ".NET MAUI detecte"
          elif [ -n "$(find_file "metro.config.js")" ] || [ -n "$(find_file "metro.config.ts")" ]; then
            DETECTED="react-native"
            echo "React Native detecte"
          elif [ -n "$(find_file "capacitor.config.ts")" ] || [ -n "$(find_file "capacitor.config.json")" ] || [ -n "$(find_file "capacitor.config.js")" ] || ( [ -n "$(find_file "package.json")" ] && ( grep -q "@capacitor/core" "$(find_file "package.json")" 2>/dev/null || grep -q "@capacitor/android" "$(find_file "package.json")" 2>/dev/null || grep -q "@ionic/core" "$(find_file "package.json")" 2>/dev/null ) ); then
            DETECTED="capacitor"
            echo "Capacitor detecte"
          elif [ -n "$(find_file "package.json")" ] && grep -q '"expo"' "$(find_file "package.json")" 2>/dev/null; then
            # NOUVEAU : Expo managed n'est plus bloquant. On classe direct en
            # react-native ; le job build-react-native detecte l'absence du
            # dossier android/ et lance "npx expo prebuild" automatiquement.
            DETECTED="react-native"
            echo "Expo detecte (managed ou bare) - le prebuild sera fait automatiquement si besoin"
          elif { [ -n "$(find_file "build.gradle")" ] || [ -n "$(find_file "build.gradle.kts")" ]; } && [ -z "$(find_file "package.json")" ]; then
            DETECTED="kotlin"
            echo "Kotlin/Java detecte"
          elif [ -n "$(find_file "go.mod")" ]; then
            DETECTED="go"
            echo "Go detecte"
          elif [ -n "$(find_file "setup.py")" ] || [ -n "$(find_file "pyproject.toml")" ] || [ -n "$(find_file "buildozer.spec")" ] || ( [ -n "$(find_file "main.py")" ] && [ -z "$(find_file "go.mod")" ] ) || ( [ -n "$(find_file "app.py")" ] && [ -z "$(find_file "go.mod")" ] ); then
            DETECTED="python"
            echo "Python detecte"
          elif [ -n "$(find_file "project.godot")" ]; then
            DETECTED="godot"
            echo "Godot detecte"
          elif [ -n "$(find_file "build.settings")" ]; then
            DETECTED="lua"
            echo "Lua detecte"
          elif [ -n "$(find_file "package.json")" ] && grep -q "nativescript" "$(find_file "package.json")" 2>/dev/null; then
            DETECTED="nativescript"
            echo "NativeScript detecte"
          elif [ -n "$(find_file "package.json")" ]; then
            PKG_JSON="$(find_file "package.json")"
            if grep -q '"react"' "$PKG_JSON" 2>/dev/null && [ -z "$(find_file "metro.config.js")" ]; then
              DETECTED="react"
            elif grep -q '"vue"' "$PKG_JSON" 2>/dev/null; then
              DETECTED="vue"
            elif grep -q '"svelte"' "$PKG_JSON" 2>/dev/null; then
              DETECTED="svelte"
            else
              DETECTED="web"
            fi
            echo "Projet web detecte ($DETECTED)"
          elif [ -n "$(find_file "index.html")" ]; then
            DETECTED="web"
            echo "Site statique detecte"
          else
            # ============================================================
            # FALLBACK PAR EXTENSION — dernier recours avant de bloquer.
            # Les clients ne respectent pas toujours la structure attendue
            # (pas de main.py nomme comme tel, pas de build.gradle a la
            # racine, pas de package.json...). On devine par extension et
            # on laisse le job de build correspondant scaffolder ce qui
            # manque, plutot que de bloquer immediatement.
            # ============================================================
            PY_COUNT=$(count_files "*.py")
            KT_JAVA_COUNT=$(( $(count_files "*.kt") + $(count_files "*.java") ))
            JS_TS_COUNT=$(( $(count_files "*.js") + $(count_files "*.ts") + $(count_files "*.jsx") + $(count_files "*.tsx") ))
            HTML_COUNT=$(count_files "*.html")

            if [ "$PY_COUNT" -gt 0 ]; then
              DETECTED="python"
              FALLBACK_USED="true"
              echo "Fallback par extension : $PY_COUNT fichier(s) .py trouve(s) sans structure standard -> python"
            elif [ "$KT_JAVA_COUNT" -gt 0 ]; then
              DETECTED="kotlin"
              FALLBACK_USED="true"
              echo "Fallback par extension : $KT_JAVA_COUNT fichier(s) .kt/.java trouve(s) sans build.gradle -> kotlin (scaffold Gradle sera genere)"
            elif [ "$JS_TS_COUNT" -gt 0 ] || [ "$HTML_COUNT" -gt 0 ]; then
              DETECTED="web"
              FALLBACK_USED="true"
              echo "Fallback par extension : fichiers JS/TS/HTML trouves sans package.json -> web (bundling esbuild si necessaire)"
            else
              DETECTED="unknown"
              BUILD_SHOULD_RUN="false"
              ERROR_CODE="project_type_not_detected"
              ERROR_HINT="Aucun marqueur de projet reconnu (package.json, pubspec.yaml, build.gradle, *.csproj, go.mod, *.py, *.kt, *.java, *.js, *.ts, project.godot...) n'a ete trouve dans le zip."
              ERROR_MSG="Impossible de detecter le type de projet. $ERROR_HINT"
              echo "Type inconnu, meme apres fallback par extension : $ERROR_HINT"
            fi
          fi

          CLIENT_TYPE="${{ github.event.inputs.project_type }}"
          if [ "$CLIENT_TYPE" != "" ] && [ "$CLIENT_TYPE" != "web" ]; then
            echo "Client force: $CLIENT_TYPE"
            DETECTED="$CLIENT_TYPE"
          fi

          echo "detected_type=$DETECTED" >> "$GITHUB_OUTPUT"
          echo "build_should_run=$BUILD_SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "error_message=$ERROR_MSG" >> "$GITHUB_OUTPUT"
          echo "error_code=$ERROR_CODE" >> "$GITHUB_OUTPUT"
          echo "error_hint=$ERROR_HINT" >> "$GITHUB_OUTPUT"
          echo "=== TYPE FINAL: $DETECTED (fallback_utilise=$FALLBACK_USED) ==="

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        id: keystore
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          KEYSTORE_NAME="my-release-key-${{ github.event.inputs.build_id }}.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_NAME" \
            -alias "${{ github.event.inputs.keystore_alias }}" \
            -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 10950 \
            -storetype PKCS12 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=${{ github.event.inputs.app_name }}, O=${{ github.event.inputs.app_name }} Developer, C=CI"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_filename=$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download user keystore
        id: keystore-download
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'upload' && github.event.inputs.keystore_url != '' }}
        run: |
          set -e
          KEYSTORE_NAME="my-release-key-${{ github.event.inputs.build_id }}.keystore"
          curl -L -o "$KEYSTORE_NAME" "${{ github.event.inputs.keystore_url }}"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_filename=$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/
          retention-days: 1

      - name: Upload keystore artifact
        if: ${{ steps.keystore.outputs.has_keystore == 'true' || steps.keystore-download.outputs.has_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
          retention-days: 7

      - name: Notify error if project not detected
        if: ${{ steps.detect-project.outputs.build_should_run == 'false' }}
        run: |
          set -e
          JSON_PAYLOAD=$(jq -n \
              --arg build_id "${{ github.event.inputs.build_id }}" \
              --arg message "${{ steps.detect-project.outputs.error_message }}" \
              --arg error_code "${{ steps.detect-project.outputs.error_code }}" \
              --arg hint "${{ steps.detect-project.outputs.error_hint }}" \
              '{
                build_id: $build_id,
                state: "error",
                detected_type: "unknown",
                error_code: $error_code,
                message: $message,
                hint: $hint
              }')
          curl -sf -X POST -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "${{ github.event.inputs.callback_url }}" || true
          exit 1

  # ============================================================
  # JOB 2: BUILD WEB (Cordova) — avec bundling esbuild zero-config
  # et icone forcee
  # ============================================================
  build-web:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["web","react","vue","svelte"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Cordova
        run: npm install -g cordova

      # ============================================================
      # NOUVEAU : bundling esbuild zero-config. Si on trouve du JS/TS/
      # JSX/TSX sans package.json (donc jamais transpile), ou avec un
      # package.json mais sans build reussi, on bundle nous-memes avec
      # esbuild avant de filer le resultat a Cordova. Ca evite le
      # "build reussi mais app cassee / ecran blanc".
      # ============================================================
      - name: Bundle raw JS/JSX/TS with esbuild if no build output
        id: esbuild
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "package.json" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"
          echo "ESBUILD_ROOT=$PWD" >> "$GITHUB_ENV"

          # On bundle si : (a) pas de package.json du tout, OU (b) un
          # package.json existe mais sans script "build" (donc rien ne
          # transpile le JSX/TS/imports).
          NEEDS_BUNDLE="false"
          if [ ! -f "package.json" ]; then
            if find . -maxdepth 3 -type f \( -iname "*.jsx" -o -iname "*.tsx" \) -not -path "*/node_modules/*" | grep -q .; then
              NEEDS_BUNDLE="true"
            elif find . -maxdepth 3 -type f \( -iname "*.js" -o -iname "*.ts" \) -not -path "*/node_modules/*" | xargs grep -lE '^\s*(import |export |require\()' 2>/dev/null | grep -q .; then
              NEEDS_BUNDLE="true"
            fi
          elif ! grep -q '"build"' package.json 2>/dev/null; then
            if find . -maxdepth 3 -type f \( -iname "*.jsx" -o -iname "*.tsx" \) -not -path "*/node_modules/*" | grep -q .; then
              NEEDS_BUNDLE="true"
            fi
          fi

          if [ "$NEEDS_BUNDLE" == "true" ]; then
            echo "JSX/TS/imports detectes sans transpilation - bundling esbuild zero-config..."
            npm install -g esbuild

            ENTRY=""
            for candidate in index.js index.jsx index.ts index.tsx src/index.js src/index.jsx src/index.ts src/index.tsx src/main.js src/main.jsx src/main.ts src/main.tsx App.jsx App.tsx; do
              if [ -f "$candidate" ]; then
                ENTRY="$candidate"
                break
              fi
            done
            if [ -z "$ENTRY" ]; then
              ENTRY=$(find . -maxdepth 3 -type f \( -iname "*.jsx" -o -iname "*.tsx" -o -iname "*.js" -o -iname "*.ts" \) -not -path "*/node_modules/*" | head -1)
            fi

            if [ -n "$ENTRY" ]; then
              echo "Point d'entree detecte : $ENTRY"
              mkdir -p .esbuild-out
              esbuild "$ENTRY" --bundle --outfile=.esbuild-out/bundle.js --loader:.js=jsx --loader:.jsx=jsx --loader:.ts=ts --loader:.tsx=tsx --define:process.env.NODE_ENV='"production"' || {
                echo "esbuild a echoue - le build continuera avec les fichiers bruts (risque d'ecran blanc)."
                echo "esbuild_used=false" >> "$GITHUB_OUTPUT"
              }
              if [ -f ".esbuild-out/bundle.js" ]; then
                cat > .esbuild-out/index.html << 'HTML_EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
          <body><div id="root"></div><div id="app"></div><script src="bundle.js"></script></body>
          </html>
          HTML_EOF
                echo "ESBUILD_OUTPUT_DIR=$PWD/.esbuild-out" >> "$GITHUB_ENV"
                echo "esbuild_used=true" >> "$GITHUB_OUTPUT"
                echo "Bundle genere avec succes : .esbuild-out/bundle.js + index.html"
              fi
            else
              echo "Aucun point d'entree JS/TS trouve - rien a bundler."
              echo "esbuild_used=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "esbuild_used=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web project
        run: |
          set -e
          cd "$ESBUILD_ROOT"

          if [ -f "package.json" ] && [ -z "${ESBUILD_OUTPUT_DIR:-}" ]; then
            npm ci --prefer-offline || npm install
            if grep -q '"build"' package.json; then
              npm run build
            fi
          fi

          PKG_ID="${{ github.event.inputs.package_id }}"
          [ -z "$PKG_ID" ] && PKG_ID="com.philtech.mobile"

          CORDOVA_DIR="cordova-project-${{ github.event.inputs.build_id }}"
          cordova create "$CORDOVA_DIR" "$PKG_ID" "${{ github.event.inputs.app_name }}"
          rm -rf "$CORDOVA_DIR"/www/*

          # Priorite : sortie esbuild > dist/ > build/ > racine
          COPY_FROM="."
          if [ -n "${ESBUILD_OUTPUT_DIR:-}" ] && [ -d "$ESBUILD_OUTPUT_DIR" ]; then
            COPY_FROM="$ESBUILD_OUTPUT_DIR"
          elif [ -d "dist" ]; then
            COPY_FROM="dist"
          elif [ -d "build" ]; then
            COPY_FROM="build"
          fi

          # FIX13 (NOUVEAU) : ne jamais copier node_modules/ dans www/. En
          # l'absence de dist/build/sortie esbuild, COPY_FROM pointait sur
          # la racine du projet entiere - node_modules inclus. Les symlinks
          # de node_modules/.bin/* (crees par npm) font planter la copie
          # Cordova avec "src and dest cannot be the same ... .bin/errno" ;
          # en plus d'etre totalement inutile a embarquer dans l'app.
          mkdir -p "$CORDOVA_DIR"/www
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --exclude 'node_modules' --exclude '.git' "$COPY_FROM"/ "$CORDOVA_DIR"/www/ 2>/dev/null || true
          else
            find "$COPY_FROM" -maxdepth 1 -mindepth 1 ! -name node_modules ! -name .git \
              -exec cp -r {} "$CORDOVA_DIR"/www/ \; 2>/dev/null || true
          fi

          sed -i 's#</widget>#  <preference name="android-minSdkVersion" value="24" />\n  <preference name="android-targetSdkVersion" value="34" />\n  <preference name="SplashScreenDelay" value="0" />\n</widget>#' "$CORDOVA_DIR"/config.xml

          echo "SAVED_CORDOVA_DIR=$PWD/$CORDOVA_DIR" >> "$GITHUB_ENV"

      - name: Add Cordova Android platform
        run: |
          set -e
          cd "$SAVED_CORDOVA_DIR"
          cordova platform add android

      # ============================================================
      # ICONE FORCEE : cordova-res en premiere tentative, puis fallback
      # force par ImageMagick dans tous les mipmap-*, quel que soit le
      # resultat de cordova-res.
      # ============================================================
      - name: Apply custom icon (Cordova)
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          set -e
          # FIX 2 : ImageMagick n'est pas garanti preinstalle sur tous les
          # runners ubuntu-latest (versions d'image variables). On
          # l'installe explicitement pour que "convert" soit toujours
          # disponible pour le fallback force plus bas.
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
          fi

          cd "$SAVED_CORDOVA_DIR"
          mkdir -p resources
          curl -f -L -o resources/icon.png "${{ github.event.inputs.icon_url }}"

          npm install -g cordova-res
          cordova-res android --copy --type icon || echo "cordova-res a echoue, fallback force ci-dessous"

          RES_DIR=""
          for candidate in \
            "platforms/android/app/src/main/res" \
            "platforms/android/res" \
            "app/src/main/res"; do
            if [ -d "$candidate" ]; then
              RES_DIR="$candidate"
              break
            fi
          done

          if [ -z "$RES_DIR" ]; then
            echo "ATTENTION: dossier res/ Android introuvable, icone personnalisee non appliquee."
          else
            echo "Application forcee de l'icone dans : $RES_DIR"
            declare -A SIZES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
            for dir in "${!SIZES[@]}"; do
              SIZE="${SIZES[$dir]}"
              mkdir -p "$RES_DIR/$dir"
              convert resources/icon.png -resize "${SIZE}x${SIZE}" "$RES_DIR/$dir/ic_launcher.png"
              convert resources/icon.png -resize "${SIZE}x${SIZE}" "$RES_DIR/$dir/ic_launcher_round.png"
              [ -f "$RES_DIR/$dir/ic_launcher_foreground.png" ] && \
                convert resources/icon.png -resize "${SIZE}x${SIZE}" "$RES_DIR/$dir/ic_launcher_foreground.png"
            done
            echo "Icone personnalisee forcee avec succes dans toutes les densites."
          fi

      - name: Build Cordova
        run: |
          set -e
          cd "$SAVED_CORDOVA_DIR"
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
          FORMAT="${{ github.event.inputs.output_format }}"

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- --packageType=apk --keystore="$KEYSTORE_FILE" --storePassword="${{ github.event.inputs.keystore_password }}" --alias="${{ github.event.inputs.keystore_alias }}" --password="${{ github.event.inputs.keystore_password }}"
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- --packageType=bundle --keystore="$KEYSTORE_FILE" --storePassword="${{ github.event.inputs.keystore_password }}" --alias="${{ github.event.inputs.keystore_alias }}" --password="${{ github.event.inputs.keystore_password }}"
            fi
          else
            cordova build android --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-web-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 3: BUILD CAPACITOR — avec icone forcee
  # ============================================================
  build-capacitor:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["angular","svelte","solidjs","preact","ionic","capacitor"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Prepare Capacitor project
        id: build
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "package.json" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && exit 0
          cd "$PROJECT_ROOT"
          echo "SAVED_PROJECT_ROOT=$PWD" >> "$GITHUB_ENV"

          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.js" ]; then
            npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_id || 'com.philtech.app' }}" --web-dir "dist" 2>/dev/null || npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_id || 'com.philtech.app' }}" --web-dir "www" 2>/dev/null || true
          fi

          npm ci --prefer-offline || npm install
          if grep -q '"build"' package.json 2>/dev/null; then
            npm run build
          fi

          if [ ! -d "android" ]; then
            npx cap add android || true
          fi

      - name: Apply custom icon (Capacitor)
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          set -e
          # FIX 2 : meme raison que pour Cordova - on garantit la presence
          # d'ImageMagick avant d'appeler "convert".
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
          fi

          cd "$SAVED_PROJECT_ROOT" 2>/dev/null || exit 0
          mkdir -p resources
          curl -f -L -o resources/icon.png "${{ github.event.inputs.icon_url }}"

          npm install -g @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' \
            || echo "capacitor-assets a echoue, fallback force ci-dessous"

          RES_DIR=""
          [ -d "android/app/src/main/res" ] && RES_DIR="android/app/src/main/res"

          if [ -z "$RES_DIR" ]; then
            echo "ATTENTION: dossier res/ Android introuvable, icone personnalisee non appliquee."
          else
            echo "Application forcee de l'icone dans : $RES_DIR"
            declare -A SIZES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
            for dir in "${!SIZES[@]}"; do
              SIZE="${SIZES[$dir]}"
              mkdir -p "$RES_DIR/$dir"
              convert resources/icon.png -resize "${SIZE}x${SIZE}" "$RES_DIR/$dir/ic_launcher.png"
              convert resources/icon.png -resize "${SIZE}x${SIZE}" "$RES_DIR/$dir/ic_launcher_round.png"
              [ -f "$RES_DIR/$dir/ic_launcher_foreground.png" ] && \
                convert resources/icon.png -resize "${SIZE}x${SIZE}" "$RES_DIR/$dir/ic_launcher_foreground.png"
            done
            echo "Icone personnalisee forcee avec succes dans toutes les densites."
          fi

      - name: Disable default splash screen
        run: |
          set -e
          cd "$SAVED_PROJECT_ROOT" 2>/dev/null || exit 0
          if [ -f "capacitor.config.json" ]; then
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json'));
              cfg.plugins = cfg.plugins || {};
              cfg.plugins.SplashScreen = { launchShowDuration: 0 };
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            " || true
          fi

      - name: Sync and build Capacitor Android
        run: |
          set -e
          cd "$SAVED_PROJECT_ROOT" 2>/dev/null || exit 0
          npx cap sync android || true
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
            FORMAT="${{ github.event.inputs.output_format }}"

            if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
              mkdir -p app
              cat > app/signing.gradle << GRADLE_EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_FILE")
                storePassword "${{ github.event.inputs.keystore_password }}"
                keyAlias "${{ github.event.inputs.keystore_alias }}"
                keyPassword "${{ github.event.inputs.keystore_password }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
              if ! grep -q "signing.gradle" app/build.gradle 2>/dev/null; then
                echo "apply from: 'signing.gradle'" >> app/build.gradle
              fi
              if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
                ./gradlew assembleRelease
              fi
              if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
                ./gradlew bundleRelease
              fi
            else
              ./gradlew assembleDebug
            fi
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-capacitor-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 4: BUILD REACT NATIVE (inchange - gere deja Expo prebuild)
  # ============================================================
  build-react-native:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && needs.prepare.outputs.detected_type == 'react-native' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      error_message: ${{ steps.build.outputs.error_message || '' }}
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build React Native
        id: build
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "package.json" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"

          npm ci --prefer-offline || npm install

          if [ ! -d "android" ]; then
            echo "android/ manquant - tentative de regeneration..."
            # FIX 4 : ne plus avaler l'erreur avec "|| true". Si prebuild/eject
            # echoue, on le sait explicitement au lieu de planter plus loin
            # sur un "cd android: No such file or directory" illisible.
            if [ -f "package.json" ] && grep -q '"expo"' package.json; then
              if ! npx expo prebuild --platform android 2>&1 | tee /tmp/prebuild.log; then
                ERROR_MSG=$(tail -30 /tmp/prebuild.log | tr '\n' ' ' | tr -d '\r')
                echo "error_message=Echec de 'expo prebuild' - le dossier android/ n'a pas pu etre genere: $ERROR_MSG" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            else
              if ! npx react-native eject 2>&1 | tee /tmp/eject.log; then
                ERROR_MSG=$(tail -30 /tmp/eject.log | tr '\n' ' ' | tr -d '\r')
                echo "error_message=Echec de 'react-native eject' - le dossier android/ n'a pas pu etre genere: $ERROR_MSG" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi

            # Verification finale explicite : si android/ n'existe toujours
            # pas malgre un exit code 0 (cas rare mais possible), on le
            # signale clairement plutot que de laisser planter "cd android".
            if [ ! -d "android" ]; then
              echo "error_message=Le dossier android/ est toujours absent apres la regeneration, sans erreur explicite du prebuild/eject. Verifiez la structure du projet source." >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          cd android
          chmod +x gradlew

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
          FORMAT="${{ github.event.inputs.output_format }}"

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            mkdir -p app
            cat > app/signing.gradle << GRADLE_EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_FILE")
                storePassword "${{ github.event.inputs.keystore_password }}"
                keyAlias "${{ github.event.inputs.keystore_alias }}"
                keyPassword "${{ github.event.inputs.keystore_password }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
            if ! grep -q "signing.gradle" app/build.gradle 2>/dev/null; then
              echo "apply from: 'signing.gradle'" >> app/build.gradle
            fi
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              ./gradlew assembleRelease
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              ./gradlew bundleRelease
            fi
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-react-native-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 5: BUILD KOTLIN / JAVA — scaffold Gradle complet si absent
  # + fix memoire org.gradle.jvmargs + auto-fix DSL AGP + journal
  # des corrections (fixes_applied)
  # ============================================================
  build-kotlin-java:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["kotlin","java","kotlin-multiplatform"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      error_message: ${{ steps.build.outputs.error_message || '' }}
      fixes_applied: ${{ steps.build.outputs.fixes_applied || '' }}
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ============================================================
      # NOUVEAU (FIX4) : scaffold Gradle complet si aucun build.gradle
      # n'est trouve du tout (cas des clients qui envoient juste des
      # fichiers .kt/.java bruts, sans projet Android Studio). On genere
      # une structure minimale mais complete : settings.gradle,
      # build.gradle racine, app/build.gradle, AndroidManifest.xml, et on
      # deplace les sources trouvees dans app/src/main/java (ou kotlin).
      # ============================================================
      - name: Scaffold Gradle project if build.gradle missing
        id: scaffold
        run: |
          set -e
          cd src/
          EXISTING_GRADLE=$(find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -type f -not -path "*/node_modules/*" -not -path "*/.git/*" | head -1)

          FIXES_LOG="$GITHUB_WORKSPACE/fixes.log"
          touch "$FIXES_LOG"

          if [ -z "$EXISTING_GRADLE" ]; then
            echo "Aucun build.gradle trouve - generation d'un scaffold Android Studio complet..."
            PROJECT_ROOT="scaffolded-android-${{ github.event.inputs.build_id }}"
            mkdir -p "$PROJECT_ROOT/app/src/main/java" "$PROJECT_ROOT/app/src/main/kotlin" "$PROJECT_ROOT/app/src/main/res/values"

            PKG_ID="${{ github.event.inputs.package_id }}"
            [ -z "$PKG_ID" ] && PKG_ID="com.philtech.app"
            PKG_PATH=$(echo "$PKG_ID" | tr '.' '/')

            # Deplace les .kt/.java trouves dans l'arborescence source vers
            # le bon dossier package, en preservant les fichiers.
            HAS_KOTLIN="false"
            mkdir -p "$PROJECT_ROOT/app/src/main/java/$PKG_PATH" "$PROJECT_ROOT/app/src/main/kotlin/$PKG_PATH"
            while IFS= read -r f; do
              case "$f" in
                *.kt) cp "$f" "$PROJECT_ROOT/app/src/main/kotlin/$PKG_PATH/"; HAS_KOTLIN="true" ;;
                *.java) cp "$f" "$PROJECT_ROOT/app/src/main/java/$PKG_PATH/" ;;
              esac
            done < <(find . -type f \( -name "*.kt" -o -name "*.java" \) -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/$PROJECT_ROOT/*")

            # S'assure qu'au moins une Activity minimale existe.
            if [ "$HAS_KOTLIN" == "true" ]; then
              if ! grep -rl "class.*Activity" "$PROJECT_ROOT/app/src/main/kotlin/$PKG_PATH/" >/dev/null 2>&1; then
                cat > "$PROJECT_ROOT/app/src/main/kotlin/$PKG_PATH/MainActivity.kt" << KT_EOF
          package $PKG_ID

          import android.app.Activity
          import android.os.Bundle

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          KT_EOF
              fi
              SRC_SET="kotlin"
            else
              if ! grep -rl "class.*Activity" "$PROJECT_ROOT/app/src/main/java/$PKG_PATH/" >/dev/null 2>&1; then
                cat > "$PROJECT_ROOT/app/src/main/java/$PKG_PATH/MainActivity.java" << JAVA_EOF
          package $PKG_ID;

          import android.app.Activity;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA_EOF
              fi
              SRC_SET="java"
            fi

            cat > "$PROJECT_ROOT/app/src/main/AndroidManifest.xml" << MANIFEST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="${{ github.event.inputs.app_name }}"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

            cat > "$PROJECT_ROOT/app/src/main/res/values/strings.xml" << STRINGS_EOF
          <resources>
              <string name="app_name">${{ github.event.inputs.app_name }}</string>
          </resources>
          STRINGS_EOF

            cat > "$PROJECT_ROOT/settings.gradle" << SETTINGS_EOF
          rootProject.name = "app"
          include(":app")
          SETTINGS_EOF

            cat > "$PROJECT_ROOT/build.gradle" << ROOT_GRADLE_EOF
          buildscript {
              repositories { google(); mavenCentral() }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          ROOT_GRADLE_EOF

            KOTLIN_PLUGIN=""
            [ "$SRC_SET" == "kotlin" ] && KOTLIN_PLUGIN='    id("org.jetbrains.kotlin.android") version "1.9.24"'

            cat > "$PROJECT_ROOT/app/build.gradle" << APP_GRADLE_EOF
          plugins {
              id("com.android.application") version "8.5.0"
          $KOTLIN_PLUGIN
          }

          android {
              namespace "$PKG_ID"
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG_ID"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          APP_GRADLE_EOF

            echo "Scaffold Gradle genere avec succes ($SRC_SET) dans $PROJECT_ROOT/"
            echo "$GITHUB_WORKSPACE/src/$PROJECT_ROOT genere : projet Android Studio minimal cree automatiquement (aucun build.gradle fourni par le client)." >> "$FIXES_LOG"
            echo "SCAFFOLDED=true" >> "$GITHUB_ENV"
            echo "GRADLE_PROJECT_ROOT_OVERRIDE=$PWD/$PROJECT_ROOT" >> "$GITHUB_ENV"
          else
            echo "build.gradle trouve, pas de scaffold necessaire."
            echo "SCAFFOLDED=false" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # AUTO-FIX : conflit "buildscript{classpath} legacy" vs "plugins{}"
      # DSL moderne, versions de plugin dupliquees, syntaxe DSL AGP
      # recente non supportee pour compileSdk/targetSdk/minSdk, ET
      # (NOUVEAU FIX5) memoire Gradle insuffisante -> ajout automatique
      # de org.gradle.jvmargs dans gradle.properties.
      # ============================================================
      - name: Auto-fix legacy buildscript/plugins DSL conflict + memory
        run: |
          set -e
          cd src/

          find_project_root() {
            if [ -n "${GRADLE_PROJECT_ROOT_OVERRIDE:-}" ]; then
              echo "$GRADLE_PROJECT_ROOT_OVERRIDE"
              return
            fi
            local root
            root=$(find . \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -type f \
              -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/build/*" \
              -exec dirname {} \; | head -1)
            if [ -z "$root" ]; then
              root=$(find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -type f \
                -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/app/*" \
                -exec dirname {} \; | head -1)
            fi
            [ -z "$root" ] && root="."
            echo "$root"
          }

          PROJECT_ROOT=$(find_project_root)
          cd "$PROJECT_ROOT"
          # On stocke toujours un chemin ABSOLU (via $PWD apres le cd), pour
          # que l'etape de build suivante n'ait pas a deviner si le chemin
          # est relatif a src/ (cas normal) ou deja absolu (cas scaffold).
          echo "Racine du projet Gradle detectee : $PWD"
          echo "GRADLE_PROJECT_ROOT=$PWD" >> "$GITHUB_ENV"

          FIXES_LOG="$GITHUB_WORKSPACE/fixes.log"
          touch "$FIXES_LOG"

          # ------------------------------------------------------------
          # FIX5 (NOUVEAU) : memoire Gradle insuffisante -> cause frequente
          # de builds qui timeout ou crashent silencieusement sur des
          # runners standard. On force org.gradle.jvmargs si absent ou
          # trop bas.
          # ------------------------------------------------------------
          if [ -f "gradle.properties" ]; then
            if grep -q "org.gradle.jvmargs" gradle.properties; then
              sed -i -E 's/org\.gradle\.jvmargs\s*=.*/org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m/' gradle.properties
            else
              echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties
            fi
          else
            cat > gradle.properties << PROPS_EOF
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          PROPS_EOF
          fi
          echo "Memoire Gradle fixee a -Xmx2048m dans gradle.properties (evite les crashs OOM silencieux)." >> "$FIXES_LOG"

          PRIORITY_FILES=""
          for f in settings.gradle.kts settings.gradle build.gradle.kts build.gradle; do
            [ -f "$f" ] && PRIORITY_FILES="$PRIORITY_FILES $f"
          done
          OTHER_FILES=$(find . \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -type f \
            -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/build/*" | sed 's|^\./||' | sort)
          ALL_GRADLE_FILES="$PRIORITY_FILES"
          for f in $OTHER_FILES; do
            case " $PRIORITY_FILES " in
              *" $f "*) ;;
              *) ALL_GRADLE_FILES="$ALL_GRADLE_FILES $f" ;;
            esac
          done

          # ------------------------------------------------------------
          # FIX9 (NOUVEAU) : residus de commande shell en tete de fichier
          # Gradle - typiquement "cat > build.gradle << EOF" ou "cat <<
          # 'EOF'" colle par erreur au tout debut du fichier (le client a
          # genere son build.gradle via un script et a oublie de retirer
          # l'enveloppe heredoc), ou un marqueur "EOF" isole restant en fin
          # de fichier. Gradle essaie alors d'evaluer le mot "cat" comme
          # une propriete Groovy -> "Could not get unknown property 'cat'
          # for root project ... build.gradle line: 1".
          # ------------------------------------------------------------
          for GRADLE_FILE in $ALL_GRADLE_FILES; do
            if [ -f "$GRADLE_FILE" ]; then
              python3 - "$GRADLE_FILE" "$FIXES_LOG" << 'PYEOF'
          import re
          import sys

          path, fixes_log = sys.argv[1], sys.argv[2]
          with open(path) as f:
              lines = f.readlines()

          original_lines = list(lines)

          # Motifs de residus heredoc/shell a reperer en tete de fichier :
          # "cat > x << EOF", "cat << 'EOF'", "cat <<EOF", ou juste "cat"
          # seul sur la ligne.
          heredoc_start = re.compile(r'^\s*cat\b.*<<\s*[\'"]?[A-Za-z_]+[\'"]?\s*$')
          bare_cat = re.compile(r'^\s*cat\s*$')

          removed_leading = 0
          while lines:
              stripped = lines[0].strip()
              if stripped == '':
                  # ligne vide en tete -> on la retire aussi pour continuer
                  # a inspecter la vraie premiere ligne de contenu
                  lines.pop(0)
                  removed_leading += 1
                  continue
              if heredoc_start.match(lines[0]) or bare_cat.match(lines[0]):
                  lines.pop(0)
                  removed_leading += 1
                  continue
              break

          # Marqueur heredoc isole en toute fin de fichier (ex: derniere
          # ligne non-vide == "EOF" ou un mot-terminator similaire tout seul).
          removed_trailing = 0
          while lines:
              stripped = lines[-1].strip()
              if stripped == '':
                  lines.pop()
                  continue
              if re.match(r'^[A-Za-z_]+_?EOF$|^EOF$', stripped):
                  lines.pop()
                  removed_trailing += 1
                  continue
              break

          if removed_leading > 0 or removed_trailing > 0:
              with open(path, 'w') as f:
                  f.writelines(lines)
              with open(fixes_log, 'a') as log:
                  log.write(f"Residus de commande shell/heredoc (ex: 'cat > ... << EOF') retires de {path} ({removed_leading} ligne(s) en tete, {removed_trailing} en fin) - fichier genere via un script cote client sans nettoyage de l'enveloppe.\n")
          PYEOF
            fi
          done

          # FIX 1 (+ FIX10, resserre) : retire tout bloc buildscript{}
          # legacy declarant l'AGP en classpath, en conflit avec la syntaxe
          # plugins{} moderne. Detection elargie a la chaine litterale
          # "com.android.tools.build:gradle" ET a la co-existence d'un
          # buildscript{classpath} avec une VRAIE declaration DSL
          # "plugins { id(\"com.android.application\") }" (n'importe ou dans
          # le projet, root ou module).
          #
          # BUG CORRIGE : la version precedente detectait un "conflit" des
          # qu'un fichier contenait le texte "com.android.application"
          # QUELLE QU'EN SOIT LA SYNTAXE - ce qui matchait aussi
          # "apply plugin: 'com.android.application'" (syntaxe LEGACY qui a
          # justement BESOIN du buildscript{classpath} pour fonctionner,
          # sans aucun conflit reel avec plugins{}). Resultat : sur un
          # projet 100% legacy (apply plugin, pas de plugins{} du tout), le
          # fix supprimait le seul mecanisme capable de resoudre le plugin
          # -> "Plugin with id 'com.android.application' not found". On
          # exige maintenant la vraie syntaxe DSL id(...)/id '...' pour
          # confirmer qu'un plugins{} existe reellement quelque part.
          HAS_PLUGINS_DSL_ANYWHERE="false"
          for CHECK_FILE in $ALL_GRADLE_FILES; do
            if [ -f "$CHECK_FILE" ] && grep -qE "id\s*\(\s*[\"']com\.android\.(application|library)[\"']|id\s+[\"']com\.android\.(application|library)[\"']" "$CHECK_FILE" 2>/dev/null; then
              HAS_PLUGINS_DSL_ANYWHERE="true"
              break
            fi
          done

          for GRADLE_FILE in $ALL_GRADLE_FILES; do
            case "$GRADLE_FILE" in
              *settings.gradle*) continue ;;
            esac
            HAS_LITERAL_CLASSPATH="false"
            grep -q "com.android.tools.build:gradle" "$GRADLE_FILE" 2>/dev/null && HAS_LITERAL_CLASSPATH="true"

            HAS_GENERIC_CONFLICT="false"
            if [ "$HAS_LITERAL_CLASSPATH" == "false" ] && [ -f "$GRADLE_FILE" ] && [ "$HAS_PLUGINS_DSL_ANYWHERE" == "true" ]; then
              if grep -qi "buildscript" "$GRADLE_FILE" 2>/dev/null \
                 && grep -q "classpath" "$GRADLE_FILE" 2>/dev/null; then
                HAS_GENERIC_CONFLICT="true"
              fi
            fi

            if [ -f "$GRADLE_FILE" ] && { [ "$HAS_LITERAL_CLASSPATH" == "true" ] || [ "$HAS_GENERIC_CONFLICT" == "true" ]; }; then
              echo "Conflit buildscript/plugins detecte dans $GRADLE_FILE - nettoyage automatique..."
              python3 - "$GRADLE_FILE" "$FIXES_LOG" << 'PYEOF'
          import sys
          path, fixes_log = sys.argv[1], sys.argv[2]
          with open(path) as f:
              content = f.read()

          idx = content.find('buildscript')
          if idx != -1:
              brace_start = content.find('{', idx)
              if brace_start != -1:
                  depth = 0
                  i = brace_start
                  while i < len(content):
                      if content[i] == '{':
                          depth += 1
                      elif content[i] == '}':
                          depth -= 1
                          if depth == 0:
                              break
                      i += 1
                  end = i + 1
                  content = content[:idx] + content[end:]
                  with open(path, 'w') as f:
                      f.write(content)
                  with open(fixes_log, 'a') as log:
                      log.write(f"Bloc buildscript{{}} obsolete retire de {path} (conflit avec la syntaxe plugins{{}} moderne)\n")
          PYEOF
            fi
          done

          # FIX 2 : version de plugin declaree en double.
          if [ -n "$ALL_GRADLE_FILES" ]; then
            python3 - "$FIXES_LOG" $ALL_GRADLE_FILES << 'PYEOF'
          import re
          import sys

          fixes_log = sys.argv[1]
          files = sys.argv[2:]

          pattern = re.compile(
              r'id\s*\(\s*(?P<q1>["\'])(?P<id1>[\w.\-]+)(?P=q1)\s*\)\s*version\s*(?P<q1v>["\'])(?P<ver1>[^"\']+)(?P=q1v)'
              r'|'
              r'id\s+(?P<q2>["\'])(?P<id2>[\w.\-]+)(?P=q2)\s+version\s+(?P<q2v>["\'])(?P<ver2>[^"\']+)(?P=q2v)'
          )

          seen_ids = set()
          changed_files = []

          for path in files:
              try:
                  with open(path) as f:
                      content = f.read()
              except OSError:
                  continue

              def repl(m):
                  if m.group('id1') is not None:
                      pid = m.group('id1')
                      if pid in seen_ids:
                          return f'id("{pid}")'
                      seen_ids.add(pid)
                      return m.group(0)
                  else:
                      pid = m.group('id2')
                      quote = m.group('q2')
                      if pid in seen_ids:
                          return f'id {quote}{pid}{quote}'
                      seen_ids.add(pid)
                      return m.group(0)

              new_content = pattern.sub(repl, content)
              if new_content != content:
                  with open(path, 'w') as f:
                      f.write(new_content)
                  changed_files.append(path)

          if changed_files:
              with open(fixes_log, 'a') as log:
                  log.write(f"Version de plugin dupliquee retiree dans : {', '.join(changed_files)}\n")
          PYEOF
          fi

          # ------------------------------------------------------------
          # FIX11 (NOUVEAU) : version explicite retiree des plugins Android/
          # Kotlin dans les modules NON-racine (ex: app/build.gradle.kts).
          # Cause reelle de "plugin is already on the classpath with an
          # unknown version" : le root declare le plugin via un mecanisme
          # que FIX2 ne peut pas comparer textuellement (ex: alias() de
          # version catalog libs.versions.toml, ou apply plugin: legacy),
          # puis le module app/ redeclare EN PLUS une version explicite
          # pour le meme plugin. Un module non-racine ne doit jamais fixer
          # sa propre version pour ces plugins - c'est le role exclusif du
          # root/settings. On retire donc systematiquement toute version
          # explicite (syntaxe "version \"X\"" ET "version(\"X\")") pour ces
          # plugins bien connus, dans tout fichier situe hors de la racine
          # du projet (chemin contenant un "/").
          # ------------------------------------------------------------
          for GRADLE_FILE in $ALL_GRADLE_FILES; do
            case "$GRADLE_FILE" in
              *settings.gradle*) continue ;;
            esac
            # Uniquement les fichiers de module (pas la racine du projet).
            case "$GRADLE_FILE" in
              */*) : ;;
              *) continue ;;
            esac
            if [ -f "$GRADLE_FILE" ]; then
              python3 - "$GRADLE_FILE" "$FIXES_LOG" << 'PYEOF'
          import re
          import sys

          path, fixes_log = sys.argv[1], sys.argv[2]
          with open(path) as f:
              content = f.read()

          original = content

          KNOWN_PLUGINS = [
              'com.android.application',
              'com.android.library',
              'com.android.dynamic-feature',
              'org.jetbrains.kotlin.android',
              'org.jetbrains.kotlin.jvm',
              'com.google.gms.google-services',
          ]
          ids_pattern = '|'.join(re.escape(p) for p in KNOWN_PLUGINS)

          # Kotlin DSL, forme infixe : id("com.android.application") version "X"
          # Kotlin DSL, forme fonction : id("com.android.application") version("X")
          kt_pattern = re.compile(
              r'(id\s*\(\s*["\'](?:' + ids_pattern + r')["\']\s*\))'
              r'\s*version\s*'
              r'(?:\(\s*["\'][^"\']+["\']\s*\)|["\'][^"\']+["\'])'
          )
          content = kt_pattern.sub(r'\1', content)

          # Groovy DSL : id 'com.android.application' version 'X' (ou version('X'))
          groovy_pattern = re.compile(
              r"(id\s+['\"](?:" + ids_pattern + r")['\"])"
              r"\s*version\s*"
              r"(?:\(\s*['\"][^'\"]+['\"]\s*\)|['\"][^'\"]+['\"])"
          )
          content = groovy_pattern.sub(r'\1', content)

          if content != original:
              with open(path, 'w') as f:
                  f.write(content)
              with open(fixes_log, 'a') as log:
                  log.write(f"Version explicite retiree des plugins Android/Kotlin dans {path} (un module non-racine ne doit pas fixer sa propre version - evite 'plugin already on classpath with unknown version').\n")
          PYEOF
            fi
          done

          # FIX 3 : syntaxe DSL AGP recente "compileSdk { version = release(N) {...} }"
          for GRADLE_FILE in $ALL_GRADLE_FILES; do
            case "$GRADLE_FILE" in
              *settings.gradle*) continue ;;
            esac
            if [ -f "$GRADLE_FILE" ] && grep -qE '(compileSdk|targetSdk|minSdk)\s*\{\s*version\s*=\s*release\(' "$GRADLE_FILE" 2>/dev/null; then
              echo "Syntaxe DSL Sdk { version = release(...) } detectee dans $GRADLE_FILE - simplification..."
              python3 - "$GRADLE_FILE" "$FIXES_LOG" << 'PYEOF'
          import re
          import sys
          path, fixes_log = sys.argv[1], sys.argv[2]

          with open(path) as f:
              content = f.read()

          pattern = re.compile(
              r'(compileSdk|targetSdk|minSdk)\s*\{\s*version\s*=\s*release\(\s*(\d+)\s*\)\s*(\{[^}]*\})?\s*\}'
          )

          matches = []
          def repl(m):
              matches.append((m.group(1), m.group(2)))
              return f'{m.group(1)} = {m.group(2)}'

          new_content = pattern.sub(repl, content)

          if matches:
              with open(path, 'w') as f:
                  f.write(new_content)
              details = ", ".join(f"{field} {{ version = release({ver}) {{...}} }} -> {field} = {ver}" for field, ver in matches)
              with open(fixes_log, 'a') as log:
                  log.write(f"Syntaxe DSL Sdk simplifiee dans {path} ({details})\n")
          PYEOF
            fi
          done

      - name: Build Kotlin/Java
        id: build
        run: |
          set -e
          set -o pipefail
          cd "$GRADLE_PROJECT_ROOT"

          # ============================================================
          # FIX 3 (+ mapping affine) : la version Gradle du wrapper doit
          # etre compatible avec l'AGP declare dans build.gradle(.kts). Le
          # minimum requis varie par version MINEURE d'AGP, pas seulement
          # par version majeure (ex: AGP 8.9.x exige Gradle >= 8.11.1, alors
          # qu'AGP 8.0.x se contente de Gradle 8.0) - un mapping uniquement
          # par majeure (tout "8.x" -> "8.9") est donc insuffisant et fait
          # planter le build avec "Minimum supported Gradle version is
          # 8.11.1. Current version is 8.9". On detecte l'AGP et on choisit
          # la version Gradle minimale correspondante d'apres la table de
          # compatibilite officielle Android/Gradle, MEME si un wrapper
          # existe deja.
          # ============================================================
          detect_required_gradle_version() {
            local agp_version=""
            agp_version=$(grep -rhoE "com\.android\.(application|library)['\"]\)?\s+version\s+['\"][0-9]+\.[0-9]+(\.[0-9]+)?['\"]|com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+(\.[0-9]+)?" \
              . --include="build.gradle" --include="build.gradle.kts" --include="settings.gradle" --include="settings.gradle.kts" 2>/dev/null \
              | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | head -1)

            # ------------------------------------------------------------
            # FIX12 (corrige) : la version AGP n'est pas toujours ecrite en
            # dur dans build.gradle(.kts) - les projets Android Studio
            # recents la declarent via un VERSION CATALOG
            # (gradle/libs.versions.toml), reference ensuite par
            # alias(libs.plugins.android.application) sans aucun numero de
            # version visible dans les fichiers .gradle.
            #
            # BUG CORRIGE : la structure reelle d'un catalog est
            #   [plugins]
            #   android-application = { id = "com.android.application", version.ref = "agp" }
            # La cle a gauche du "=" est un ALIAS ARBITRAIRE (ex:
            # "android-application"), PAS "com.android.application" - le
            # plugin ID n'apparait que comme VALEUR du champ "id" a
            # l'interieur des accolades. La version precedente de ce fix
            # cherchait "com.android.application" comme cle directe, ce qui
            # ne correspond jamais a la vraie syntaxe TOML -> le catalog
            # n'etait jamais lu, et on retombait silencieusement sur le
            # defaut "8.9". On reecrit cette extraction en Python, qui gere
            # correctement les tables inline TOML (y compris sur plusieurs
            # lignes) plutot que de la deviner via un grep fragile.
            # ------------------------------------------------------------
            if [ -z "$agp_version" ]; then
              local toml_file
              toml_file=$(find . -iname "*.versions.toml" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null | head -1)
              if [ -n "$toml_file" ]; then
                agp_version=$(python3 - "$toml_file" << 'PYEOF'
          import re
          import sys

          path = sys.argv[1]
          with open(path) as f:
              content = f.read()

          # Section [plugins] : cherche l'entree dont le champ "id" vaut
          # com.android.application ou com.android.library, sur un bloc
          # allant jusqu'a la prochaine accolade fermante (gere le cas
          # multi-lignes en plus du cas inline classique).
          version_ref = None
          for m in re.finditer(r'\{([^}]*)\}', content, re.DOTALL):
              block = m.group(1)
              if re.search(r'id\s*=\s*"com\.android\.(application|library)"', block):
                  ref_match = re.search(r'version\.ref\s*=\s*"([^"]+)"', block)
                  if ref_match:
                      version_ref = ref_match.group(1)
                      break
                  # Version fixee directement dans le bloc plugins (rare,
                  # mais possible) : version = "9.1.1" sans passer par un
                  # alias de la table [versions].
                  direct_match = re.search(r'(?<!\.ref\s*=\s*)version\s*=\s*"([0-9]+\.[0-9]+(?:\.[0-9]+)?)"', block)
                  if direct_match:
                      print(direct_match.group(1))
                      sys.exit(0)

          if version_ref:
              # Cherche la valeur de cet alias dans la section [versions] :
              # "agp = "9.1.1""  (avec ou sans espaces, guillemets simples
              # ou doubles).
              ref_pattern = re.compile(
                  r'^\s*' + re.escape(version_ref) + r'\s*=\s*["\']([0-9]+\.[0-9]+(?:\.[0-9]+)?)["\']',
                  re.MULTILINE
              )
              ref_match = ref_pattern.search(content)
              if ref_match:
                  print(ref_match.group(1))
                  sys.exit(0)

          # Fallback heuristique : cle conventionnelle "agp" (nom par
          # defaut utilise par Android Studio pour la table [versions]),
          # au cas ou l'analyse structuree ci-dessus n'ait rien trouve.
          fallback = re.search(r'^\s*agp\s*=\s*["\']([0-9]+\.[0-9]+(?:\.[0-9]+)?)["\']', content, re.MULTILINE)
          if fallback:
              print(fallback.group(1))
          PYEOF
                )
                [ -n "$agp_version" ] && echo "AGP detecte via version catalog ($toml_file) : $agp_version" >&2
              fi
            fi

            if [ -z "$agp_version" ]; then
              echo "8.9"
              return
            fi

            local agp_major agp_minor
            agp_major=$(echo "$agp_version" | cut -d. -f1)
            agp_minor=$(echo "$agp_version" | cut -d. -f2)

            # Table de compatibilite AGP -> Gradle minimum (par version
            # MINEURE), d'apres la doc officielle Android Gradle Plugin.
            # Volontairement conservateur : en cas de version AGP future
            # non listee, on retombe sur le plus haut minimum connu de la
            # meme serie majeure plutot que de risquer un minimum trop bas.
            if [ "$agp_major" -ge 9 ]; then
              echo "9.3.1"
              return
            fi

            if [ "$agp_major" -eq 8 ]; then
              if   [ "$agp_minor" -le 1 ]; then echo "8.0"
              elif [ "$agp_minor" -eq 2 ]; then echo "8.2"
              elif [ "$agp_minor" -eq 3 ]; then echo "8.4"
              elif [ "$agp_minor" -eq 4 ]; then echo "8.6"
              elif [ "$agp_minor" -le 6 ]; then echo "8.7"
              elif [ "$agp_minor" -eq 7 ]; then echo "8.9"
              elif [ "$agp_minor" -eq 8 ]; then echo "8.10.2"
              else echo "8.11.1"
              fi
              return
            fi

            echo "8.9"
          }

          REQUIRED_GRADLE_VERSION=$(detect_required_gradle_version)
          echo "Version Gradle requise (deduite de l'AGP du projet) : $REQUIRED_GRADLE_VERSION"

          # ============================================================
          # FIX 6 : un gradlew present ne veut pas dire un wrapper valide.
          # Si gradle-wrapper.jar est absent, vide, ou n'est pas un zip
          # valide (jar corrompu), gradlew plantera avec "Unable to access
          # jarfile gradle-wrapper.jar" sans que le check existant
          # ("[ ! -f gradlew ]") ne le detecte. On verifie explicitement.
          # ============================================================
          is_wrapper_valid() {
            [ -s "gradlew" ] || return 1
            [ -s "gradle/wrapper/gradle-wrapper.jar" ] || return 1
            unzip -tq "gradle/wrapper/gradle-wrapper.jar" >/dev/null 2>&1 || return 1
            return 0
          }

          generate_gradle_wrapper() {
            local gradle_version="$1"
            echo "Wrapper manquant ou invalide - generation (Gradle $gradle_version)..."

            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version "$gradle_version" || true
            fi

            if ! is_wrapper_valid; then
              echo "Fallback : telechargement direct des fichiers wrapper officiels..."
              mkdir -p gradle/wrapper
              for TAG in "v${gradle_version}" "v${gradle_version}.0"; do
                if curl -fsSL -o gradlew "https://raw.githubusercontent.com/gradle/gradle/${TAG}/gradlew" && [ -s gradlew ]; then
                  curl -fsSL -o gradlew.bat "https://raw.githubusercontent.com/gradle/gradle/${TAG}/gradlew.bat" || true
                  curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/${TAG}/gradle/wrapper/gradle-wrapper.jar" || true
                  if unzip -tq "gradle/wrapper/gradle-wrapper.jar" >/dev/null 2>&1; then
                    break
                  fi
                fi
              done
            fi

            # Ecrit / reecrit systematiquement gradle-wrapper.properties avec
            # la version requise, meme si le fichier existait deja avec une
            # version incompatible avec l'AGP du projet.
            mkdir -p gradle/wrapper
            cat > gradle/wrapper/gradle-wrapper.properties << PROPS_EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-${gradle_version}-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS_EOF

            chmod +x gradlew 2>/dev/null || true

            is_wrapper_valid
          }

          if ! is_wrapper_valid; then
            if ! generate_gradle_wrapper "$REQUIRED_GRADLE_VERSION"; then
              echo "error_message=Impossible de generer un wrapper Gradle valide (version requise: $REQUIRED_GRADLE_VERSION). Ni la commande systeme, ni le telechargement de secours n'ont fonctionne." >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            # Wrapper present ET valide, mais peut pointer vers une version
            # Gradle trop ancienne pour l'AGP du projet : on met a jour
            # distributionUrl si besoin, sans regenerer gradlew/le jar.
            # Comparaison de version COMPLETE (via sort -V), pas seulement
            # le major - un wrapper 8.9 est "major 8" comme un requis
            # 8.11.1, une comparaison majeure seule aurait manque la mise
            # a jour necessaire.
            CURRENT_URL_VERSION=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-(bin|all)\.zip' gradle/wrapper/gradle-wrapper.properties 2>/dev/null | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
            if [ -n "$CURRENT_URL_VERSION" ] && [ "$CURRENT_URL_VERSION" != "$REQUIRED_GRADLE_VERSION" ]; then
              LOWER_VERSION=$(printf '%s\n%s\n' "$CURRENT_URL_VERSION" "$REQUIRED_GRADLE_VERSION" | sort -V | head -1)
              if [ "$LOWER_VERSION" == "$CURRENT_URL_VERSION" ] && [ "$CURRENT_URL_VERSION" != "$REQUIRED_GRADLE_VERSION" ]; then
                echo "Wrapper existant pointe vers Gradle $CURRENT_URL_VERSION, insuffisant pour l'AGP detecte (requis: $REQUIRED_GRADLE_VERSION) -> mise a jour"
                sed -i -E "s#(distributionUrl=.*gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(-(bin|all)\.zip)#\1${REQUIRED_GRADLE_VERSION}\3#" gradle/wrapper/gradle-wrapper.properties
              fi
            fi
            chmod +x gradlew 2>/dev/null || true
          fi

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
          FORMAT="${{ github.event.inputs.output_format }}"

          run_gradle() {
            TASK="$1"
            if ! ./gradlew "$TASK" 2>&1 | tee /tmp/gradle_output.log; then
              ERROR_MSG=$(grep -A 8 "What went wrong" /tmp/gradle_output.log | head -25)
              [ -z "$ERROR_MSG" ] && ERROR_MSG=$(tail -30 /tmp/gradle_output.log)
              ERROR_MSG=$(echo "$ERROR_MSG" | tr '\n' ' ' | tr -d '\r')
              echo "error_message=Gradle build failed: $ERROR_MSG" >> "$GITHUB_OUTPUT"
              return 1
            fi
          }

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            if ! grep -q "signingConfigs" app/build.gradle 2>/dev/null && ! grep -q "signingConfigs" app/build.gradle.kts 2>/dev/null; then
              mkdir -p app
              cat > app/signing.gradle << GRADLE_EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_FILE")
                storePassword "${{ github.event.inputs.keystore_password }}"
                keyAlias "${{ github.event.inputs.keystore_alias }}"
                keyPassword "${{ github.event.inputs.keystore_password }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
              if [ -f "app/build.gradle" ]; then
                echo "apply from: 'signing.gradle'" >> app/build.gradle
              elif [ -f "app/build.gradle.kts" ]; then
                echo "apply(from = \"signing.gradle\")" >> app/build.gradle.kts
              fi
            fi
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              run_gradle assembleRelease || exit 1
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              run_gradle bundleRelease || exit 1
            fi
          else
            run_gradle assembleDebug || exit 1
          fi

          echo "error_message=success" >> "$GITHUB_OUTPUT"

          FIXES_LOG="$GITHUB_WORKSPACE/fixes.log"
          if [ -f "$FIXES_LOG" ] && [ -s "$FIXES_LOG" ]; then
            {
              echo "fixes_applied<<FIXES_EOF"
              cat "$FIXES_LOG"
              echo "FIXES_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-kotlin-java-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 6: BUILD FLUTTER (inchange)
  # ============================================================
  build-flutter:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && needs.prepare.outputs.detected_type == 'flutter' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      error_message: ${{ steps.build.outputs.error_message || '' }}
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/src/**/.dart_tool
            ${{ github.workspace }}/src/**/pubspec.lock
          key: flutter-deps-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-deps-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Flutter
        id: build
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)

          # FIX 5 : pas de pubspec.yaml -> au lieu d'un echec sec, on genere
          # un scaffold Flutter minimal a partir des .dart trouves (les
          # clients envoient parfois juste un lib/ sans le reste du projet).
          if [ -z "$PROJECT_ROOT" ]; then
            DART_FILES=$(find . -name "*.lib" -o -name "*.dart" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" 2>/dev/null | head -1)
            if [ -z "$(find . -name "*.dart" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" | head -1)" ]; then
              echo "error_message=Aucun pubspec.yaml ni fichier .dart trouve dans le projet - impossible de generer un scaffold Flutter." >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "pubspec.yaml manquant mais fichiers .dart trouves - generation d'un scaffold Flutter minimal..."
            SCAFFOLD_DIR="scaffolded-flutter-${{ github.event.inputs.build_id }}"
            mkdir -p /tmp/dart_backup
            find . -name "*.dart" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec cp {} /tmp/dart_backup/ \;

            flutter config --enable-android
            flutter create --platforms=android --project-name app "$SCAFFOLD_DIR"
            cp /tmp/dart_backup/*.dart "$SCAFFOLD_DIR/lib/" 2>/dev/null || true

            # S'assure qu'il existe bien un point d'entree main() dans lib/main.dart
            if ! grep -rl "void main(" "$SCAFFOLD_DIR/lib/" >/dev/null 2>&1; then
              echo "Aucune fonction main() trouvee dans les .dart fournis - le main.dart par defaut de 'flutter create' est conserve."
            else
              rm -f "$SCAFFOLD_DIR/lib/main.dart.orig" 2>/dev/null || true
            fi

            PROJECT_ROOT="$SCAFFOLD_DIR"
            echo "Scaffold Flutter genere dans $SCAFFOLD_DIR/"
          fi

          cd "$PROJECT_ROOT"

          if [ ! -d "android" ]; then
            echo "android/ manquant - regeneration avec backup..."
            mkdir -p /tmp/flutter_backup
            [ -f "pubspec.yaml" ] && cp pubspec.yaml /tmp/flutter_backup/
            [ -d "lib" ] && cp -r lib /tmp/flutter_backup/
            [ -f "analysis_options.yaml" ] && cp analysis_options.yaml /tmp/flutter_backup/

            flutter config --enable-android
            flutter create --platforms=android --overwrite .

            [ -f "/tmp/flutter_backup/pubspec.yaml" ] && cp /tmp/flutter_backup/pubspec.yaml pubspec.yaml
            [ -d "/tmp/flutter_backup/lib" ] && cp -r /tmp/flutter_backup/lib/* lib/ 2>/dev/null || true
            [ -f "/tmp/flutter_backup/analysis_options.yaml" ] && cp /tmp/flutter_backup/analysis_options.yaml .

            echo "android/ regenere avec backup restaure"
          fi

          # ============================================================
          # FIX8 (NOUVEAU) : android/ existant (fourni par le client) mais
          # incoherent - app/build.gradle(.kts) declare un plugin AGP/Kotlin
          # SANS version ("id(\"com.android.application\")"), en s'attendant
          # a ce que la version soit fixee dans settings.gradle(.kts) via
          # pluginManagement { plugins { ... version \"X\" apply false } }.
          # Si ce bloc est absent/incomplet, Gradle echoue avec "plugin
          # dependency must include a version number for this source".
          # On detecte ce cas et on injecte des versions par defaut connues
          # pour etre compatibles avec le Flutter stable installe sur le
          # runner.
          # ============================================================
          if [ -d "android" ]; then
            SETTINGS_FILE=""
            for f in android/settings.gradle.kts android/settings.gradle; do
              [ -f "$f" ] && SETTINGS_FILE="$f" && break
            done
            APP_GRADLE_FILE=""
            for f in android/app/build.gradle.kts android/app/build.gradle; do
              [ -f "$f" ] && APP_GRADLE_FILE="$f" && break
            done

            if [ -n "$SETTINGS_FILE" ] && [ -n "$APP_GRADLE_FILE" ]; then
              python3 - "$SETTINGS_FILE" "$APP_GRADLE_FILE" << 'PYEOF'
          import re
          import sys

          settings_path, app_path = sys.argv[1], sys.argv[2]

          with open(app_path) as f:
              app_content = f.read()
          with open(settings_path) as f:
              settings_content = f.read()

          # Plugins couramment declares sans version au niveau app/, avec la
          # version par defaut a injecter s'ils en manquent une globalement.
          DEFAULT_VERSIONS = {
              'com.android.application': '8.5.0',
              'org.jetbrains.kotlin.android': '1.9.24',
          }

          bare_plugin_pattern = re.compile(
              r'id\s*\(\s*["\'](?P<id>[\w.\-]+)["\']\s*\)(?!\s*version)|'
              r'id\s+["\'](?P<id2>[\w.\-]+)["\'](?!\s+version)'
          )

          needed = []
          for m in bare_plugin_pattern.finditer(app_content):
              pid = m.group('id') or m.group('id2')
              if pid in DEFAULT_VERSIONS:
                  # Cette version est-elle deja declaree QUELQUE PART dans
                  # settings (pluginManagement.plugins) ?
                  if not re.search(re.escape(pid) + r'["\'\)]\s*\)?\s*version\s*["\']', settings_content) and \
                     not re.search(r'version\s*["\'][^"\']+["\']\s*\)?\s*\n?\s*id\s*\(?\s*["\']' + re.escape(pid), settings_content):
                      needed.append(pid)

          if needed:
              idx = settings_content.find('pluginManagement')
              if idx != -1:
                  brace = settings_content.find('{', idx)
                  plugins_idx = settings_content.find('plugins', brace)
                  # Cherche un bloc plugins { } DANS pluginManagement (avant la
                  # fin du bloc pluginManagement, approx via prochaine accolade
                  # fermante de meme profondeur - recherche simplifiee).
                  block_end_search = settings_content.find('\n}', brace)
                  has_plugins_block = plugins_idx != -1 and (block_end_search == -1 or plugins_idx < block_end_search)

                  lines_to_add = "\n".join(
                      f'        id("{pid}") version "{DEFAULT_VERSIONS[pid]}" apply false'
                      for pid in needed
                  )

                  if has_plugins_block:
                      pbrace = settings_content.find('{', plugins_idx)
                      settings_content = settings_content[:pbrace + 1] + "\n" + lines_to_add + settings_content[pbrace + 1:]
                  else:
                      insertion = f"\n    plugins {{\n{lines_to_add}\n    }}\n"
                      settings_content = settings_content[:brace + 1] + insertion + settings_content[brace + 1:]

                  with open(settings_path, 'w') as f:
                      f.write(settings_content)
                  print(f"FIX8 applique : version(s) injectee(s) pour {', '.join(needed)} dans {settings_path}")
              else:
                  print(f"ATTENTION FIX8 : plugin(s) sans version ({needed}) detecte(s) dans {app_path}, mais aucun bloc pluginManagement trouve dans {settings_path} - correction manuelle necessaire.")
          PYEOF
            fi
          fi

          flutter pub get

          FORMAT="${{ github.event.inputs.output_format }}"
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            mkdir -p android
            cat > android/key.properties << EOF
          storePassword=${{ github.event.inputs.keystore_password }}
          keyPassword=${{ github.event.inputs.keystore_password }}
          keyAlias=${{ github.event.inputs.keystore_alias }}
          storeFile=$KEYSTORE_FILE
          EOF
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              flutter build apk --release
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              flutter build appbundle --release
            fi
          else
            flutter build apk --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-flutter-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 7: BUILD PYTHON (Android) — Buildozer par defaut (tolerant,
  # accepte n'importe quel .py), Briefcase seulement si le client a
  # deja une config [tool.briefcase] complexe (plusieurs apps ou
  # liste de requires etendue -> signe un vrai projet Briefcase
  # volontaire qu'on ne veut pas casser).
  # ============================================================
  build-python:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && needs.prepare.outputs.detected_type == 'python' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      error_message: ${{ steps.build-buildozer.outputs.error_message || steps.build-briefcase.outputs.error_message || '' }}
      tool_used: ${{ steps.decide.outputs.tool }}
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip / buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.buildozer
          key: pip-buildozer-${{ runner.os }}-${{ hashFiles('**/requirements.txt', '**/pyproject.toml', '**/buildozer.spec') }}
          restore-keys: |
            pip-buildozer-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build dependencies (Buildozer)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev unzip

      # ============================================================
      # DECISION : Buildozer par defaut. Briefcase seulement si une
      # config [tool.briefcase] deja etoffee est trouvee (plusieurs
      # apps declares, ou une liste "requires" de plus de 3 paquets),
      # ce qui indique un projet Briefcase construit intentionnellement
      # qu'on ne veut pas court-circuiter.
      # ============================================================
      - name: Decide Buildozer vs Briefcase
        id: decide
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . \( -name "setup.py" -o -name "pyproject.toml" -o -name "app.py" -o -name "main.py" -o -name "buildozer.spec" \) -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT=$(find . -name "*.py" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"
          echo "PYTHON_PROJECT_ROOT=$PWD" >> "$GITHUB_ENV"

          TOOL="buildozer"

          if [ -f "buildozer.spec" ]; then
            TOOL="buildozer"
            echo "buildozer.spec present -> Buildozer"
          elif [ -f "pyproject.toml" ] && grep -q "\[tool.briefcase\]" pyproject.toml 2>/dev/null; then
            APP_SECTIONS=$(grep -c "^\[tool\.briefcase\.app\." pyproject.toml 2>/dev/null || echo 0)
            REQUIRES_COUNT=$(awk '/^\[tool\.briefcase/{inside=1} /^\[/{if(!/tool\.briefcase/) inside=0} inside && /requires\s*=/{print}' pyproject.toml 2>/dev/null | grep -o '"[^"]*"' | wc -l)
            if [ "$APP_SECTIONS" -gt 1 ] || [ "$REQUIRES_COUNT" -gt 3 ]; then
              TOOL="briefcase"
              echo "Config [tool.briefcase] etoffee detectee (apps=$APP_SECTIONS, requires=$REQUIRES_COUNT) -> Briefcase"
            else
              echo "pyproject.toml minimal avec [tool.briefcase] mais peu de config -> Buildozer (plus tolerant)"
            fi
          else
            echo "Aucune config Briefcase existante -> Buildozer par defaut"
          fi

          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"
          echo "=== OUTIL CHOISI: $TOOL ==="

      # ============================================================
      # BUILDOZER — chemin par defaut. Genere buildozer.spec si absent,
      # a partir de n'importe quel .py trouve (main.py, app.py, ou le
      # premier fichier .py rencontre).
      # ============================================================
      - name: Build with Buildozer
        id: build-buildozer
        if: ${{ steps.decide.outputs.tool == 'buildozer' }}
        run: |
          set -eu
          cd "$PYTHON_PROJECT_ROOT"

          ENTRY=""
          for candidate in main.py app.py; do
            [ -f "$candidate" ] && ENTRY="$candidate" && break
          done
          if [ -z "$ENTRY" ]; then
            ENTRY=$(find . -maxdepth 2 -name "*.py" -type f | head -1)
          fi
          if [ -z "$ENTRY" ]; then
            echo "Aucun fichier .py trouve - creation d'un main.py minimal..."
            cat > main.py << 'PYEOF'
          def main():
              print("Hello from Python!")
          if __name__ == "__main__":
              main()
          PYEOF
            ENTRY="main.py"
          fi

          # Si l'entree n'est pas nommee main.py, buildozer.spec pointera
          # vers elle via "source.include_exts" / on la copie en main.py
          # pour rester dans la convention Buildozer standard.
          if [ "$ENTRY" != "main.py" ]; then
            cp "$ENTRY" main.py
          fi

          # Detection de Kivy (sinon requirement python3 seul, qui marche
          # pour n'importe quel script pur, meme sans UI graphique Kivy).
          REQUIREMENTS="python3"
          if grep -rl "^import kivy\|^from kivy" . --include="*.py" >/dev/null 2>&1; then
            REQUIREMENTS="python3,kivy"
            echo "Kivy detecte dans les sources"
          fi

          if [ ! -f "buildozer.spec" ]; then
            echo "buildozer.spec manquant - generation automatique..."
            PKG_ID="${{ github.event.inputs.package_id }}"
            [ -z "$PKG_ID" ] && PKG_ID="com.philtech.app"
            PKG_DOMAIN=$(echo "$PKG_ID" | rev | cut -d. -f2- | rev)
            PKG_NAME=$(echo "$PKG_ID" | rev | cut -d. -f1 | rev)
            [ -z "$PKG_DOMAIN" ] && PKG_DOMAIN="com.philtech"
            [ -z "$PKG_NAME" ] && PKG_NAME="app"

            cat > buildozer.spec << SPEC_EOF
          [app]
          title = ${{ github.event.inputs.app_name }}
          package.name = $PKG_NAME
          package.domain = $PKG_DOMAIN
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,ttf
          version = 1.0
          requirements = $REQUIREMENTS
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 34
          android.minapi = 24
          android.archs = arm64-v8a
          android.allow_backup = True

          [buildozer]
          log_level = 2
          warn_on_root = 0
          SPEC_EOF
          fi

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          pip install --upgrade pip
          pip install --upgrade buildozer cython

          set +e
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            export P4A_RELEASE_KEYSTORE="$KEYSTORE_FILE"
            export P4A_RELEASE_KEYSTORE_PASSWD="${{ github.event.inputs.keystore_password }}"
            export P4A_RELEASE_KEYALIAS="${{ github.event.inputs.keystore_alias }}"
            export P4A_RELEASE_KEYALIAS_PASSWD="${{ github.event.inputs.keystore_password }}"
            yes | buildozer -v android release 2>&1 | tee /tmp/buildozer.log
          else
            yes | buildozer -v android debug 2>&1 | tee /tmp/buildozer.log
          fi
          BUILDOZER_EXIT=$?
          set -e

          if [ "$BUILDOZER_EXIT" -ne 0 ]; then
            ERROR_MSG=$(tail -40 /tmp/buildozer.log | tr '\n' ' ' | tr -d '\r')
            echo "error_message=Buildozer build failed: $ERROR_MSG" >> "$GITHUB_OUTPUT"
            echo "buildozer_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "error_message=success" >> "$GITHUB_OUTPUT"

      # ============================================================
      # BRIEFCASE — seulement pour les projets deja construits pour
      # Briefcase de facon deliberee (voir "Decide" ci-dessus).
      # ============================================================
      - name: Build with Briefcase
        id: build-briefcase
        if: ${{ steps.decide.outputs.tool == 'briefcase' }}
        run: |
          set -eu
          cd "$PYTHON_PROJECT_ROOT"

          sed -i -E 's/^([[:space:]]*license[[:space:]]*=[[:space:]]*)"testapp"[[:space:]]*$/\1"LicenseRef-Proprietary"/' pyproject.toml
          if ! awk '/^\[project\]$/{inside=1; next} /^\[/{inside=0} inside && /^[[:space:]]*license[[:space:]]*=/{found=1} END{exit !found}' pyproject.toml; then
            sed -i '/^\[project\]$/a license = "LicenseRef-Proprietary"' pyproject.toml
          fi
          if ! awk '/^\[tool\.briefcase\]$/{inside=1; next} /^\[/{inside=0} inside && /^[[:space:]]*license[[:space:]]*=/{found=1} END{exit !found}' pyproject.toml; then
            sed -i '/^\[tool\.briefcase\]$/a license = "LicenseRef-Proprietary"' pyproject.toml
          fi

          if [ ! -f "main.py" ] && [ ! -f "app.py" ]; then
            cat > main.py << 'EOF'
          def main():
              print("Hello from Python!")
          if __name__ == "__main__":
              main()
          EOF
          fi

          pip install --upgrade pip
          pip install --upgrade briefcase

          set +e
          briefcase create android 2>&1 | tee /tmp/briefcase.log
          briefcase build android 2>&1 | tee -a /tmp/briefcase.log
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            briefcase package android 2>&1 | tee -a /tmp/briefcase.log
          else
            briefcase package android --adhoc-sign 2>&1 | tee -a /tmp/briefcase.log
          fi
          BRIEFCASE_EXIT=$?
          set -e

          if [ "$BRIEFCASE_EXIT" -ne 0 ]; then
            ERROR_MSG=$(tail -40 /tmp/briefcase.log | tr '\n' ' ' | tr -d '\r')
            echo "error_message=Briefcase build failed: $ERROR_MSG" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "error_message=success" >> "$GITHUB_OUTPUT"

      - name: Sign APK with keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' && steps.decide.outputs.tool == 'briefcase' }}
        run: |
          set -e
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
          if [ -n "$APK_SIGNER" ] && [ -n "$KEYSTORE_FILE" ]; then
            for apk in $(find $GITHUB_WORKSPACE/src/ -name "*.apk"); do
              "$APK_SIGNER" sign --ks "$KEYSTORE_FILE" --ks-pass pass:"${{ github.event.inputs.keystore_password }}" --key-pass pass:"${{ github.event.inputs.keystore_password }}" --ks-key-alias "${{ github.event.inputs.keystore_alias }}" "$apk"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-python-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 8: BUILD .NET MAUI (inchange)
  # ============================================================
  build-dotnet:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && contains(fromJson('["dotnet-maui","maui","csharp"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache .NET packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build .NET MAUI
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "*.csproj" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"

          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "ERREUR: Aucun fichier .csproj trouve"
            exit 1
          fi

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            dotnet publish "$CSPROJ" -f net8.0-android -c Release
          else
            dotnet build "$CSPROJ" -f net8.0-android -c Debug
          fi

      - name: Sign APK with keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
          if [ -n "$APK_SIGNER" ] && [ -n "$KEYSTORE_FILE" ]; then
            for apk in $(find $GITHUB_WORKSPACE/src/ -name "*.apk"); do
              "$APK_SIGNER" sign --ks "$KEYSTORE_FILE" --ks-pass pass:"${{ github.event.inputs.keystore_password }}" --key-pass pass:"${{ github.event.inputs.keystore_password }}" --ks-key-alias "${{ github.event.inputs.keystore_alias }}" "$apk"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dotnet-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 9: BUILD OTHER (Go / Godot / Lua / NativeScript) — inchange
  # ============================================================
  build-other:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["go","godot","lua","nativescript"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      error_message: ${{ steps.build-go.outputs.error_message || steps.build-godot.outputs.error_message || steps.build-lua.outputs.error_message || steps.build-nativescript.outputs.error_message || '' }}
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Go
        if: ${{ needs.prepare.outputs.detected_type == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        if: ${{ needs.prepare.outputs.detected_type == 'go' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Setup Godot
        if: ${{ needs.prepare.outputs.detected_type == 'godot' }}
        run: |
          set -e
          GODOT_VERSION="4.2.2"
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" || exit 1
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" || exit 1
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Build Go project
        id: build-go
        if: ${{ needs.prepare.outputs.detected_type == 'go' }}
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "go.mod" -type f -exec dirname {} \; | head -1)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERREUR: Aucun go.mod trouve"
            echo "error_message=ERREUR: go.mod manquant dans le projet Go" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          cd "$PROJECT_ROOT"

          GO_FILES=$(find . -name "*.go" -type f | head -1)
          if [ -z "$GO_FILES" ]; then
            echo "Aucun fichier .go - creation d'un main.go minimal..."
            mkdir -p cmd/app
            cat > cmd/app/main.go << 'EOF'
          package main
          import "fmt"
          func main() { fmt.Println("Hello from Go!") }
          EOF
          fi

          echo "=== Compilation Go pour Android ==="
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 go build -ldflags="-s -w" -o libapp.so . 2>go_error.log || {
            ERROR_MSG=$(cat go_error.log | head -20)
            echo "ERREUR compilation Go: $ERROR_MSG"
            echo "error_message=ERREUR compilation Go: $ERROR_MSG" >> "$GITHUB_OUTPUT"
            cat go_error.log
            exit 1
          }

          echo "=== Packaging en APK ==="
          mkdir -p android/lib/arm64-v8a
          mv libapp.so android/lib/arm64-v8a/

          AAPT2=$(find "$ANDROID_SDK_ROOT" -name "aapt2" -type f 2>/dev/null | head -1)
          if [ -z "$AAPT2" ]; then
            sdkmanager "build-tools;34.0.0"
            AAPT2=$(find "$ANDROID_SDK_ROOT" -name "aapt2" -type f 2>/dev/null | head -1)
          fi

          mkdir -p apk_build/lib/arm64-v8a
          cp android/lib/arm64-v8a/libapp.so apk_build/lib/arm64-v8a/
          echo '{"versionCode":1,"versionName":"1.0"}' > apk_build/AndroidManifest.json

          ZIPALIGN=$(find "$ANDROID_SDK_ROOT" -name "zipalign" -type f 2>/dev/null | head -1)
          if [ -n "$ZIPALIGN" ] && [ -n "$AAPT2" ]; then
            mkdir -p empty_apk/META-INF
            touch empty_apk/META-INF/MANIFEST.MF
            cd empty_apk && zip -r ../base.apk . && cd ..

            $ZIPALIGN -f 4 base.apk app-unsigned.apk

            KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
            APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
            if [ -n "$APK_SIGNER" ] && [ -n "$KEYSTORE_FILE" ]; then
              $APK_SIGNER sign --ks "$KEYSTORE_FILE" --ks-pass pass:"${{ github.event.inputs.keystore_password }}" --key-pass pass:"${{ github.event.inputs.keystore_password }}" --ks-key-alias "${{ github.event.inputs.keystore_alias }}" app-unsigned.apk
              mv app-unsigned.apk app.apk
            else
              mv app-unsigned.apk app.apk
            fi
            echo "app.apk genere avec succes"
            echo "error_message=success" >> "$GITHUB_OUTPUT"
          else
            echo "ERREUR: aapt2/zipalign non trouves"
            echo "error_message=ERREUR: outils Android manquants pour packaging" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Build Godot project
        id: build-godot
        if: ${{ needs.prepare.outputs.detected_type == 'godot' }}
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "project.godot" -type f -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"

          if [ ! -f "export_presets.cfg" ]; then
            cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          android_architectures/arm64-v8a=true
          EOF
          fi

          if ! godot --headless --export-release "Android" build.apk 2>godot_error.log; then
            ERROR_MSG=$(cat godot_error.log | head -20)
            echo "error_message=ERREUR Godot: $ERROR_MSG" >> "$GITHUB_OUTPUT"
            cat godot_error.log
            exit 1
          fi
          echo "error_message=success" >> "$GITHUB_OUTPUT"

      - name: Build Lua project
        id: build-lua
        if: ${{ needs.prepare.outputs.detected_type == 'lua' }}
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "build.settings" -type f -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"

          if [ ! -f "build.settings" ]; then
            echo "build.settings manquant - creation..."
            cat > build.settings << 'EOF'
          {
              "android": {
                  "versionCode": 1,
                  "versionName": "1.0.0"
              }
          }
          EOF
          fi

          if command -v solar2d.sh &> /dev/null || [ -f "/opt/solar2d/solar2d.sh" ]; then
            if ! /opt/solar2d/solar2d.sh build android 2>lua_error.log; then
              ERROR_MSG=$(cat lua_error.log | head -20)
              echo "error_message=ERREUR Lua/Solar2D: $ERROR_MSG" >> "$GITHUB_OUTPUT"
              cat lua_error.log
              exit 1
            fi
          else
            echo "Solar2D non disponible - fallback vers Love2D"
            zip -r app.love . -x "*.git*" -x "build.settings"
            LOVE_APK_URL="https://github.com/love2d/love/releases/download/11.5/love-11.5-android.apk"
            curl -L -o love-base.apk "$LOVE_APK_URL" || {
              echo "error_message=ERREUR: Love2D APK non telechargeable" >> "$GITHUB_OUTPUT"
              exit 1
            }
            mkdir -p love_work
            cd love_work
            unzip -o ../love-base.apk
            cp ../app.love assets/game.love
            zip -r ../app.apk .
            cd ..
            echo "APK Love2D genere"
            echo "error_message=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Build NativeScript project
        id: build-nativescript
        if: ${{ needs.prepare.outputs.detected_type == 'nativescript' }}
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "package.json" -type f -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"

          echo "CI_NATIVE_SCRIPT_FIX=ns-compat-v3"
          if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
            npm ci --prefer-offline
          else
            npm install --prefer-offline
          fi

          if [ ! -f "webpack.config.js" ]; then
            if [ -d "node_modules/tns-core-modules" ]; then
              npm install --save-dev "nativescript-dev-webpack@~1.5.0"
              npx update-ns-webpack --configs --deps
            elif [ -x "node_modules/.bin/update-ns-webpack" ]; then
              npx update-ns-webpack --configs --deps
            else
              npm install --save-dev "@nativescript/webpack@5.0.0"
              cat > webpack.config.js << 'EOF'
          const webpack = require("@nativescript/webpack");
          const pkg = require("./package.json");
          module.exports = (env) => {
            webpack.init(env);
            const deps = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
            if (deps.svelte || deps["svelte-native"] || deps["@nativescript/svelte"]) {
              webpack.useConfig("svelte");
            }
            webpack.mergeWebpack({
              stats: { all: false, errors: true, errorDetails: true, warnings: false }
            });
            return webpack.resolveConfig();
          };
          EOF
            fi
          fi
          if [ ! -f "webpack.config.js" ]; then
            echo "ERREUR: webpack.config.js n'a pas pu etre genere."
            exit 1
          fi

          if [ -d "node_modules/tns-core-modules" ]; then
            NS_CLI_MAJOR=$(node -p "require('tns-core-modules/package.json').version.split('.')[0]")
            echo "NativeScript legacy core major: $NS_CLI_MAJOR"
            ns() { npx --yes "nativescript@${NS_CLI_MAJOR}" "$@"; }
          else
            NS_CLI_MAJOR=$(node -p "require('@nativescript/core/package.json').version.split('.')[0]")
            echo "NativeScript modern core major: $NS_CLI_MAJOR"
            ns() { npx --yes "nativescript@${NS_CLI_MAJOR}" "$@"; }
          fi
          report_ns_failure() {
            local log_file="$1"
            echo "=== Premieres erreurs NativeScript/Webpack ==="
            grep -m 1 -B 20 -A 40 -E 'ERROR in|Module not found|TypeError|SyntaxError|Cannot find module' "$log_file" || tail -120 "$log_file"
            ERROR_MSG=$(grep -m 1 -E 'ERROR in|Module not found|TypeError|SyntaxError|Cannot find module' "$log_file" || tail -1 "$log_file")
            echo "error_message=ERREUR NativeScript: $ERROR_MSG" >> "$GITHUB_OUTPUT"
          }

          if [ ! -d "android" ]; then
            if ! ns platform add android --env.commonjs > ns_platform.log 2>&1; then
              report_ns_failure ns_platform.log
              exit 1
            fi
          fi

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            if ! ns build android --release --env.commonjs --key-store-path "$KEYSTORE_FILE" --key-store-password "${{ github.event.inputs.keystore_password }}" --key-store-alias "${{ github.event.inputs.keystore_alias }}" --key-store-alias-password "${{ github.event.inputs.keystore_password }}" 2>ns_error.log; then
              ERROR_MSG=$(cat ns_error.log | head -20)
              echo "error_message=ERREUR NativeScript: $ERROR_MSG" >> "$GITHUB_OUTPUT"
              cat ns_error.log
              exit 1
            fi
          else
            if ! ns build android --debug --env.commonjs > ns_build.log 2>&1; then
              report_ns_failure ns_build.log
              exit 1
            fi
          fi
          echo "error_message=success" >> "$GITHUB_OUTPUT"

      - name: Sign APK with keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          [ -z "$APK_SIGNER" ] && APK_SIGNER=$(find /usr -name "apksigner" -type f 2>/dev/null | head -1)
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ -n "$APK_SIGNER" ] && [ -n "$KEYSTORE_FILE" ]; then
            for apk in $(find $GITHUB_WORKSPACE/src/ -name "*.apk" -not -path "*/output/*"); do
              $APK_SIGNER sign --ks "$KEYSTORE_FILE" --ks-pass pass:"${{ github.event.inputs.keystore_password }}" --key-pass pass:"${{ github.event.inputs.keystore_password }}" --ks-key-alias "${{ github.event.inputs.keystore_alias }}" "$apk"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-other-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 10: BUILD WINDOWS - Flutter (inchange)
  # ============================================================
  build-windows-flutter:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && needs.prepare.outputs.detected_type == 'flutter' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ github.workspace }}/src/**/.dart_tool
            ${{ github.workspace }}/src/**/pubspec.lock
          key: flutter-deps-win-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-deps-win-

      - name: Build Flutter for Windows
        shell: bash
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "pubspec.yaml" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"

          flutter config --enable-windows-desktop

          if [ ! -d "windows" ]; then
            echo "windows/ manquant - regeneration avec backup..."
            mkdir -p /tmp/flutter_backup_win
            [ -f "pubspec.yaml" ] && cp pubspec.yaml /tmp/flutter_backup_win/
            [ -d "lib" ] && cp -r lib /tmp/flutter_backup_win/

            flutter create --platforms=windows --overwrite .

            [ -f "/tmp/flutter_backup_win/pubspec.yaml" ] && cp /tmp/flutter_backup_win/pubspec.yaml pubspec.yaml
            [ -d "/tmp/flutter_backup_win/lib" ] && cp -r /tmp/flutter_backup_win/lib/* lib/ 2>/dev/null || true
          fi

          flutter pub get
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            flutter build windows --release
          else
            flutter build windows --debug
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.exe" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-flutter-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 11: BUILD WINDOWS - .NET MAUI (inchange)
  # ============================================================
  build-windows-dotnet:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && contains(fromJson('["dotnet-maui","maui","csharp"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache .NET packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-win-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-win-

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build .NET MAUI for Windows
        shell: bash
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "*.csproj" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"

          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "ERREUR: Aucun fichier .csproj trouve"
            exit 1
          fi

          CONFIG="Debug"
          [ "${{ github.event.inputs.build_type }}" == "release" ] && CONFIG="Release"
          dotnet publish "$CSPROJ" -f net8.0-windows10.0.19041.0 -c "$CONFIG" -p:WindowsPackageType=None -p:SelfContained=true -r win-x64

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.exe" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-dotnet-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 12: BUILD WINDOWS - Python — PyInstaller par defaut (tolerant,
  # juste besoin d'un .py), Briefcase seulement si config Windows
  # Briefcase deliberement etoffee.
  # ============================================================
  build-windows-python:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && needs.prepare.outputs.detected_type == 'python' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-win-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            pip-win-

      - name: Decide PyInstaller vs Briefcase
        id: decide
        shell: bash
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . \( -name "setup.py" -o -name "pyproject.toml" -o -name "main.py" -o -name "app.py" \) -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT=$(find . -name "*.py" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"
          echo "PYTHON_PROJECT_ROOT=$PWD" >> "$GITHUB_ENV"

          TOOL="pyinstaller"
          if [ -f "pyproject.toml" ] && grep -q "\[tool.briefcase\]" pyproject.toml 2>/dev/null; then
            APP_SECTIONS=$(grep -c "^\[tool\.briefcase\.app\." pyproject.toml 2>/dev/null || echo 0)
            REQUIRES_COUNT=$(awk '/^\[tool\.briefcase/{inside=1} /^\[/{if(!/tool\.briefcase/) inside=0} inside && /requires\s*=/{print}' pyproject.toml 2>/dev/null | grep -o '"[^"]*"' | wc -l)
            if [ "$APP_SECTIONS" -gt 1 ] || [ "$REQUIRES_COUNT" -gt 3 ]; then
              TOOL="briefcase"
              echo "Config [tool.briefcase] etoffee detectee -> Briefcase"
            fi
          fi

          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"
          echo "=== OUTIL CHOISI (Windows): $TOOL ==="

      # ============================================================
      # PYINSTALLER — chemin par defaut, aucune structure requise.
      # ============================================================
      - name: Build with PyInstaller
        id: build-pyinstaller
        if: ${{ steps.decide.outputs.tool == 'pyinstaller' }}
        shell: bash
        run: |
          set -eu
          cd "$PYTHON_PROJECT_ROOT"

          if [ -f "requirements.txt" ]; then
            python -m pip install -r requirements.txt
          fi

          ENTRY=""
          for candidate in main.py app.py; do
            [ -f "$candidate" ] && ENTRY="$candidate" && break
          done
          if [ -z "$ENTRY" ]; then
            ENTRY=$(find . -maxdepth 2 -name "*.py" -type f | head -1)
          fi
          if [ -z "$ENTRY" ]; then
            echo "Aucun fichier .py trouve - creation d'un main.py minimal..."
            cat > main.py << 'EOF'
          def main():
              print("Hello from Python!")
          if __name__ == "__main__":
              main()
          EOF
            ENTRY="main.py"
          fi

          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller

          APP_NAME_SAFE=$(echo "${{ github.event.inputs.app_name }}" | tr -cd '[:alnum:]_-')
          [ -z "$APP_NAME_SAFE" ] && APP_NAME_SAFE="app"

          set +e
          pyinstaller --onefile --windowed --name "$APP_NAME_SAFE" "$ENTRY" 2>&1 | tee /tmp/pyinstaller.log
          PYI_EXIT=$?
          set -e

          if [ "$PYI_EXIT" -ne 0 ] || [ ! -f "dist/${APP_NAME_SAFE}.exe" ]; then
            ERROR_MSG=$(tail -40 /tmp/pyinstaller.log | tr '\n' ' ' | tr -d '\r')
            echo "error_message=PyInstaller build failed: $ERROR_MSG" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "error_message=success" >> "$GITHUB_OUTPUT"

      # ============================================================
      # BRIEFCASE — seulement pour config Windows deliberement etoffee.
      # ============================================================
      - name: Build with Briefcase for Windows
        id: build-briefcase
        if: ${{ steps.decide.outputs.tool == 'briefcase' }}
        shell: bash
        run: |
          set -eu
          cd "$PYTHON_PROJECT_ROOT"

          sed -i -E 's/^([[:space:]]*license[[:space:]]*=[[:space:]]*)"testapp"[[:space:]]*$/\1"LicenseRef-Proprietary"/' pyproject.toml
          if ! awk '/^\[project\]$/{inside=1; next} /^\[/{inside=0} inside && /^[[:space:]]*license[[:space:]]*=/{found=1} END{exit !found}' pyproject.toml; then
            sed -i '/^\[project\]$/a license = "LicenseRef-Proprietary"' pyproject.toml
          fi
          if ! awk '/^\[tool\.briefcase\]$/{inside=1; next} /^\[/{inside=0} inside && /^[[:space:]]*license[[:space:]]*=/{found=1} END{exit !found}' pyproject.toml; then
            sed -i '/^\[tool\.briefcase\]$/a license = "LicenseRef-Proprietary"' pyproject.toml
          fi

          python -m pip install --upgrade pip
          python -m pip install --upgrade briefcase
          briefcase create windows app
          briefcase build windows app
          briefcase package windows app -p app

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.exe" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find "$PYTHON_PROJECT_ROOT/dist" -maxdepth 1 -name "*.exe" -exec cp {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-python-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 13: BUILD WINDOWS - Go (inchange)
  # ============================================================
  build-windows-go:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && needs.prepare.outputs.detected_type == 'go' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Cross-compile for Windows
        run: |
          set -eu
          cd src/
          PROJECT_ROOT=$(find . -name "go.mod" -type f -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"

          GO_FILES=$(find . -name "*.go" -type f | head -1)
          if [ -z "$GO_FILES" ]; then
            mkdir -p cmd/app
            cat > cmd/app/main.go << 'EOF'
          package main
          import "fmt"
          func main() { fmt.Println("Hello from Go!") }
          EOF
          fi

          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o app.exe .

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "app.exe" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-go-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 14: POST-BUILD — remonte le message d'erreur precis, et les
  # corrections automatiques appliquees (fixes_applied), au callback
  # client sous la cle "warnings", meme en cas de succes.
  # ============================================================
  post-build:
    needs: [prepare, build-web, build-capacitor, build-react-native, build-kotlin-java, build-flutter, build-python, build-dotnet, build-other, build-windows-flutter, build-windows-dotnet, build-windows-python, build-windows-go]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.upload.outputs.status }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: build-*-${{ github.event.inputs.build_id }}
          merge-multiple: true
          continue-on-error: true

      - name: Download keystore artifact
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: keystore/
          continue-on-error: true

      - name: List artifacts
        run: |
          echo "=== Artifacts downloaded ==="
          find artifacts/ -type f 2>/dev/null || echo "No artifacts found"

      - name: Upload APK to R2
        id: upload-apk
        run: |
          set -eu
          APK_FILE=$(find artifacts/ -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            curl -sf -X POST -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$APK_FILE" "${{ github.event.inputs.build_base_url }}/upload/apk" || echo "APK upload failed"
            echo "apk_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to R2
        id: upload-aab
        run: |
          set -eu
          AAB_FILE=$(find artifacts/ -name "*.aab" -type f | head -1)
          if [ -n "$AAB_FILE" ]; then
            curl -sf -X POST -H "Content-Type: application/octet-stream" --data-binary @"$AAB_FILE" "${{ github.event.inputs.build_base_url }}/upload/aab" || echo "AAB upload failed"
            echo "aab_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "aab_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload EXE to R2
        id: upload-exe
        if: ${{ github.event.inputs.platform == 'windows' }}
        run: |
          set -eu
          EXE_FILE=$(find artifacts/ -name "*.exe" -type f | head -1)
          if [ -n "$EXE_FILE" ]; then
            curl -sf -X POST -H "Content-Type: application/octet-stream" --data-binary @"$EXE_FILE" "${{ github.event.inputs.build_base_url }}/upload/exe" || echo "EXE upload failed"
            echo "exe_uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "exe_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine build status and collect error messages
        id: build-status
        run: |
          FIXES_MSG=""
          KOTLIN_FIXES="${{ needs.build-kotlin-java.outputs.fixes_applied }}"
          [ -n "$KOTLIN_FIXES" ] && FIXES_MSG="${FIXES_MSG}${KOTLIN_FIXES}"
          {
            echo "fixes_applied<<FIXES_EOF"
            echo "$FIXES_MSG"
            echo "FIXES_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "${{ steps.upload-apk.outputs.apk_uploaded }}" == "true" ] || [ "${{ steps.upload-aab.outputs.aab_uploaded }}" == "true" ] || [ "${{ steps.upload-exe.outputs.exe_uploaded }}" == "true" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "message=Build successful" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=error" >> "$GITHUB_OUTPUT"

          ERROR_MSG=""

          if [ "${{ needs.build-web.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}Web/Cordova build failed. "
          fi
          if [ "${{ needs.build-capacitor.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}Capacitor build failed. "
          fi
          if [ "${{ needs.build-react-native.result }}" == "failure" ]; then
            RN_ERROR="${{ needs.build-react-native.outputs.error_message }}"
            if [ -n "$RN_ERROR" ] && [ "$RN_ERROR" != "success" ]; then
              ERROR_MSG="${ERROR_MSG}React Native build failed: ${RN_ERROR} "
            else
              ERROR_MSG="${ERROR_MSG}React Native build failed. "
            fi
          fi
          if [ "${{ needs.build-kotlin-java.result }}" == "failure" ]; then
            KOTLIN_ERROR="${{ needs.build-kotlin-java.outputs.error_message }}"
            if [ -n "$KOTLIN_ERROR" ] && [ "$KOTLIN_ERROR" != "success" ]; then
              ERROR_MSG="${ERROR_MSG}Kotlin/Java build failed: ${KOTLIN_ERROR} "
            else
              ERROR_MSG="${ERROR_MSG}Kotlin/Java build failed. "
            fi
          fi
          if [ "${{ needs.build-flutter.result }}" == "failure" ]; then
            FLUTTER_ERROR="${{ needs.build-flutter.outputs.error_message }}"
            if [ -n "$FLUTTER_ERROR" ] && [ "$FLUTTER_ERROR" != "success" ]; then
              ERROR_MSG="${ERROR_MSG}Flutter build failed: ${FLUTTER_ERROR} "
            else
              ERROR_MSG="${ERROR_MSG}Flutter build failed. "
            fi
          fi
          if [ "${{ needs.build-python.result }}" == "failure" ]; then
            PYTHON_ERROR="${{ needs.build-python.outputs.error_message }}"
            if [ -n "$PYTHON_ERROR" ] && [ "$PYTHON_ERROR" != "success" ]; then
              ERROR_MSG="${ERROR_MSG}Python build failed: ${PYTHON_ERROR} "
            else
              ERROR_MSG="${ERROR_MSG}Python build failed. "
            fi
          fi
          if [ "${{ needs.build-dotnet.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}.NET MAUI build failed. "
          fi
          if [ "${{ needs.build-other.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}Go/Other build failed. "
            OTHER_ERROR="${{ needs.build-other.outputs.error_message }}"
            if [ -n "$OTHER_ERROR" ] && [ "$OTHER_ERROR" != "success" ]; then
              ERROR_MSG="${ERROR_MSG}(${OTHER_ERROR}) "
            fi
          fi
          if [ "${{ needs.build-windows-python.result }}" == "failure" ]; then
            ERROR_MSG="${ERROR_MSG}Windows Python build failed. "
          fi

          if [ -z "$ERROR_MSG" ]; then
            ERROR_MSG="Build failed: No artifacts produced. Check logs."
          fi

          echo "message=$ERROR_MSG" >> "$GITHUB_OUTPUT"

      - name: Notify callback URL
        if: ${{ needs.prepare.outputs.build_should_run != 'false' }}
        id: upload
        run: |
          set -eu
          FIXES_JSON=$(printf '%s' "${{ steps.build-status.outputs.fixes_applied }}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          JSON_PAYLOAD=$(jq -n \
              --arg build_id "${{ github.event.inputs.build_id }}" \
              --arg state "${{ steps.build-status.outputs.status }}" \
              --arg message "${{ steps.build-status.outputs.message }}" \
              --arg detected_type "${{ needs.prepare.outputs.detected_type }}" \
              --argjson warnings "$FIXES_JSON" \
              '{
                build_id: $build_id,
                state: $state,
                message: $message,
                detected_type: $detected_type,
                warnings: $warnings
              }')

          echo "Sending notification:"
          echo "$JSON_PAYLOAD"

          curl -sf -X POST -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "${{ github.event.inputs.callback_url }}" || echo "Callback notification failed"

          echo "status=${{ steps.build-status.outputs.status }}" >> "$GITHUB_OUTPUT"
