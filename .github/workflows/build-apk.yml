name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL du zip source'
        required: true
        type: string
      app_name:
        description: 'Nom de l application'
        required: true
        type: string
      package_id:
        description: 'Package ID'
        required: false
        type: string
      build_id:
        description: 'ID du build'
        required: true
        type: string
      build_type:
        description: 'Type de build'
        required: true
        type: string
      output_format:
        description: 'Format de sortie (apk, aab, both)'
        required: false
        type: string
        default: 'apk'
      project_type:
        description: 'Type de projet'
        required: false
        type: string
        default: 'web'
      platform:
        description: 'Plateforme cible (android, windows)'
        required: false
        type: string
        default: 'android'
      keystore_mode:
        description: 'Mode keystore'
        required: true
        type: string
      keystore_url:
        description: 'URL du keystore'
        required: false
        type: string
      keystore_password:
        description: 'Mot de passe du keystore'
        required: false
        type: string
      keystore_alias:
        description: 'Alias du keystore'
        required: false
        type: string
      callback_url:
        description: 'URL de callback (notification finale, avec /callback)'
        required: true
        type: string
      build_base_url:
        description: 'URL de base du build sur le Worker (sans /callback), utilisee pour les uploads /upload/apk|aab|keystore'
        required: false
        type: string

jobs:
  # ============================================================
  # JOB 1: PREPARE — Download source & setup common tools
  # ============================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_dir: ${{ steps.detect.outputs.source_dir }}
      src_path: ${{ steps.detect.outputs.src_path }}
      has_keystore: ${{ steps.keystore.outputs.has_keystore || steps.keystore-download.outputs.has_keystore }}
      keystore_path: ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
      keystore_filename: ${{ steps.keystore.outputs.keystore_filename || steps.keystore-download.outputs.keystore_filename }}
    steps:
      - name: Download source zip
        run: |
          set -e
          curl -f -L -o source.zip "${{ github.event.inputs.zip_url }}"
          echo "=== Taille du fichier telecharge ==="
          ls -la source.zip
          file source.zip
          SIZE=$(stat -c%s source.zip 2>/dev/null || stat -f%z source.zip)
          if [ "$SIZE" -lt 100 ]; then
            echo "ERREUR: le fichier source.zip est suspicieusement petit ($SIZE octets)."
            echo "Contenu recu :"
            cat source.zip
            exit 1
          fi
          mkdir -p src
          unzip -o source.zip -d src/

      - name: Detect source directory
        id: detect
        run: |
          cd src
          ITEM_COUNT=$(ls -1 | wc -l)
          FIRST_ITEM=$(ls -1 | head -1)
          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            echo "source_dir=$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "src_path=src/$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "Single folder detected: $FIRST_ITEM"
          else
            echo "source_dir=." >> "$GITHUB_OUTPUT"
            echo "src_path=src" >> "$GITHUB_OUTPUT"
            echo "Files directly in src/"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        id: keystore
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          KEYSTORE_NAME="my-release-key-${{ github.event.inputs.build_id }}.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_NAME" \
            -alias "${{ github.event.inputs.keystore_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 10950 \
            -storetype PKCS12 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=${{ github.event.inputs.app_name }}, O=${{ github.event.inputs.app_name }} Developer, C=CI"

          cat > keystore-info.txt << EOF
          Keystore genere pour le build ${{ github.event.inputs.build_id }}
          Alias: ${{ github.event.inputs.keystore_alias }}
          Password: ${{ github.event.inputs.keystore_password }}
          EOF

          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_filename=$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download user keystore
        id: keystore-download
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'upload' && github.event.inputs.keystore_url != '' }}
        run: |
          set -e
          KEYSTORE_NAME="my-release-key-${{ github.event.inputs.build_id }}.keystore"
          curl -L -o "$KEYSTORE_NAME" "${{ github.event.inputs.keystore_url }}"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_filename=$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/
          retention-days: 1

      - name: Upload keystore artifact
        if: ${{ steps.keystore.outputs.has_keystore == 'true' || steps.keystore-download.outputs.has_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: |
            ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
            keystore-info.txt
          retention-days: 7

  # ============================================================
  # JOB 2: BUILD WEB (Cordova) — Projets web purs
  # FIX: Ne depend plus de build-capacitor, uniquement de prepare
  # ============================================================
  build-web:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["web","react","vue"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build web project
        run: |
          set -e
          cd src/

          # Trouver le projet
          PROJECT_ROOT=$(find . -name "package.json" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -not -path "*/dist/*" \
            -exec dirname {} \; | head -1)

          IS_STATIC=false
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Projet statique (pas de package.json)"
            IS_STATIC=true
            PROJECT_ROOT="${{ needs.prepare.outputs.source_dir }}"
          else
            echo "Projet trouve dans : $PROJECT_ROOT"
            cd "$PROJECT_ROOT"

            if [ -f "package.json" ]; then
              echo "=== Installation des dependances ==="
              npm install

              if grep -q '"build"' package.json; then
                echo "=== Build du projet ==="
                npm run build
              fi
            fi
          fi

          # Build Cordova
          PKG_ID="${{ github.event.inputs.package_id }}"
          [ -z "$PKG_ID" ] && PKG_ID="com.philtech.app"

          CORDOVA_DIR="cordova-project-${{ github.event.inputs.build_id }}"
          cordova create "$CORDOVA_DIR" "$PKG_ID" "${{ github.event.inputs.app_name }}"
          rm -rf "$CORDOVA_DIR"/www/*

          # Determiner la source a copier
          if [ "$IS_STATIC" = true ]; then
            COPY_FROM="$PROJECT_ROOT"
          else
            if [ -d "$PROJECT_ROOT/dist" ]; then
              COPY_FROM="$PROJECT_ROOT/dist"
            elif [ -d "$PROJECT_ROOT/build" ]; then
              COPY_FROM="$PROJECT_ROOT/build"
            else
              COPY_FROM="$PROJECT_ROOT"
            fi
          fi

          # FIX CRITIQUE: Supprimer node_modules avant copie
          echo "=== Nettoyage node_modules ==="
          rm -rf "$COPY_FROM"/node_modules
          rm -rf "$COPY_FROM"/.git

          echo "=== Copie vers Cordova www/ ==="
          cp -r "$COPY_FROM"/* "$CORDOVA_DIR"/www/ 2>/dev/null || true

          # FIX: Creer config.xml avec preferences Android
          cat > "$CORDOVA_DIR"/config.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <widget xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <preference name="android-minSdkVersion" value="24" />
            <preference name="android-targetSdkVersion" value="34" />
            <preference name="AndroidPersistentFileLocation" value="Compatibility" />
          </widget>
          EOF

          cd "$CORDOVA_DIR"
          cordova platform add android

          # FIX: Chercher le keystore dynamiquement
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
          FORMAT="${{ github.event.inputs.output_format }}"

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            echo "=== Build RELEASE ==="
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- \
                --packageType=apk \
                --keystore="$KEYSTORE_FILE" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- \
                --packageType=bundle \
                --keystore="$KEYSTORE_FILE" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
          else
            echo "=== Build DEBUG ==="
            cordova build android --debug
          fi

          # FIX: Verifier que le build a produit un artefact
          echo "=== Verification des artefacts ==="
          find . -name "*.apk" -o -name "*.aab" | head -5

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true
          ls -la output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 3: BUILD CAPACITOR — Angular, Svelte, SolidJS, Preact, Ionic
  # FIX: Job independant, parallel a build-web
  # ============================================================
  build-capacitor:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["angular","svelte","solidjs","preact","ionic","capacitor"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    outputs:
      is_capacitor: ${{ steps.build.outputs.is_capacitor }}
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Build Capacitor project
        id: build
        run: |
          set -e
          echo "is_capacitor=true" >> "$GITHUB_OUTPUT"

          echo "=== Recherche du projet ==="
          cd src/

          PROJECT_ROOT=$(find . -name "package.json" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -not -path "*/dist/*" \
            -exec dirname {} \; | head -1)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "Pas de package.json trouve"
            echo "is_capacitor=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # Verifier que c'est bien un projet Capacitor
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ] && [ ! -d "android" ]; then
            echo "Pas un projet Capacitor identifiable"
            echo "is_capacitor=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "=== Installation des dependances ==="
          npm install

          # Build du frontend
          if grep -q '"build"' package.json 2>/dev/null; then
            echo "=== Build du frontend ==="
            npm run build
          fi

          # FIX: Ajouter Android AVANT sync
          if [ ! -d "android" ]; then
            echo "=== Ajout de la plateforme Android ==="
            npx cap add android
          fi

          echo "=== Synchronisation Android ==="
          npx cap sync android

          # Build Android
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew

            # FIX: Chercher le keystore dynamiquement
            KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

            if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
              echo "=== Build RELEASE ==="

              # FIX: Creer signing.gradle avec chemin absolu
              mkdir -p app
              cat > app/signing.gradle << GRADLE_EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_FILE")
                storePassword "${{ github.event.inputs.keystore_password }}"
                keyAlias "${{ github.event.inputs.keystore_alias }}"
                keyPassword "${{ github.event.inputs.keystore_password }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF

              # FIX: apply from avec chemin relatif correct depuis app/build.gradle
              if ! grep -q "signing.gradle" app/build.gradle 2>/dev/null; then
                echo "apply from: 'signing.gradle'" >> app/build.gradle
              fi

              ./gradlew assembleRelease
            else
              echo "=== Build DEBUG ==="
              ./gradlew assembleDebug
            fi
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true
          ls -la output/ || echo "Aucun artefact trouve"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 4: BUILD REACT NATIVE
  # ============================================================
  build-react-native:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.project_type == 'react-native' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build React Native
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "package.json" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # Verifier metro.config.js
          if [ ! -f "metro.config.js" ] && [ ! -f "metro.config.ts" ]; then
            echo "ATTENTION: metro.config.js non trouve"
          fi

          npm install
          cd android
          chmod +x gradlew

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            mkdir -p app
            cat > app/signing.gradle << GRADLE_EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_FILE")
                storePassword "${{ github.event.inputs.keystore_password }}"
                keyAlias "${{ github.event.inputs.keystore_alias }}"
                keyPassword "${{ github.event.inputs.keystore_password }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
            if ! grep -q "signing.gradle" app/build.gradle 2>/dev/null; then
              echo "apply from: 'signing.gradle'" >> app/build.gradle
            fi
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 5: BUILD KOTLIN / JAVA
  # ============================================================
  build-kotlin-java:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["kotlin","java","kotlin-multiplatform"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Kotlin/Java
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "build.gradle" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # FIX: chmod AVANT gradlew
          chmod +x gradlew

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            if ! grep -q "signingConfigs" app/build.gradle 2>/dev/null; then
              mkdir -p app
              cat > app/signing.gradle << GRADLE_EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_FILE")
                storePassword "${{ github.event.inputs.keystore_password }}"
                keyAlias "${{ github.event.inputs.keystore_alias }}"
                keyPassword "${{ github.event.inputs.keystore_password }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
              echo "apply from: 'signing.gradle'" >> app/build.gradle
            fi
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 6: BUILD FLUTTER
  # ============================================================
  build-flutter:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && github.event.inputs.project_type == 'flutter' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Verify Flutter
        run: flutter doctor

      - name: Build Flutter
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "pubspec.yaml" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # Verifier pubspec.yaml
          if [ ! -f "pubspec.yaml" ]; then
            echo "ERREUR: pubspec.yaml non trouve"
            exit 1
          fi

          flutter pub get
          FORMAT="${{ github.event.inputs.output_format }}"

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            mkdir -p android
            cat > android/key.properties << EOF
          storePassword=${{ github.event.inputs.keystore_password }}
          keyPassword=${{ github.event.inputs.keystore_password }}
          keyAlias=${{ github.event.inputs.keystore_alias }}
          storeFile=$KEYSTORE_FILE
          EOF
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              flutter build apk --release
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              flutter build appbundle --release
            fi
          else
            flutter build apk --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 7: BUILD PYTHON
  # ============================================================
  build-python:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && github.event.inputs.project_type == 'python' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Python with Briefcase
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "setup.py" -o -name "pyproject.toml" -o -name "app.py" -o -name "main.py" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/__pycache__/*" \
            -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          pip install briefcase
          briefcase create android
          briefcase build android
          briefcase package android -p apk --adhoc-sign

      - name: Sign APK with keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ -n "$APK_SIGNER" ] && [ -n "$KEYSTORE_FILE" ]; then
            for apk in $(find . -name "*.apk"); do
              "$APK_SIGNER" sign \
                --ks "$KEYSTORE_FILE" \
                --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --ks-key-alias "${{ github.event.inputs.keystore_alias }}" \
                "$apk"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 8: BUILD .NET MAUI
  # ============================================================
  build-dotnet:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && contains(fromJson('["dotnet-maui","maui","csharp"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build .NET MAUI
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "*.csproj" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/bin/*" \
            -not -path "*/obj/*" \
            -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "ERREUR: Aucun fichier .csproj trouve"
            exit 1
          fi

          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            dotnet publish "$CSPROJ" -f net8.0-android -c Release
          else
            dotnet build "$CSPROJ" -f net8.0-android -c Debug
          fi

      - name: Sign APK with keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ -n "$APK_SIGNER" ] && [ -n "$KEYSTORE_FILE" ]; then
            for apk in $(find . -name "*.apk"); do
              "$APK_SIGNER" sign \
                --ks "$KEYSTORE_FILE" \
                --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --ks-key-alias "${{ github.event.inputs.keystore_alias }}" \
                "$apk"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 9: BUILD OTHER (Go, Godot, Lua, NativeScript)
  # FIX: Ruby retire car RubyMotion necessite une licence
  # ============================================================
  build-other:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["go","godot","lua","nativescript"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Go
        if: ${{ github.event.inputs.project_type == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Godot
        if: ${{ github.event.inputs.project_type == 'godot' }}
        run: |
          set -e
          GODOT_VERSION="4.2.2"
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Setup Lua/Solar2D
        if: ${{ github.event.inputs.project_type == 'lua' }}
        run: |
          set -e
          wget -q https://github.com/coronalabs/corona/releases/download/3700/Solar2DConsole.tgz
          tar -xzf Solar2DConsole.tgz
          sudo mv Solar2DConsole /opt/solar2d
          echo "/opt/solar2d" >> $GITHUB_PATH

      - name: Setup Node for NativeScript
        if: ${{ github.event.inputs.project_type == 'nativescript' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install NativeScript CLI
        if: ${{ github.event.inputs.project_type == 'nativescript' }}
        run: npm install -g nativescript

      - name: Install gomobile
        if: ${{ github.event.inputs.project_type == 'go' }}
        run: |
          set -e
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          # FIX: Installer NDK avant gomobile init
          sdkmanager "ndk;25.2.9519653" 2>/dev/null || true
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          gomobile init

      - name: Build project
        run: |
          set -e
          cd src/

          case "${{ github.event.inputs.project_type }}" in
            go)
              PROJECT_ROOT=$(find . -name "go.mod" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              gomobile build -target=android -o app.apk .
              ;;
            godot)
              PROJECT_ROOT=$(find . -name "project.godot" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              # Verifier export_presets.cfg
              if [ ! -f "export_presets.cfg" ]; then
                echo "ATTENTION: export_presets.cfg non trouve, creation d'un preset par defaut"
                cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          android_architectures/arm64-v8a=true
          EOF
              fi
              godot --headless --export-release "Android" build.apk
              ;;
            lua)
              PROJECT_ROOT=$(find . -name "build.settings" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              /opt/solar2d/solar2d.sh build android
              ;;
            nativescript)
              PROJECT_ROOT=$(find . -name "package.json" -type f -exec dirname {} \; | head -1)
              [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
              cd "$PROJECT_ROOT"
              npm install
              # FIX: Verifier si android existe deja
              [ -d "android" ] || ns platform add android

              KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

              if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
                ns build android --release --key-store-path "$KEYSTORE_FILE" --key-store-password "${{ github.event.inputs.keystore_password }}" --key-store-alias "${{ github.event.inputs.keystore_alias }}" --key-store-alias-password "${{ github.event.inputs.keystore_password }}"
              else
                ns build android --debug
              fi
              ;;
          esac

      - name: Sign APK with keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          [ -z "$APK_SIGNER" ] && APK_SIGNER=$(find /usr -name "apksigner" -type f 2>/dev/null | head -1)
          [ -z "$APK_SIGNER" ] && APK_SIGNER=$(find /opt -name "apksigner" -type f 2>/dev/null | head -1)
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)

          if [ -n "$APK_SIGNER" ] && [ -n "$KEYSTORE_FILE" ]; then
            for apk in $(find . -name "*.apk" -not -path "./output/*"); do
              $APK_SIGNER sign \
                --ks "$KEYSTORE_FILE" \
                --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --ks-key-alias "${{ github.event.inputs.keystore_alias }}" \
                "$apk"
            done
          else
            for apk in $(find . -name "*.apk" -not -path "./output/*"); do
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$KEYSTORE_FILE" \
                -storepass "${{ github.event.inputs.keystore_password }}" \
                "$apk" "${{ github.event.inputs.keystore_alias }}"
            done
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 10: BUILD WINDOWS — Flutter
  # ============================================================
  build-windows-flutter:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && github.event.inputs.project_type == 'flutter' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter for Windows
        shell: bash
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "pubspec.yaml" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/build/*" \
            -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          flutter config --enable-windows-desktop
          flutter pub get
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            flutter build windows --release
          else
            flutter build windows --debug
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p output
          EXE=$(find src/build/windows -name "*.exe" | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" output/app.exe
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 11: BUILD WINDOWS — .NET MAUI
  # ============================================================
  build-windows-dotnet:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && contains(fromJson('["dotnet-maui","maui","csharp"]'), github.event.inputs.project_type) }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build .NET MAUI for Windows
        shell: bash
        run: |
          set -e
          cd src/

          PROJECT_ROOT=$(find . -name "*.csproj" -type f \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/bin/*" \
            -not -path "*/obj/*" \
            -exec dirname {} \; | head -1)

          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."

          echo "Projet trouve dans : $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "ERREUR: Aucun fichier .csproj trouve"
            exit 1
          fi

          CONFIG="Debug"
          [ "${{ github.event.inputs.build_type }}" == "release" ] && CONFIG="Release"
          dotnet publish "$CSPROJ" -f net8.0-windows10.0.19041.0 -c "$CONFIG" -p:WindowsPackageType=None -p:SelfContained=true -r win-x64

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p output
          EXE=$(find src -path "*win-x64*" -name "*.exe" | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" output/app.exe
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 12: BUILD WINDOWS — Python
  # ============================================================
  build-windows-python:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && github.event.inputs.project_type == 'python' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build with Briefcase for Windows
        shell: bash
        run: |
