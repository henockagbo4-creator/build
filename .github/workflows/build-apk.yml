              [ -n "$APK" ] || APK=$(find build/app/outputs -iname "*.apk" | head -n 1)
              [ -n "$APK" ] && upload_artifact "$APK" "apk" || fail "Aucun APK produit"
              if [ "$OUTPUT_FORMAT" = "both" ]; then
                flutter build appbundle --release 2>&1 | tail -n 150 || echo "⚠️  AAB non fourni"
                AAB=$(find build/app/outputs -iname "*.aab" | head -n 1)
                [ -n "$AAB" ] && upload_artifact "$AAB" "aab"
              fi
            fi
          else
            flutter build apk --debug 2>&1 | tail -n 150 || fail "flutter build apk (debug) a échoué"
            APK=$(find build/app/outputs -iname "*debug*.apk" | head -n 1)
            [ -n "$APK" ] || APK=$(find build/app/outputs -iname "*.apk" | head -n 1)
            [ -n "$APK" ] && upload_artifact "$APK" "apk" || fail "Aucun APK produit"
          fi

          callback "success" "Build terminé avec succès"
      - name: Callback en cas d'echec inattendu
        if: failure()
        shell: bash
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Echec inattendu du job build-flutter (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 5) .NET MAUI / C# — Android (apk) + Windows (exe)
  # ===========================================================
  build-dotnet:
    if: contains(fromJSON('["dotnet-maui","maui","csharp"]'), inputs.project_type)
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-java@v4
        if: inputs.platform != 'windows'
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
        if: inputs.platform != 'windows'
      - name: Build
        shell: bash
        run: |
          # ============================================================
          # lib.sh — fonctions partagées par tous les builders PhilBuilder
          # À sourcer en début de chaque script : `source scripts/lib.sh`
          # ============================================================
          set -uo pipefail
          # NB: pas de `set -e` global ici — chaque builder gère ses propres
          # erreurs et appelle `fail "message"` explicitement, pour pouvoir
          # toujours prévenir le callback avant de mourir.

          WORKDIR="${WORKDIR:-$PWD/work}"
          SRC_DIR="$WORKDIR/src"
          OUT_DIR="$WORKDIR/out"
          mkdir -p "$SRC_DIR" "$OUT_DIR"

          # ------------------------------------------------------------
          # Callback vers le worker (état + message)
          # ------------------------------------------------------------
          callback() {
            local state="$1"
            local message="$2"
            echo "➡️  [callback] $state — $message"
            curl -sS -m 15 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$(python3 - "$state" "$message" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "message": sys.argv[2]}))
          PY
          )" >/dev/null 2>&1 || echo "⚠️  callback injoignable (on continue quand même)"
          }

          # En cas d'échec définitif : prévient le worker puis stoppe le job
          fail() {
            local message="$1"
            echo "❌ ERREUR: $message"
            callback "error" "$message"
            exit 1
          }

          # ------------------------------------------------------------
          # Upload d'un artefact final vers R2 via le worker
          # type ∈ apk | aab | exe | keystore
          # ------------------------------------------------------------
          upload_artifact() {
            local file="$1"
            local type="$2"
            if [ ! -f "$file" ]; then
              echo "⚠️  upload_artifact: fichier introuvable ($file), ignoré"
              return 1
            fi
            echo "⬆️  Upload $type : $file ($(du -h "$file" | cut -f1))"
            local status
            status=$(curl -sS -m 300 -o /dev/null -w "%{http_code}" \
              -X POST "$BUILD_BASE_URL/upload/$type" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file")
            if [ "$status" != "200" ]; then
              echo "⚠️  upload $type a répondu HTTP $status"
              return 1
            fi
            return 0
          }

          # ------------------------------------------------------------
          # Téléchargement + extraction permissive du zip source
          # Ne suppose RIEN sur la structure : si tout est niché dans un
          # seul sous-dossier (cas fréquent des zips "glisser-déposer"),
          # on remonte automatiquement d'un niveau.
          # ------------------------------------------------------------
          download_source() {
            callback "building" "Téléchargement du projet..."
            curl -sSL -m 120 -o "$WORKDIR/source.zip" "$ZIP_URL" \
              || fail "Impossible de télécharger le zip source (zip_url injoignable)"

            [ -s "$WORKDIR/source.zip" ] || fail "Le zip source est vide ou introuvable"

            unzip -q -o "$WORKDIR/source.zip" -d "$SRC_DIR" \
              || fail "Archive .zip corrompue ou invalide"

            # Aplatir un unique sous-dossier racine (cas "MonProjet/MonProjet/src...")
            local entries
            entries=$(find "$SRC_DIR" -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$entries" -eq 1 ] && [ -d "$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)" ]; then
              local inner
              inner="$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)"
              echo "📂 Sous-dossier unique détecté ($inner) — aplatissement"
              shopt -s dotglob
              mv "$inner"/* "$SRC_DIR"/ 2>/dev/null || true
              shopt -u dotglob
              rmdir "$inner" 2>/dev/null || true
            fi

            echo "📁 Contenu du projet après extraction :"
            find "$SRC_DIR" -maxdepth 2 | sed "s|$SRC_DIR|.|"
            callback "building" "Projet extrait, analyse de la structure..."
          }

          # Cherche un fichier par motif n'importe où dans SRC_DIR (permissif,
          # insensible à l'emplacement exact demandé par le langage)
          find_any() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | head -n 1
          }

          find_dir_containing() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | xargs -r -n1 dirname | head -n 1
          }

          # ------------------------------------------------------------
          # Icône : téléchargement (utilisée par chaque builder pour
          # remplacer les icônes par défaut du framework généré)
          # ------------------------------------------------------------
          download_icon_if_any() {
            ICON_LOCAL=""
            if [ -n "${ICON_URL:-}" ]; then
              ICON_LOCAL="$WORKDIR/icon.png"
              if curl -sSL -m 30 -o "$ICON_LOCAL" "$ICON_URL"; then
                echo "🎨 Icône téléchargée : $ICON_LOCAL"
              else
                echo "⚠️  Icône fournie mais injoignable, utilisation de l'icône par défaut"
                ICON_LOCAL=""
              fi
            fi
            export ICON_LOCAL
          }

          # ------------------------------------------------------------
          # Keystore Android : génère une clé si demandé, ou télécharge
          # celle fournie par l'utilisateur.
          # Résultat : $KEYSTORE_PATH prêt à l'emploi pour la signature.
          # ------------------------------------------------------------
          prepare_keystore() {
            KEYSTORE_PATH="$WORKDIR/release.keystore"
            if [ "${KEYSTORE_MODE:-generate}" = "upload" ] && [ -n "${KEYSTORE_URL:-}" ]; then
              callback "building" "Récupération de votre clé de signature..."
              curl -sSL -m 30 -o "$KEYSTORE_PATH" "$KEYSTORE_URL" \
                || fail "Impossible de télécharger la clé de signature fournie"
            else
              callback "building" "Génération de la clé de signature..."
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_PATH" \
                -alias "${KEYSTORE_ALIAS:-release}" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -keypass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -dname "CN=${APP_NAME:-App}, OU=PhilBuilder, O=PhilTech, C=CI" \
                || fail "Échec de la génération de la clé de signature"
              upload_artifact "$KEYSTORE_PATH" "keystore" || true
            fi
            export KEYSTORE_PATH
          }

          # ------------------------------------------------------------
          # Renomme/copie le premier fichier trouvé matching $2 vers $1,
          # ne casse rien si absent (mode best-effort)
          # ------------------------------------------------------------
          copy_if_exists() {
            local dst="$1" pattern="$2"
            local src
            src=$(find_any "$pattern")
            if [ -n "$src" ]; then
              cp "$src" "$dst"
              return 0
            fi
            return 1
          }

          echo "✅ lib.sh chargée — WORKDIR=$WORKDIR"

          # ============================================================
          # BUILD LOGIC
          # ============================================================

          download_source
          download_icon_if_any
          cd "$SRC_DIR"

          CSPROJ=$(find_any "*.csproj")
          [ -n "$CSPROJ" ] || fail ".NET MAUI: aucun fichier .csproj trouvé dans le projet"
          PROJ_DIR=$(dirname "$CSPROJ")
          cd "$PROJ_DIR"

          callback "building" "Installation des workloads .NET MAUI..."
          dotnet workload install maui --ignore-failed-sources 2>&1 | tail -n 60 \
            || fail "Installation du workload MAUI échouée"

          if [ -n "${ICON_LOCAL:-}" ]; then
            mkdir -p Resources/AppIcon
            cp "$ICON_LOCAL" Resources/AppIcon/appicon.png 2>/dev/null || true
          fi

          CONFIG="Debug"
          [ "$BUILD_TYPE" = "release" ] && CONFIG="Release"

          if [ "$PLATFORM" = "windows" ]; then
            callback "building" "Compilation .NET MAUI Windows ($CONFIG)..."
            FRAMEWORK=$(grep -o 'net[0-9.]*-windows[0-9.]*' "$(basename "$CSPROJ")" | head -n 1)
            [ -z "$FRAMEWORK" ] && FRAMEWORK="net8.0-windows10.0.19041.0"
            dotnet publish -f "$FRAMEWORK" -c "$CONFIG" -p:WindowsPackageType=None -p:SelfContained=true -r win-x64 \
              2>&1 | tail -n 150 || fail "dotnet publish (Windows) a échoué"
            EXE=$(find bin -iname "*.exe" | grep -vi 'signtool\|makeappx' | head -n 1)
            [ -n "$EXE" ] || fail "Aucun .exe produit"
            upload_artifact "$EXE" "exe" || fail "Échec upload EXE"
            callback "success" "Build terminé avec succès"
            exit 0
          fi

          callback "building" "Compilation .NET MAUI Android ($CONFIG)..."
          if [ "$CONFIG" = "Release" ]; then
            prepare_keystore
            dotnet publish -f net8.0-android -c Release \
              -p:AndroidSigningKeyStore="$KEYSTORE_PATH" \
              -p:AndroidSigningKeyAlias="$KEYSTORE_ALIAS" \
              -p:AndroidSigningKeyPass="$KEYSTORE_PASSWORD" \
              -p:AndroidSigningStorePass="$KEYSTORE_PASSWORD" \
              -p:ApplicationId="$PACKAGE_ID" \
              2>&1 | tail -n 150 || fail "dotnet publish (Android release) a échoué"
            APK=$(find bin -iname "*-Signed.apk" | head -n 1)
            [ -n "$APK" ] || APK=$(find bin -iname "*.apk" | head -n 1)
          else
            dotnet build -f net8.0-android -c Debug -p:ApplicationId="$PACKAGE_ID" \
              2>&1 | tail -n 150 || fail "dotnet build (Android debug) a échoué"
            APK=$(find bin -iname "*.apk" | head -n 1)
          fi
          [ -n "$APK" ] || fail "Aucun APK produit par .NET MAUI"
          upload_artifact "$APK" "apk" || fail "Échec upload APK"

          callback "success" "Build terminé avec succès"
      - name: Callback en cas d'echec inattendu
        if: failure()
        shell: bash
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Echec inattendu du job build-dotnet (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 6) Python — Android (Buildozer, fallback Briefcase) + Windows (PyInstaller)
  # ===========================================================
  build-python:
    if: inputs.project_type == 'python'
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        if: inputs.platform != 'windows'
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
        if: inputs.platform != 'windows'
      - name: Dependances systeme Buildozer (Android uniquement)
        if: inputs.platform != 'windows'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
      - name: Build
        shell: bash
        run: |
          # ============================================================
          # lib.sh — fonctions partagées par tous les builders PhilBuilder
          # À sourcer en début de chaque script : `source scripts/lib.sh`
          # ============================================================
          set -uo pipefail
          # NB: pas de `set -e` global ici — chaque builder gère ses propres
          # erreurs et appelle `fail "message"` explicitement, pour pouvoir
          # toujours prévenir le callback avant de mourir.

          WORKDIR="${WORKDIR:-$PWD/work}"
          SRC_DIR="$WORKDIR/src"
          OUT_DIR="$WORKDIR/out"
          mkdir -p "$SRC_DIR" "$OUT_DIR"

          # ------------------------------------------------------------
          # Callback vers le worker (état + message)
          # ------------------------------------------------------------
          callback() {
            local state="$1"
            local message="$2"
            echo "➡️  [callback] $state — $message"
            curl -sS -m 15 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$(python3 - "$state" "$message" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "message": sys.argv[2]}))
          PY
          )" >/dev/null 2>&1 || echo "⚠️  callback injoignable (on continue quand même)"
          }

          # En cas d'échec définitif : prévient le worker puis stoppe le job
          fail() {
            local message="$1"
            echo "❌ ERREUR: $message"
            callback "error" "$message"
            exit 1
          }

          # ------------------------------------------------------------
          # Upload d'un artefact final vers R2 via le worker
          # type ∈ apk | aab | exe | keystore
          # ------------------------------------------------------------
          upload_artifact() {
            local file="$1"
            local type="$2"
            if [ ! -f "$file" ]; then
              echo "⚠️  upload_artifact: fichier introuvable ($file), ignoré"
              return 1
            fi
            echo "⬆️  Upload $type : $file ($(du -h "$file" | cut -f1))"
            local status
            status=$(curl -sS -m 300 -o /dev/null -w "%{http_code}" \
              -X POST "$BUILD_BASE_URL/upload/$type" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file")
            if [ "$status" != "200" ]; then
              echo "⚠️  upload $type a répondu HTTP $status"
              return 1
            fi
            return 0
          }

          # ------------------------------------------------------------
          # Téléchargement + extraction permissive du zip source
          # Ne suppose RIEN sur la structure : si tout est niché dans un
          # seul sous-dossier (cas fréquent des zips "glisser-déposer"),
          # on remonte automatiquement d'un niveau.
          # ------------------------------------------------------------
          download_source() {
            callback "building" "Téléchargement du projet..."
            curl -sSL -m 120 -o "$WORKDIR/source.zip" "$ZIP_URL" \
              || fail "Impossible de télécharger le zip source (zip_url injoignable)"

            [ -s "$WORKDIR/source.zip" ] || fail "Le zip source est vide ou introuvable"

            unzip -q -o "$WORKDIR/source.zip" -d "$SRC_DIR" \
              || fail "Archive .zip corrompue ou invalide"

            # Aplatir un unique sous-dossier racine (cas "MonProjet/MonProjet/src...")
            local entries
            entries=$(find "$SRC_DIR" -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$entries" -eq 1 ] && [ -d "$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)" ]; then
              local inner
              inner="$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)"
              echo "📂 Sous-dossier unique détecté ($inner) — aplatissement"
              shopt -s dotglob
              mv "$inner"/* "$SRC_DIR"/ 2>/dev/null || true
              shopt -u dotglob
              rmdir "$inner" 2>/dev/null || true
            fi

            echo "📁 Contenu du projet après extraction :"
            find "$SRC_DIR" -maxdepth 2 | sed "s|$SRC_DIR|.|"
            callback "building" "Projet extrait, analyse de la structure..."
          }

          # Cherche un fichier par motif n'importe où dans SRC_DIR (permissif,
          # insensible à l'emplacement exact demandé par le langage)
          find_any() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | head -n 1
          }

          find_dir_containing() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | xargs -r -n1 dirname | head -n 1
          }

          # ------------------------------------------------------------
          # Icône : téléchargement (utilisée par chaque builder pour
          # remplacer les icônes par défaut du framework généré)
          # ------------------------------------------------------------
          download_icon_if_any() {
            ICON_LOCAL=""
            if [ -n "${ICON_URL:-}" ]; then
              ICON_LOCAL="$WORKDIR/icon.png"
              if curl -sSL -m 30 -o "$ICON_LOCAL" "$ICON_URL"; then
                echo "🎨 Icône téléchargée : $ICON_LOCAL"
              else
                echo "⚠️  Icône fournie mais injoignable, utilisation de l'icône par défaut"
                ICON_LOCAL=""
              fi
            fi
            export ICON_LOCAL
          }

          # ------------------------------------------------------------
          # Keystore Android : génère une clé si demandé, ou télécharge
          # celle fournie par l'utilisateur.
          # Résultat : $KEYSTORE_PATH prêt à l'emploi pour la signature.
          # ------------------------------------------------------------
          prepare_keystore() {
            KEYSTORE_PATH="$WORKDIR/release.keystore"
            if [ "${KEYSTORE_MODE:-generate}" = "upload" ] && [ -n "${KEYSTORE_URL:-}" ]; then
              callback "building" "Récupération de votre clé de signature..."
              curl -sSL -m 30 -o "$KEYSTORE_PATH" "$KEYSTORE_URL" \
                || fail "Impossible de télécharger la clé de signature fournie"
            else
              callback "building" "Génération de la clé de signature..."
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_PATH" \
                -alias "${KEYSTORE_ALIAS:-release}" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -keypass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -dname "CN=${APP_NAME:-App}, OU=PhilBuilder, O=PhilTech, C=CI" \
                || fail "Échec de la génération de la clé de signature"
              upload_artifact "$KEYSTORE_PATH" "keystore" || true
            fi
            export KEYSTORE_PATH
          }

          # ------------------------------------------------------------
          # Renomme/copie le premier fichier trouvé matching $2 vers $1,
          # ne casse rien si absent (mode best-effort)
          # ------------------------------------------------------------
          copy_if_exists() {
            local dst="$1" pattern="$2"
            local src
            src=$(find_any "$pattern")
            if [ -n "$src" ]; then
              cp "$src" "$dst"
              return 0
            fi
            return 1
          }

          echo "✅ lib.sh chargée — WORKDIR=$WORKDIR"

          # ============================================================
          # BUILD LOGIC
          # ============================================================

          download_source
          download_icon_if_any
          cd "$SRC_DIR"

          # Trouve le point d'entrée principal, où qu'il soit dans le zip
          MAIN_PY=$(find_any "main.py")
          if [ -z "$MAIN_PY" ]; then
            MAIN_PY=$(find "$SRC_DIR" -iname "*.py" | head -n 1)
          fi
          [ -n "$MAIN_PY" ] || fail "Aucun fichier .py trouvé dans le projet"
          MAIN_DIR=$(dirname "$MAIN_PY")
          cd "$MAIN_DIR"
          [ -f "$(basename "$MAIN_PY")" ] && [ "$(basename "$MAIN_PY")" != "main.py" ] && cp "$(basename "$MAIN_PY")" main.py

          # Une éventuelle config "complexe" (Briefcase) prend le pas si présente
          HAS_BRIEFCASE_CFG=false
          if [ -f "$SRC_DIR/pyproject.toml" ] && grep -q "briefcase" "$SRC_DIR/pyproject.toml" 2>/dev/null; then
            HAS_BRIEFCASE_CFG=true
          fi

          if [ -f "requirements.txt" ]; then
            callback "building" "Installation des dépendances Python..."
            pip install -r requirements.txt 2>&1 | tail -n 60 || echo "⚠️  Certaines dépendances n'ont pas pu être installées"
          fi

          if [ "$PLATFORM" = "windows" ]; then
            callback "building" "Compilation Python → Windows (PyInstaller)..."
            pip install pyinstaller 2>&1 | tail -n 20
            ICON_FLAG=""
            [ -n "${ICON_LOCAL:-}" ] && ICON_FLAG="--icon=$ICON_LOCAL"
            pyinstaller --onefile --noconfirm --name "$(echo "$APP_NAME" | tr ' ' '_')" $ICON_FLAG main.py \
              2>&1 | tail -n 150 || fail "PyInstaller a échoué"
            EXE=$(find dist -iname "*.exe" | head -n 1)
            [ -n "$EXE" ] || fail "Aucun .exe produit par PyInstaller"
            upload_artifact "$EXE" "exe" || fail "Échec upload EXE"
            callback "success" "Build terminé avec succès"
            exit 0
          fi

          # ---- Android ----
          if [ "$HAS_BRIEFCASE_CFG" = true ]; then
            callback "building" "Config Briefcase détectée — build via Briefcase..."
            cd "$SRC_DIR"
            pip install briefcase 2>&1 | tail -n 20
            briefcase create android gradle 2>&1 | tail -n 80 && \
            briefcase build android gradle 2>&1 | tail -n 80 && \
            briefcase package android gradle --packaging-format apk 2>&1 | tail -n 80
            APK=$(find . -iname "*.apk" | head -n 1)
            if [ -n "$APK" ]; then
              upload_artifact "$APK" "apk" || fail "Échec upload APK"
              callback "success" "Build terminé avec succès (Briefcase)"
              exit 0
            fi
            echo "⚠️  Briefcase a échoué — bascule sur Buildozer (fallback permissif)"
          fi

          callback "building" "Compilation Python → Android (Buildozer)..."
          cd "$MAIN_DIR"
          pip install buildozer cython 2>&1 | tail -n 30 || fail "Installation de Buildozer échouée"

          if [ ! -f "buildozer.spec" ]; then
            echo "⚠️  buildozer.spec absent — génération automatique (mode permissif)"
            buildozer init 2>&1 | tail -n 20
            PKG_NAME=$(echo "$PACKAGE_ID" | rev | cut -d. -f1 | rev)
            PKG_DOMAIN=$(echo "$PACKAGE_ID" | sed "s/\.$PKG_NAME$//")
            sed -i "s/^title = .*/title = $APP_NAME/" buildozer.spec
            sed -i "s/^package.name = .*/package.name = $PKG_NAME/" buildozer.spec
            sed -i "s/^package.domain = .*/package.domain = $PKG_DOMAIN/" buildozer.spec
            sed -i "s/^requirements = .*/requirements = python3,kivy/" buildozer.spec
            [ -n "${ICON_LOCAL:-}" ] && sed -i "s|^#icon.filename = .*|icon.filename = $ICON_LOCAL|" buildozer.spec
          fi

          BUILDOZER_TARGET="debug"
          [ "$BUILD_TYPE" = "release" ] && BUILDOZER_TARGET="release"

          if [ "$BUILDOZER_TARGET" = "release" ]; then
            prepare_keystore
            export P4A_RELEASE_KEYSTORE="$KEYSTORE_PATH"
            export P4A_RELEASE_KEYSTORE_PASSWD="$KEYSTORE_PASSWORD"
            export P4A_RELEASE_KEYALIAS="$KEYSTORE_ALIAS"
            export P4A_RELEASE_KEYALIAS_PASSWD="$KEYSTORE_PASSWORD"
          fi

          yes | buildozer -v android "$BUILDOZER_TARGET" 2>&1 | tail -n 200 || fail "Buildozer a échoué"
          APK=$(find bin -iname "*.apk" | head -n 1)
          [ -n "$APK" ] || fail "Aucun APK produit par Buildozer"
          upload_artifact "$APK" "apk" || fail "Échec upload APK"

          callback "success" "Build terminé avec succès"
      - name: Callback en cas d'echec inattendu
        if: failure()
        shell: bash
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Echec inattendu du job build-python (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 7) Go — Android (gomobile) + Windows (cross-compile)
  # ===========================================================
  build-go:
    if: inputs.project_type == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: actions/setup-java@v4
        if: inputs.platform != 'windows'
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
        if: inputs.platform != 'windows'
      - name: NDK (necessaire a gomobile)
        if: inputs.platform != 'windows'
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk-bundle" >> "$GITHUB_ENV"
      - name: Build
        run: |
          # ============================================================
          # lib.sh — fonctions partagées par tous les builders PhilBuilder
          # À sourcer en début de chaque script : `source scripts/lib.sh`
          # ============================================================
          set -uo pipefail
          # NB: pas de `set -e` global ici — chaque builder gère ses propres
          # erreurs et appelle `fail "message"` explicitement, pour pouvoir
          # toujours prévenir le callback avant de mourir.

          WORKDIR="${WORKDIR:-$PWD/work}"
          SRC_DIR="$WORKDIR/src"
          OUT_DIR="$WORKDIR/out"
          mkdir -p "$SRC_DIR" "$OUT_DIR"

          # ------------------------------------------------------------
          # Callback vers le worker (état + message)
          # ------------------------------------------------------------
          callback() {
            local state="$1"
            local message="$2"
            echo "➡️  [callback] $state — $message"
            curl -sS -m 15 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$(python3 - "$state" "$message" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "message": sys.argv[2]}))
          PY
          )" >/dev/null 2>&1 || echo "⚠️  callback injoignable (on continue quand même)"
          }

          # En cas d'échec définitif : prévient le worker puis stoppe le job
          fail() {
            local message="$1"
            echo "❌ ERREUR: $message"
            callback "error" "$message"
            exit 1
          }

          # ------------------------------------------------------------
          # Upload d'un artefact final vers R2 via le worker
          # type ∈ apk | aab | exe | keystore
          # ------------------------------------------------------------
          upload_artifact() {
            local file="$1"
            local type="$2"
            if [ ! -f "$file" ]; then
              echo "⚠️  upload_artifact: fichier introuvable ($file), ignoré"
              return 1
            fi
            echo "⬆️  Upload $type : $file ($(du -h "$file" | cut -f1))"
            local status
            status=$(curl -sS -m 300 -o /dev/null -w "%{http_code}" \
              -X POST "$BUILD_BASE_URL/upload/$type" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file")
            if [ "$status" != "200" ]; then
              echo "⚠️  upload $type a répondu HTTP $status"
              return 1
            fi
            return 0
          }

          # ------------------------------------------------------------
          # Téléchargement + extraction permissive du zip source
          # Ne suppose RIEN sur la structure : si tout est niché dans un
          # seul sous-dossier (cas fréquent des zips "glisser-déposer"),
          # on remonte automatiquement d'un niveau.
          # ------------------------------------------------------------
          download_source() {
            callback "building" "Téléchargement du projet..."
            curl -sSL -m 120 -o "$WORKDIR/source.zip" "$ZIP_URL" \
              || fail "Impossible de télécharger le zip source (zip_url injoignable)"

            [ -s "$WORKDIR/source.zip" ] || fail "Le zip source est vide ou introuvable"

            unzip -q -o "$WORKDIR/source.zip" -d "$SRC_DIR" \
              || fail "Archive .zip corrompue ou invalide"

            # Aplatir un unique sous-dossier racine (cas "MonProjet/MonProjet/src...")
            local entries
            entries=$(find "$SRC_DIR" -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$entries" -eq 1 ] && [ -d "$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)" ]; then
              local inner
              inner="$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)"
              echo "📂 Sous-dossier unique détecté ($inner) — aplatissement"
              shopt -s dotglob
              mv "$inner"/* "$SRC_DIR"/ 2>/dev/null || true
              shopt -u dotglob
              rmdir "$inner" 2>/dev/null || true
            fi

            echo "📁 Contenu du projet après extraction :"
            find "$SRC_DIR" -maxdepth 2 | sed "s|$SRC_DIR|.|"
            callback "building" "Projet extrait, analyse de la structure..."
          }

          # Cherche un fichier par motif n'importe où dans SRC_DIR (permissif,
          # insensible à l'emplacement exact demandé par le langage)
          find_any() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | head -n 1
          }

          find_dir_containing() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | xargs -r -n1 dirname | head -n 1
          }

          # ------------------------------------------------------------
          # Icône : téléchargement (utilisée par chaque builder pour
          # remplacer les icônes par défaut du framework généré)
          # ------------------------------------------------------------
          download_icon_if_any() {
            ICON_LOCAL=""
            if [ -n "${ICON_URL:-}" ]; then
              ICON_LOCAL="$WORKDIR/icon.png"
              if curl -sSL -m 30 -o "$ICON_LOCAL" "$ICON_URL"; then
                echo "🎨 Icône téléchargée : $ICON_LOCAL"
              else
                echo "⚠️  Icône fournie mais injoignable, utilisation de l'icône par défaut"
                ICON_LOCAL=""
              fi
            fi
            export ICON_LOCAL
          }

          # ------------------------------------------------------------
          # Keystore Android : génère une clé si demandé, ou télécharge
          # celle fournie par l'utilisateur.
          # Résultat : $KEYSTORE_PATH prêt à l'emploi pour la signature.
          # ------------------------------------------------------------
          prepare_keystore() {
            KEYSTORE_PATH="$WORKDIR/release.keystore"
            if [ "${KEYSTORE_MODE:-generate}" = "upload" ] && [ -n "${KEYSTORE_URL:-}" ]; then
              callback "building" "Récupération de votre clé de signature..."
              curl -sSL -m 30 -o "$KEYSTORE_PATH" "$KEYSTORE_URL" \
                || fail "Impossible de télécharger la clé de signature fournie"
            else
              callback "building" "Génération de la clé de signature..."
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_PATH" \
                -alias "${KEYSTORE_ALIAS:-release}" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -keypass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -dname "CN=${APP_NAME:-App}, OU=PhilBuilder, O=PhilTech, C=CI" \
                || fail "Échec de la génération de la clé de signature"
              upload_artifact "$KEYSTORE_PATH" "keystore" || true
            fi
            export KEYSTORE_PATH
          }

          # ------------------------------------------------------------
          # Renomme/copie le premier fichier trouvé matching $2 vers $1,
          # ne casse rien si absent (mode best-effort)
          # ------------------------------------------------------------
          copy_if_exists() {
            local dst="$1" pattern="$2"
            local src
            src=$(find_any "$pattern")
            if [ -n "$src" ]; then
              cp "$src" "$dst"
              return 0
            fi
            return 1
          }

          echo "✅ lib.sh chargée — WORKDIR=$WORKDIR"

          # ============================================================
          # BUILD LOGIC
          # ============================================================

          download_source
          download_icon_if_any
          if [ -n "${ICON_LOCAL:-}" ]; then
            echo "ℹ️  Icône fournie mais gomobile ne permet pas d'injecter une icône de launcher facilement — icône par défaut conservée pour ce build Go"
          fi
          cd "$SRC_DIR"

          MAIN_GO=$(find_any "main.go")
          [ -n "$MAIN_GO" ] || fail "Aucun fichier main.go trouvé dans le projet"
          MAIN_DIR=$(dirname "$MAIN_GO")
          cd "$MAIN_DIR"

          [ -f "go.mod" ] || { echo "⚠️  go.mod absent — initialisation automatique"; go mod init "$(echo "$PACKAGE_ID" | tr 'A-Z' 'a-z')" 2>&1 | tail -n 10; }
          go mod tidy 2>&1 | tail -n 30 || echo "⚠️  go mod tidy incomplet, on continue"

          if [ "$PLATFORM" = "windows" ]; then
            callback "building" "Compilation Go → Windows (cross-compile)..."
            GOOS=windows GOARCH=amd64 go build -o "$(echo "$APP_NAME" | tr ' ' '_').exe" . \
              2>&1 | tail -n 100 || fail "go build (windows) a échoué"
            EXE=$(find . -maxdepth 1 -iname "*.exe" | head -n 1)
            [ -n "$EXE" ] || fail "Aucun .exe produit"
            upload_artifact "$EXE" "exe" || fail "Échec upload EXE"
            callback "success" "Build terminé avec succès"
            exit 0
          fi

          callback "building" "Compilation Go → Android (gomobile)..."
          go install golang.org/x/mobile/cmd/gomobile@latest 2>&1 | tail -n 30
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init 2>&1 | tail -n 30 || fail "gomobile init a échoué"

          # gomobile attend un package "app" exposant une lib (pas un main classique) ;
          # en mode permissif, si le projet n'est pas déjà structuré ainsi, on tente
          # quand même un bind générique sur le module courant.
          if [ "$BUILD_TYPE" = "release" ]; then
            gomobile build -target=android -o "app.apk" . 2>&1 | tail -n 150 \
              || fail "gomobile build a échoué (le projet doit exposer un package mobile compatible)"
          else
            gomobile build -target=android -o "app.apk" . 2>&1 | tail -n 150 \
              || fail "gomobile build a échoué (le projet doit exposer un package mobile compatible)"
          fi

          APK=$(find . -maxdepth 1 -iname "*.apk" | head -n 1)
          [ -n "$APK" ] || fail "Aucun APK produit par gomobile"
          upload_artifact "$APK" "apk" || fail "Échec upload APK"

          callback "success" "Build terminé avec succès"
      - name: Callback en cas d'echec inattendu
        if: failure()
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Echec inattendu du job build-go (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 8) Autres — godot, lua (Solar2D), ruby (RubyMotion)
  # ===========================================================
  build-other:
    if: contains(fromJSON('["godot","lua","ruby"]'), inputs.project_type)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          # ============================================================
          # lib.sh — fonctions partagées par tous les builders PhilBuilder
          # À sourcer en début de chaque script : `source scripts/lib.sh`
          # ============================================================
          set -uo pipefail
          # NB: pas de `set -e` global ici — chaque builder gère ses propres
          # erreurs et appelle `fail "message"` explicitement, pour pouvoir
          # toujours prévenir le callback avant de mourir.

          WORKDIR="${WORKDIR:-$PWD/work}"
          SRC_DIR="$WORKDIR/src"
          OUT_DIR="$WORKDIR/out"
          mkdir -p "$SRC_DIR" "$OUT_DIR"

          # ------------------------------------------------------------
          # Callback vers le worker (état + message)
          # ------------------------------------------------------------
          callback() {
            local state="$1"
            local message="$2"
            echo "➡️  [callback] $state — $message"
            curl -sS -m 15 -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$(python3 - "$state" "$message" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "message": sys.argv[2]}))
          PY
          )" >/dev/null 2>&1 || echo "⚠️  callback injoignable (on continue quand même)"
          }

          # En cas d'échec définitif : prévient le worker puis stoppe le job
          fail() {
            local message="$1"
            echo "❌ ERREUR: $message"
            callback "error" "$message"
            exit 1
          }

          # ------------------------------------------------------------
          # Upload d'un artefact final vers R2 via le worker
          # type ∈ apk | aab | exe | keystore
          # ------------------------------------------------------------
          upload_artifact() {
            local file="$1"
            local type="$2"
            if [ ! -f "$file" ]; then
              echo "⚠️  upload_artifact: fichier introuvable ($file), ignoré"
              return 1
            fi
            echo "⬆️  Upload $type : $file ($(du -h "$file" | cut -f1))"
            local status
            status=$(curl -sS -m 300 -o /dev/null -w "%{http_code}" \
              -X POST "$BUILD_BASE_URL/upload/$type" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file")
            if [ "$status" != "200" ]; then
              echo "⚠️  upload $type a répondu HTTP $status"
              return 1
            fi
            return 0
          }

          # ------------------------------------------------------------
          # Téléchargement + extraction permissive du zip source
          # Ne suppose RIEN sur la structure : si tout est niché dans un
          # seul sous-dossier (cas fréquent des zips "glisser-déposer"),
          # on remonte automatiquement d'un niveau.
          # ------------------------------------------------------------
          download_source() {
            callback "building" "Téléchargement du projet..."
            curl -sSL -m 120 -o "$WORKDIR/source.zip" "$ZIP_URL" \
              || fail "Impossible de télécharger le zip source (zip_url injoignable)"

            [ -s "$WORKDIR/source.zip" ] || fail "Le zip source est vide ou introuvable"

            unzip -q -o "$WORKDIR/source.zip" -d "$SRC_DIR" \
              || fail "Archive .zip corrompue ou invalide"

            # Aplatir un unique sous-dossier racine (cas "MonProjet/MonProjet/src...")
            local entries
            entries=$(find "$SRC_DIR" -mindepth 1 -maxdepth 1 | wc -l)
            if [ "$entries" -eq 1 ] && [ -d "$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)" ]; then
              local inner
              inner="$(find "$SRC_DIR" -mindepth 1 -maxdepth 1)"
              echo "📂 Sous-dossier unique détecté ($inner) — aplatissement"
              shopt -s dotglob
              mv "$inner"/* "$SRC_DIR"/ 2>/dev/null || true
              shopt -u dotglob
              rmdir "$inner" 2>/dev/null || true
            fi

            echo "📁 Contenu du projet après extraction :"
            find "$SRC_DIR" -maxdepth 2 | sed "s|$SRC_DIR|.|"
            callback "building" "Projet extrait, analyse de la structure..."
          }

          # Cherche un fichier par motif n'importe où dans SRC_DIR (permissif,
          # insensible à l'emplacement exact demandé par le langage)
          find_any() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | head -n 1
          }

          find_dir_containing() {
            local pattern="$1"
            find "$SRC_DIR" -iname "$pattern" 2>/dev/null | xargs -r -n1 dirname | head -n 1
          }

          # ------------------------------------------------------------
          # Icône : téléchargement (utilisée par chaque builder pour
          # remplacer les icônes par défaut du framework généré)
          # ------------------------------------------------------------
          download_icon_if_any() {
            ICON_LOCAL=""
            if [ -n "${ICON_URL:-}" ]; then
              ICON_LOCAL="$WORKDIR/icon.png"
              if curl -sSL -m 30 -o "$ICON_LOCAL" "$ICON_URL"; then
                echo "🎨 Icône téléchargée : $ICON_LOCAL"
              else
                echo "⚠️  Icône fournie mais injoignable, utilisation de l'icône par défaut"
                ICON_LOCAL=""
              fi
            fi
            export ICON_LOCAL
          }

          # ------------------------------------------------------------
          # Keystore Android : génère une clé si demandé, ou télécharge
          # celle fournie par l'utilisateur.
          # Résultat : $KEYSTORE_PATH prêt à l'emploi pour la signature.
          # ------------------------------------------------------------
          prepare_keystore() {
            KEYSTORE_PATH="$WORKDIR/release.keystore"
            if [ "${KEYSTORE_MODE:-generate}" = "upload" ] && [ -n "${KEYSTORE_URL:-}" ]; then
              callback "building" "Récupération de votre clé de signature..."
              curl -sSL -m 30 -o "$KEYSTORE_PATH" "$KEYSTORE_URL" \
                || fail "Impossible de télécharger la clé de signature fournie"
            else
              callback "building" "Génération de la clé de signature..."
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_PATH" \
                -alias "${KEYSTORE_ALIAS:-release}" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -keypass "${KEYSTORE_PASSWORD:-PhilTech2026}" \
                -dname "CN=${APP_NAME:-App}, OU=PhilBuilder, O=PhilTech, C=CI" \
                || fail "Échec de la génération de la clé de signature"
              upload_artifact "$KEYSTORE_PATH" "keystore" || true
            fi
            export KEYSTORE_PATH
          }

          # ------------------------------------------------------------
          # Renomme/copie le premier fichier trouvé matching $2 vers $1,
          # ne casse rien si absent (mode best-effort)
          # ------------------------------------------------------------
          copy_if_exists() {
            local dst="$1" pattern="$2"
            local src
            src=$(find_any "$pattern")
            if [ -n "$src" ]; then
              cp "$src" "$dst"
              return 0
            fi
            return 1
          }

          echo "✅ lib.sh chargée — WORKDIR=$WORKDIR"

          # ============================================================
          # BUILD LOGIC
          # ============================================================

          download_source
          download_icon_if_any
          cd "$SRC_DIR"

          case "$PROJECT_TYPE" in
            godot)
              PROJECT_GODOT=$(find_any "project.godot")
              [ -n "$PROJECT_GODOT" ] || fail "Aucun fichier project.godot trouvé — ce n'est pas un projet Godot valide"
              cd "$(dirname "$PROJECT_GODOT")"
              callback "building" "Téléchargement de Godot + templates d'export..."
              GODOT_VERSION="4.2.1"
              curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
                || fail "Téléchargement de Godot échoué"
              unzip -q godot.zip -d godot_bin
              GODOT_BIN=$(find godot_bin -type f -iname "Godot_*" | head -n 1)
              chmod +x "$GODOT_BIN"
              curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
                || fail "Téléchargement des templates d'export échoué"
              mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
              unzip -q -j templates.tpz -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

              # Icône : Godot lit icon.svg/icon.png à la racine du projet pour l'éditeur,
              # mais l'icône du launcher Android se règle via les options du preset
              # d'export. On copie le fichier fourni et on force les deux si on génère
              # le preset nous-mêmes.
              if [ -n "${ICON_LOCAL:-}" ]; then
                cp "$ICON_LOCAL" icon.png
                echo "🎨 icon.png placée à la racine du projet Godot"
              fi

              callback "building" "Export Android Godot ($BUILD_TYPE)..."
              if ! grep -q "\[preset.0\]" export_presets.cfg 2>/dev/null; then
                echo "⚠️  Aucun preset d'export Android configuré — génération d'un preset minimal"
                ICON_OPTIONS=""
                if [ -n "${ICON_LOCAL:-}" ]; then
                  ICON_OPTIONS='launcher_icons/main_192x192="res://icon.png"
          launcher_icons/adaptive_foreground_432x432="res://icon.png"'
                fi
                cat > export_presets.cfg <<EOF
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_path="app.apk"

          [preset.0.options]
          $ICON_OPTIONS
          EOF
              elif [ -n "${ICON_LOCAL:-}" ]; then
                echo "ℹ️  export_presets.cfg fourni par le projet — icône root copiée mais pas forcée dans le preset existant"
              fi
              OUT_APK="$OUT_DIR/app.apk"
              if [ "$BUILD_TYPE" = "release" ]; then
                prepare_keystore
                "$GODOT_BIN" --headless --export-release "Android" "$OUT_APK" 2>&1 | tail -n 100 || fail "Export Godot release a échoué"
              else
                "$GODOT_BIN" --headless --export-debug "Android" "$OUT_APK" 2>&1 | tail -n 100 || fail "Export Godot debug a échoué"
              fi
              [ -f "$OUT_APK" ] || fail "Aucun APK produit par Godot"
              upload_artifact "$OUT_APK" "apk" || fail "Échec upload APK"
              ;;

            lua)
              callback "building" "Projet Lua/Solar2D — export Android..."
              MAIN_LUA=$(find_any "main.lua")
              [ -n "$MAIN_LUA" ] || fail "Aucun fichier main.lua trouvé"
              cd "$(dirname "$MAIN_LUA")"
              if command -v Solar2DConsole >/dev/null 2>&1; then
                Solar2DConsole -platform android -projectpath "$PWD" -dstdir "$OUT_DIR" 2>&1 | tail -n 100 \
                  || fail "Export Solar2D a échoué"
                OUT_APK=$(find "$OUT_DIR" -iname "*.apk" | head -n 1)
              else
                fail "Solar2D CLI (Solar2DConsole) n'est pas disponible sur ce runner — build Lua impossible pour l'instant"
              fi
              [ -n "$OUT_APK" ] || fail "Aucun APK produit"
              upload_artifact "$OUT_APK" "apk" || fail "Échec upload APK"
              ;;

            ruby)
              callback "building" "Projet Ruby/RubyMotion — build Android..."
              RAKEFILE=$(find_any "Rakefile")
              [ -n "$RAKEFILE" ] || fail "Aucun Rakefile trouvé (projet RubyMotion attendu)"
              cd "$(dirname "$RAKEFILE")"
              if command -v motion >/dev/null 2>&1; then
                motion build --target=android 2>&1 | tail -n 150 || fail "motion build a échoué"
                OUT_APK=$(find . -iname "*.apk" | head -n 1)
              else
                fail "RubyMotion (commande 'motion') n'est pas disponible sur ce runner — build Ruby impossible pour l'instant"
              fi
              [ -n "$OUT_APK" ] || fail "Aucun APK produit"
              upload_artifact "$OUT_APK" "apk" || fail "Échec upload APK"
              ;;

            *)
              fail "Type de projet non reconnu par build-other.sh : $PROJECT_TYPE"
              ;;
          esac

          callback "success" "Build terminé avec succès"
      - name: Callback en cas d'echec inattendu
        if: failure()
        run: |
          curl -sS -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d '{"state":"error","message":"Echec inattendu du job build-other (voir logs GitHub Actions)"}' || true

  # ===========================================================
  # 9) Garde-fou — evite un build bloque en "building" si le
  #    project_type ne correspond a aucun job ci-dessus
  # ===========================================================
  guard-unknown-type:
    if: |
      !contains(fromJSON('["web","react","vue","svelte","angular","solidjs","preact","ionic","capacitor","nativescript","react-native","kotlin","java","kotlin-multiplatform","flutter","dotnet-maui","maui","csharp","python","go","godot","lua","ruby"]'), inputs.project_type)
    runs-on: ubuntu-latest
    steps:
      - name: Prevenir le worker d'un type inconnu
        run: |
          curl -sS -X POST "${{ inputs.callback_url }}" -H "Content-Type: application/json" \
            -d "{\"state\":\"error\",\"message\":\"Type de projet non supporte par le workflow: ${{ inputs.project_type }}\"}" || true
