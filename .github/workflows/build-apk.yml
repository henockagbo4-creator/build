name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL du zip source'
        required: true
        type: string
      app_name:
        description: 'Nom de l application'
        required: true
        type: string
      package_id:
        description: 'Package ID'
        required: false
        type: string
      build_id:
        description: 'ID du build'
        required: true
        type: string
      build_type:
        description: 'Type de build'
        required: true
        type: string
      output_format:
        description: 'Format de sortie (apk, aab, both)'
        required: false
        type: string
        default: 'apk'
      project_type:
        description: 'Type de projet'
        required: false
        type: string
        default: 'web'
      platform:
        description: 'Plateforme cible (android, windows)'
        required: false
        type: string
        default: 'android'
      keystore_mode:
        description: 'Mode keystore'
        required: true
        type: string
      keystore_url:
        description: 'URL du keystore'
        required: false
        type: string
      keystore_password:
        description: 'Mot de passe du keystore'
        required: false
        type: string
      keystore_alias:
        description: 'Alias du keystore'
        required: false
        type: string
      callback_url:
        description: 'URL de callback (notification finale, avec /callback)'
        required: true
        type: string
      build_base_url:
        description: 'URL de base du build sur le Worker (sans /callback), utilisee pour les uploads /upload/apk|aab|keystore'
        required: false
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # ============================================================
  # JOB 1: PREPARE — Download source & setup common tools
  # ============================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_dir: ${{ steps.detect.outputs.source_dir }}
      src_path: ${{ steps.detect.outputs.src_path }}
      has_keystore: ${{ steps.keystore.outputs.has_keystore || steps.keystore-download.outputs.has_keystore }}
      keystore_path: ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
    steps:
      - name: Download source zip
        run: |
          set -e
          curl -L -o source.zip "${{ github.event.inputs.zip_url }}"
          mkdir -p src
          unzip -o source.zip -d src/

      - name: Detect source directory
        id: detect
        run: |
          cd src
          ITEM_COUNT=$(ls -1 | wc -l)
          FIRST_ITEM=$(ls -1 | head -1)
          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            echo "source_dir=$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "src_path=src/$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "Single folder detected: $FIRST_ITEM"
          else
            echo "source_dir=." >> "$GITHUB_OUTPUT"
            echo "src_path=src" >> "$GITHUB_OUTPUT"
            echo "Files directly in src/"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        id: keystore
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore my-release-key.keystore \
            -alias "${{ github.event.inputs.keystore_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 10950 \
            -storetype PKCS12 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=${{ github.event.inputs.app_name }}, O=${{ github.event.inputs.app_name }} Developer, C=CI"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/my-release-key.keystore" >> "$GITHUB_OUTPUT"

      - name: Download user keystore
        id: keystore-download
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'upload' && github.event.inputs.keystore_url != '' }}
        run: |
          set -e
          curl -L -o my-release-key.keystore "${{ github.event.inputs.keystore_url }}"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/my-release-key.keystore" >> "$GITHUB_OUTPUT"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/
          retention-days: 1

      - name: Upload keystore artifact
        if: ${{ steps.keystore.outputs.has_keystore == 'true' || steps.keystore-download.outputs.has_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: my-release-key.keystore
          retention-days: 1

  # ============================================================
  # JOB 2: BUILD WEB (Cordova) — React, Vue, Web
  # ============================================================
  build-web:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["web","react","vue"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install & build (React / Vue)
        if: ${{ contains(fromJson('["react","vue"]'), github.event.inputs.project_type) }}
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          if [ -f "package.json" ]; then
            npm install
            if grep -q '"build"' package.json; then
              npm run build
            fi
          fi

      - name: Build with Cordova
        run: |
          set -e
          cd src
          SOURCE_DIR="${{ needs.prepare.outputs.source_dir }}"
          COPY_FROM="$SOURCE_DIR"
          if [ -d "$SOURCE_DIR/dist" ]; then
            COPY_FROM="$SOURCE_DIR/dist"
          elif [ -d "$SOURCE_DIR/build" ]; then
            COPY_FROM="$SOURCE_DIR/build"
          fi
          PKG_ID="${{ github.event.inputs.package_id }}"
          if [ -z "$PKG_ID" ]; then
            PKG_ID="com.philtech.app"
          fi
          # Utiliser un nom de dossier unique pour eviter les conflits avec le contenu source
          CORDOVA_DIR="cordova-project-${{ github.event.inputs.build_id }}"
          cordova create "$CORDOVA_DIR" "$PKG_ID" "${{ github.event.inputs.app_name }}"
          rm -rf "$CORDOVA_DIR"/www/*
          # Copier en excluant le dossier cordova-project pour eviter la copie recursive
          for item in "$COPY_FROM"/*; do
            item_name=$(basename "$item")
            if [ "$item_name" != "$CORDOVA_DIR" ]; then
              cp -r "$item" "$CORDOVA_DIR"/www/
            fi
          done
          cd "$CORDOVA_DIR"
          cordova platform add android
          KEYSTORE_PATH="../../my-release-key.keystore"
          FORMAT="${{ github.event.inputs.output_format }}"
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$KEYSTORE_PATH" ]; then
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- \
                --packageType=apk \
                --keystore="$KEYSTORE_PATH" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- \
                --packageType=bundle \
                --keystore="$KEYSTORE_PATH" \
                --storePassword="${{ github.event.inputs.keystore_password }}" \
                --alias="${{ github.event.inputs.keystore_alias }}" \
                --password="${{ github.event.inputs.keystore_password }}"
            fi
          else
            cordova build android --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 3: BUILD CAPACITOR / IONIC
  # ============================================================
  build-capacitor:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["svelte","angular","solidjs","preact","ionic","capacitor"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Build Capacitor project
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          npm install
          npx cap sync android
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            mkdir -p app
            cat > app/signing.gradle << 'GRADLE_EOF'
            android {
              signingConfigs {
                release {
                  storeFile file(System.getenv("KEYSTORE_PATH"))
                  storePassword System.getenv("STORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
                }
              }
              buildTypes {
                release {
                  signingConfig signingConfigs.release
                }
              }
            }
            GRADLE_EOF
            echo "apply from: 'signing.gradle'" >> app/build.gradle
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-release-key.keystore"
            export STORE_PASSWORD="${{ github.event.inputs.keystore_password }}"
            export KEY_ALIAS="${{ github.event.inputs.keystore_alias }}"
            export KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 4: BUILD REACT NATIVE
  # ============================================================
  build-react-native:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.project_type == 'react-native' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build React Native
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          npm install
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            mkdir -p app
            cat > app/signing.gradle << 'GRADLE_EOF'
            android {
              signingConfigs {
                release {
                  storeFile file(System.getenv("KEYSTORE_PATH"))
                  storePassword System.getenv("STORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
                }
              }
              buildTypes {
                release {
                  signingConfig signingConfigs.release
                }
              }
            }
            GRADLE_EOF
            echo "apply from: 'signing.gradle'" >> app/build.gradle
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-release-key.keystore"
            export STORE_PASSWORD="${{ github.event.inputs.keystore_password }}"
            export KEY_ALIAS="${{ github.event.inputs.keystore_alias }}"
            export KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 5: BUILD KOTLIN / JAVA / KOTLIN MULTIPLATFORM
  # ============================================================
  build-kotlin-java:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["kotlin","java","kotlin-multiplatform"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Kotlin/Java
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            if ! grep -q "signingConfigs" app/build.gradle 2>/dev/null; then
              cat > app/signing.gradle << 'GRADLE_EOF'
              android {
                signingConfigs {
                  release {
                    storeFile file(System.getenv("KEYSTORE_PATH"))
                    storePassword System.getenv("STORE_PASSWORD")
                    keyAlias System.getenv("KEY_ALIAS")
                    keyPassword System.getenv("KEY_PASSWORD")
                  }
                }
                buildTypes {
                  release {
                    signingConfig signingConfigs.release
                  }
                }
              }
              GRADLE_EOF
              echo "apply from: 'signing.gradle'" >> app/build.gradle
            fi
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-release-key.keystore"
            export STORE_PASSWORD="${{ github.event.inputs.keystore_password }}"
            export KEY_ALIAS="${{ github.event.inputs.keystore_alias }}"
            export KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 6: BUILD FLUTTER
  # ============================================================
  build-flutter:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && github.event.inputs.project_type == 'flutter' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          flutter pub get
          FORMAT="${{ github.event.inputs.output_format }}"
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
            mkdir -p android
            cat > android/key.properties << EOF
            storePassword=${{ github.event.inputs.keystore_password }}
            keyPassword=${{ github.event.inputs.keystore_password }}
            keyAlias=${{ github.event.inputs.keystore_alias }}
            storeFile=$GITHUB_WORKSPACE/my-release-key.keystore
            EOF
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              flutter build apk --release
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              flutter build appbundle --release
            fi
          else
            flutter build apk --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 7: BUILD PYTHON
  # ============================================================
  build-python:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && github.event.inputs.project_type == 'python' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build with Briefcase
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          pip install briefcase
          briefcase create android
          briefcase build android
          # Briefcase ne connait pas notre keystore : on packages toujours
          # en ad-hoc ici, puis on re-signe juste apres avec la vraie cle
          # (generee ou uploadee par l'utilisateur) si c'est un build release.
          briefcase package android -p apk --adhoc-sign

      - name: Sign APK with real keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -z "$APK_SIGNER" ]; then
            echo "ERROR: apksigner introuvable, l'APK reste en signature ad-hoc (non valide pour le Play Store)."
            exit 0
          fi
          for apk in $(find . -name "*.apk"); do
            echo "Signing $apk with apksigner..."
            "$APK_SIGNER" sign \
              --ks "$GITHUB_WORKSPACE/my-release-key.keystore" \
              --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
              --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
              --ks-key-alias "${{ github.event.inputs.keystore_alias }}" \
              "$apk"
            echo "Signed: $apk"
          done

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 8: BUILD .NET MAUI
  # ============================================================
  build-dotnet:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'android' && contains(fromJson('["dotnet-maui","maui","csharp"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Build .NET MAUI
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            dotnet publish "$CSPROJ" -f net8.0-android -c Release
          else
            dotnet build "$CSPROJ" -f net8.0-android -c Debug
          fi

      - name: Sign APK with real keystore
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          APK_SIGNER=$(find "$ANDROID_SDK_ROOT" -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -z "$APK_SIGNER" ]; then
            echo "ERROR: apksigner introuvable, l'APK n'a pas pu etre signe."
            exit 0
          fi
          for apk in $(find . -name "*.apk"); do
            echo "Signing $apk with apksigner..."
            "$APK_SIGNER" sign \
              --ks "$GITHUB_WORKSPACE/my-release-key.keystore" \
              --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
              --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
              --ks-key-alias "${{ github.event.inputs.keystore_alias }}" \
              "$apk"
            echo "Signed: $apk"
          done

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 9: BUILD GO / GODOT / LUA / RUBY / NATIVESCRIPT
  # ============================================================
  build-other:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["go","godot","lua","ruby","nativescript"]'), github.event.inputs.project_type) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Go
        if: ${{ github.event.inputs.project_type == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Ruby
        if: ${{ github.event.inputs.project_type == 'ruby' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Godot
        if: ${{ github.event.inputs.project_type == 'godot' }}
        run: |
          set -e
          GODOT_VERSION="4.2.2"
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Setup Lua/Solar2D
        if: ${{ github.event.inputs.project_type == 'lua' }}
        run: |
          set -e
          wget -q https://github.com/coronalabs/corona/releases/download/3700/Solar2DConsole.tgz
          tar -xzf Solar2DConsole.tgz
          sudo mv Solar2DConsole /opt/solar2d
          echo "/opt/solar2d" >> $GITHUB_PATH

      - name: Setup Node for NativeScript
        if: ${{ github.event.inputs.project_type == 'nativescript' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install NativeScript CLI
        if: ${{ github.event.inputs.project_type == 'nativescript' }}
        run: npm install -g nativescript

      - name: Install gomobile
        if: ${{ github.event.inputs.project_type == 'go' }}
        run: |
          set -e
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Install RubyMotion
        if: ${{ github.event.inputs.project_type == 'ruby' }}
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y build-essential
          gem install motion-game || true

      - name: Build project
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          case "${{ github.event.inputs.project_type }}" in
            go)
              gomobile build -target=android -o app.apk .
              ;;
            godot)
              if [ ! -f "project.godot" ]; then
                echo "ERROR: project.godot not found"
                exit 1
              fi
              godot --headless --export-release "Android" build.apk
              ;;
            lua)
              if [ ! -f "build.settings" ]; then
                echo "ERROR: build.settings not found"
                exit 1
              fi
              /opt/solar2d/solar2d.sh build android
              ;;
            ruby)
              rake android:build || echo "Build RubyMotion echoue — licence requise."
              ;;
            nativescript)
              npm install
              ns platform add android
              if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "$GITHUB_WORKSPACE/my-release-key.keystore" ]; then
                ns build android --release --key-store-path "$GITHUB_WORKSPACE/my-release-key.keystore" --key-store-password "${{ github.event.inputs.keystore_password }}" --key-store-alias "${{ github.event.inputs.keystore_alias }}" --key-store-alias-password "${{ github.event.inputs.keystore_password }}"
              else
                ns build android --debug
              fi
              ;;
          esac

      - name: Universal APK signing (apksigner)
        if: ${{ github.event.inputs.build_type == 'release' && needs.prepare.outputs.has_keystore == 'true' }}
        run: |
          set -e
          echo "=== Universal APK signing with apksigner ==="
          APK_SIGNER=$(find $ANDROID_SDK_ROOT -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -z "$APK_SIGNER" ]; then
            APK_SIGNER=$(find /usr -name "apksigner" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_SIGNER" ]; then
            APK_SIGNER=$(find /opt -name "apksigner" -type f 2>/dev/null | head -1)
          fi

          if [ -n "$APK_SIGNER" ]; then
            echo "Found apksigner at: $APK_SIGNER"
            for apk in $(find . -name "*.apk" -not -path "./output/*"); do
              echo "Signing $apk with apksigner..."
              $APK_SIGNER sign \
                --ks "$GITHUB_WORKSPACE/my-release-key.keystore" \
                --ks-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --key-pass pass:"${{ github.event.inputs.keystore_password }}" \
                --ks-key-alias "${{ github.event.inputs.keystore_alias }}" \
                "$apk"
              echo "Signed: $apk"
            done
          else
            echo "apksigner not found, falling back to jarsigner..."
            for apk in $(find . -name "*.apk" -not -path "./output/*"); do
              echo "Signing $apk with jarsigner..."
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$GITHUB_WORKSPACE/my-release-key.keystore" \
                -storepass "${{ github.event.inputs.keystore_password }}" \
                "$apk" "${{ github.event.inputs.keystore_alias }}"
              echo "Signed: $apk"
            done
          fi
          echo "=== Universal signing complete ==="

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.apk" -exec cp {} output/ \; || true
          find . -name "*.aab" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 11: BUILD WINDOWS — Flutter
  # ============================================================
  build-windows-flutter:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && github.event.inputs.project_type == 'flutter' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter for Windows
        shell: bash
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          flutter config --enable-windows-desktop
          flutter pub get
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            flutter build windows --release
          else
            flutter build windows --debug
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p output
          EXE=$(find "${{ needs.prepare.outputs.src_path }}/build/windows" -name "*.exe" | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" output/app.exe
          else
            echo "ERROR: aucun .exe trouve apres le build Flutter Windows"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 12: BUILD WINDOWS — .NET MAUI / C#
  # ============================================================
  build-windows-dotnet:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && contains(fromJson('["dotnet-maui","maui","csharp"]'), github.event.inputs.project_type) }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build .NET MAUI for Windows
        shell: bash
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          CSPROJ=$(find . -maxdepth 2 -name "*.csproj" | head -1)
          CONFIG="Debug"
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            CONFIG="Release"
          fi
          dotnet publish "$CSPROJ" -f net8.0-windows10.0.19041.0 -c "$CONFIG" -p:WindowsPackageType=None -p:SelfContained=true -r win-x64

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p output
          EXE=$(find "${{ needs.prepare.outputs.src_path }}" -path "*win-x64*" -name "*.exe" | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" output/app.exe
          else
            echo "ERROR: aucun .exe trouve apres le publish .NET MAUI Windows"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 13: BUILD WINDOWS — Python (Briefcase)
  # ============================================================
  build-windows-python:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && github.event.inputs.project_type == 'python' }}
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build with Briefcase for Windows
        shell: bash
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          pip install briefcase
          briefcase create windows app
          briefcase build windows app
          briefcase package windows app -p app

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p output
          EXE=$(find "${{ needs.prepare.outputs.src_path }}" -name "*.exe" | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" output/app.exe
          else
            echo "ERROR: aucun .exe trouve apres le packaging Briefcase Windows"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 14: BUILD WINDOWS — Go (cross-compilation, pas besoin
  # d'un runner Windows : Go sait croiser la compilation depuis Linux)
  # ============================================================
  build-windows-go:
    needs: prepare
    if: ${{ github.event.inputs.platform == 'windows' && github.event.inputs.project_type == 'go' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cross-compile for Windows
        run: |
          set -e
          cd "${{ needs.prepare.outputs.src_path }}"
          GOOS=windows GOARCH=amd64 go build -o app.exe .

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "app.exe" -exec cp {} output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1

  # ============================================================
  # JOB 10: POST-BUILD — Upload to R2 & Notify
  # ============================================================
  post-build:
    needs: [prepare, build-web, build-capacitor, build-react-native, build-kotlin-java, build-flutter, build-python, build-dotnet, build-other, build-windows-flutter, build-windows-dotnet, build-windows-python, build-windows-go]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      apk_url: ${{ steps.upload.outputs.apk_url }}
      aab_url: ${{ steps.upload.outputs.aab_url }}
      keystore_url: ${{ steps.upload.outputs.keystore_url }}
      status: ${{ steps.upload.outputs.status }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: build-*
          merge-multiple: true

      - name: Download keystore artifact
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: keystore/

      - name: List artifacts
        run: |
          echo "=== Artifacts downloaded ==="
          find artifacts/ -type f || true
          echo "=== Keystore ==="
          find keystore/ -type f 2>/dev/null || true

      - name: Upload APK to R2
        id: upload-apk
        run: |
          set -e
          APK_FILE=$(find artifacts/ -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "Uploading APK: $APK_FILE"
            curl -sf -X POST \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK_FILE" \
              "${{ github.event.inputs.build_base_url }}/upload/apk"
            echo "apk_uploaded=true" >> "$GITHUB_OUTPUT"
            echo "apk_filename=$(basename $APK_FILE)" >> "$GITHUB_OUTPUT"
          else
            echo "No APK found"
            echo "apk_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to R2
        id: upload-aab
        run: |
          set -e
          AAB_FILE=$(find artifacts/ -name "*.aab" -type f | head -1)
          if [ -n "$AAB_FILE" ]; then
            echo "Uploading AAB: $AAB_FILE"
            curl -sf -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$AAB_FILE" \
              "${{ github.event.inputs.build_base_url }}/upload/aab"
            echo "aab_uploaded=true" >> "$GITHUB_OUTPUT"
            echo "aab_filename=$(basename $AAB_FILE)" >> "$GITHUB_OUTPUT"
          else
            echo "No AAB found"
            echo "aab_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload EXE to R2
        id: upload-exe
        if: ${{ github.event.inputs.platform == 'windows' }}
        run: |
          set -e
          EXE_FILE=$(find artifacts/ -name "*.exe" -type f | head -1)
          if [ -n "$EXE_FILE" ]; then
            echo "Uploading EXE: $EXE_FILE"
            curl -sf -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$EXE_FILE" \
              "${{ github.event.inputs.build_base_url }}/upload/exe"
            echo "exe_uploaded=true" >> "$GITHUB_OUTPUT"
            echo "exe_filename=$(basename $EXE_FILE)" >> "$GITHUB_OUTPUT"
          else
            echo "No EXE found"
            echo "exe_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated keystore to R2
        id: upload-keystore
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          KS_FILE=$(find keystore/ -name "*.keystore" -type f | head -1)
          if [ -n "$KS_FILE" ]; then
            echo "Uploading keystore: $KS_FILE"
            curl -sf -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$KS_FILE" \
              "${{ github.event.inputs.build_base_url }}/upload/keystore"
            echo "keystore_uploaded=true" >> "$GITHUB_OUTPUT"
            echo "keystore_filename=$(basename $KS_FILE)" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore found"
            echo "keystore_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine build status
        id: build-status
        run: |
          # Le statut se base sur l'upload reel d'un artefact (APK, AAB ou
          # EXE), pas sur un simple grep de "success" dans needs — celui-ci
          # est presque toujours vrai puisque le job "prepare" reussit meme
          # quand le vrai job de compilation echoue.
          if [ "${{ steps.upload-apk.outputs.apk_uploaded }}" == "true" ] || [ "${{ steps.upload-aab.outputs.aab_uploaded }}" == "true" ] || [ "${{ steps.upload-exe.outputs.exe_uploaded }}" == "true" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify callback URL with download links
        id: upload
        run: |
          set -e
          BUILD_ID="${{ github.event.inputs.build_id }}"
          STATUS="${{ steps.build-status.outputs.status }}"
          APP_NAME="${{ github.event.inputs.app_name }}"

          MESSAGE="Build $STATUS"
          if [ "$STATUS" == "error" ]; then
            MESSAGE="Le build a echoue : aucun fichier n'a ete produit. Verifie les logs du job de compilation."
          fi

          # Construire le payload JSON. Les URLs de telechargement ne sont
          # pas envoyees ici : le Worker les recalcule lui-meme (routes R2
          # reelles) dans handleCallback, donc pas besoin de les dupliquer.
          JSON_PAYLOAD=$(cat <<EOF
          {
            "build_id": "$BUILD_ID",
            "state": "$STATUS",
            "message": "$MESSAGE"
          }
          EOF
          )

          echo "Sending notification..."
          echo "$JSON_PAYLOAD"

          curl -sf -X POST -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "${{ github.event.inputs.callback_url }}" || echo "Callback notification failed"

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
