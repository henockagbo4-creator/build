# ============================================================================
# Build APK / AAB / EXE — pipeline multi-langages (VERSION CACHEE + CORRIGEE)
# ============================================================================
# NOUVEAUX CORRECTIFS DE CETTE VERSION :
#   1. build-kotlin-java: auto-fix du conflit "buildscript{classpath} vs
#      plugins{} DSL" pour com.android.application (erreur tres frequente
#      chez les clients qui copient de vieux tutoriels). Le bloc
#      buildscript{} legacy contenant "com.android.tools.build:gradle" est
#      detecte et retire automatiquement avant le build.
#   2. build-kotlin-java: capture du message d'erreur Gradle reel (section
#      "What went wrong") et remontee jusqu'au callback client, au lieu du
#      message generique "Kotlin/Java build failed".
#   3. FIX: find avec -o sans parentheses dans build-python et
#      build-windows-python (cassait le calcul de PROJECT_ROOT).
#   4. Restauration des diagnostics error_code / error_hint quand le type
#      de projet n'est pas detecte (avaient disparu dans la version cache).
#   5. Retrait de l'etape "Sanitize source files" (code mort/risque).
#   6. build-kotlin-java: detection de la vraie racine Gradle basee sur
#      settings.gradle(.kts) au lieu de n'importe quel build.gradle (qui
#      pouvait pointer vers app/ par erreur).
#   7. build-kotlin-java: generation du wrapper gradlew independante de la
#      commande systeme "gradle" (fallback par telechargement direct des
#      fichiers officiels), avec message d'erreur clair en cas d'echec au
#      lieu de laisser "./gradlew: No such file or directory" remonter.
#   8. build-kotlin-java: auto-fix d'un second cas de conflit de plugin -
#      version dupliquee entre la racine/settings.gradle et un sous-module
#      (ex: app/build.gradle.kts), cause de "Error resolving plugin [...]
#      already on the classpath with an unknown version" meme quand aucun
#      buildscript{} legacy n'est present.
# ============================================================================

name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL du zip source'
        required: true
        type: string
      app_name:
        description: 'Nom de l application'
        required: true
        type: string
      package_id:
        description: 'Package ID'
        required: false
        type: string
      build_id:
        description: 'ID du build'
        required: true
        type: string
      build_type:
        description: 'Type de build'
        required: true
        type: string
      output_format:
        description: 'Format de sortie (apk, aab, both)'
        required: false
        type: string
        default: 'apk'
      project_type:
        description: 'Type de projet (optionnel - auto-detecte si vide)'
        required: false
        type: string
        default: ''
      platform:
        description: 'Plateforme cible (android, windows)'
        required: false
        type: string
        default: 'android'
      icon_url:
        description: 'URL de l icone personnalisee (optionnel)'
        required: false
        type: string
        default: ''
      keystore_mode:
        description: 'Mode keystore'
        required: true
        type: string
      keystore_url:
        description: 'URL du keystore'
        required: false
        type: string
      keystore_password:
        description: 'Mot de passe du keystore'
        required: false
        type: string
      keystore_alias:
        description: 'Alias du keystore'
        required: false
        type: string
      callback_url:
        description: 'URL de callback (notification finale, avec /callback)'
        required: true
        type: string
      build_base_url:
        description: 'URL de base du build sur le Worker (sans /callback)'
        required: false
        type: string

env:
  NODE_VERSION: '24'

jobs:
  # ============================================================
  # JOB 1: PREPARE
  # ============================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_dir: ${{ steps.detect.outputs.source_dir }}
      src_path: ${{ steps.detect.outputs.src_path }}
      detected_type: ${{ steps.detect-project.outputs.detected_type }}
      has_keystore: ${{ steps.keystore.outputs.has_keystore || steps.keystore-download.outputs.has_keystore }}
      keystore_path: ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
      keystore_filename: ${{ steps.keystore.outputs.keystore_filename || steps.keystore-download.outputs.keystore_filename }}
      build_should_run: ${{ steps.detect-project.outputs.build_should_run }}
      error_message: ${{ steps.detect-project.outputs.error_message }}
      error_code: ${{ steps.detect-project.outputs.error_code }}
      error_hint: ${{ steps.detect-project.outputs.error_hint }}
    steps:
      - name: Download source zip
        id: download
        run: |
          set -e
          curl -f -L -o source.zip "${{ github.event.inputs.zip_url }}"
          echo "=== Taille du fichier telecharge ==="
          ls -la source.zip
          SIZE=$(stat -c%s source.zip 2>/dev/null || stat -f%z source.zip)
          if [ "$SIZE" -lt 100 ]; then
            echo "ERREUR: le fichier source.zip est suspicieusement petit ($SIZE octets)."
            cat source.zip
            exit 1
          fi
          mkdir -p src
          unzip -o source.zip -d src/

      - name: Detect source directory
        id: detect
        run: |
          cd src
          ITEM_COUNT=$(ls -1 | wc -l)
          FIRST_ITEM=$(ls -1 | head -1)
          if [ "$ITEM_COUNT" -eq 1 ] && [ -d "$FIRST_ITEM" ]; then
            echo "source_dir=$FIRST_ITEM" >> "$GITHUB_OUTPUT"
            echo "src_path=src/$FIRST_ITEM" >> "$GITHUB_OUTPUT"
          else
            echo "source_dir=." >> "$GITHUB_OUTPUT"
            echo "src_path=src" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # DÉTECTION + diagnostic detaille si "unknown"
      # ============================================================
      - name: Auto-detect project type
        id: detect-project
        run: |
          set -e
          cd src/${{ steps.detect.outputs.source_dir }}

          find_file() {
            find . -iname "$1" -type f \
              -not -path "*/node_modules/*" \
              -not -path "*/.git/*" \
              -not -path "*/build/*" \
              -not -path "*/dist/*" \
              -not -path "*/bin/*" \
              -not -path "*/obj/*" \
              2>/dev/null | head -1
          }

          DETECTED="unknown"
          BUILD_SHOULD_RUN="true"
          ERROR_MSG=""
          ERROR_CODE=""
          ERROR_HINT=""

          if [ -n "$(find_file "pubspec.yaml")" ]; then
            DETECTED="flutter"
            echo "Flutter detecte"
          elif [ -n "$(find_file "*.csproj")" ]; then
            DETECTED="dotnet-maui"
            echo ".NET MAUI detecte"
          elif [ -n "$(find_file "metro.config.js")" ] || [ -n "$(find_file "metro.config.ts")" ]; then
            DETECTED="react-native"
            echo "React Native detecte"
          elif [ -n "$(find_file "capacitor.config.ts")" ] || [ -n "$(find_file "capacitor.config.json")" ] || [ -n "$(find_file "capacitor.config.js")" ] || ( [ -n "$(find_file "package.json")" ] && ( grep -q "@capacitor/core" "$(find_file "package.json")" 2>/dev/null || grep -q "@capacitor/android" "$(find_file "package.json")" 2>/dev/null || grep -q "@ionic/core" "$(find_file "package.json")" 2>/dev/null ) ); then
            DETECTED="capacitor"
            echo "Capacitor detecte"
          elif [ -n "$(find_file "package.json")" ] && grep -q '"expo"' "$(find_file "package.json")" 2>/dev/null; then
            PKG_DIR=$(dirname "$(find_file "package.json")")
            if [ -d "$PKG_DIR/android" ] || [ -d "$PKG_DIR/ios" ]; then
              DETECTED="react-native"
              echo "Expo bare workflow detecte"
            else
              DETECTED="unknown"
              BUILD_SHOULD_RUN="false"
              ERROR_CODE="expo_managed_unsupported"
              ERROR_HINT="Lancez 'npx expo prebuild' localement avant de renvoyer votre projet, pour generer les dossiers android/ (et ios/)."
              ERROR_MSG="Expo managed workflow non supporte. $ERROR_HINT"
              echo "Expo managed non supporte"
            fi
          elif { [ -n "$(find_file "build.gradle")" ] || [ -n "$(find_file "build.gradle.kts")" ]; } && [ -z "$(find_file "package.json")" ]; then
            DETECTED="kotlin"
            echo "Kotlin/Java detecte"
          elif [ -n "$(find_file "go.mod")" ]; then
            DETECTED="go"
            echo "Go detecte"
          elif [ -n "$(find_file "setup.py")" ] || [ -n "$(find_file "pyproject.toml")" ] || [ -n "$(find_file "buildozer.spec")" ] || ( [ -n "$(find_file "main.py")" ] && [ -z "$(find_file "go.mod")" ] ) || ( [ -n "$(find_file "app.py")" ] && [ -z "$(find_file "go.mod")" ] ); then
            DETECTED="python"
            echo "Python detecte"
          elif [ -n "$(find_file "project.godot")" ]; then
            DETECTED="godot"
            echo "Godot detecte"
          elif [ -n "$(find_file "build.settings")" ]; then
            DETECTED="lua"
            echo "Lua detecte"
          elif [ -n "$(find_file "package.json")" ] && grep -q "nativescript" "$(find_file "package.json")" 2>/dev/null; then
            DETECTED="nativescript"
            echo "NativeScript detecte"
          elif [ -n "$(find_file "package.json")" ]; then
            PKG_JSON="$(find_file "package.json")"
            if grep -q '"react"' "$PKG_JSON" 2>/dev/null && [ -z "$(find_file "metro.config.js")" ]; then
              DETECTED="react"
            elif grep -q '"vue"' "$PKG_JSON" 2>/dev/null; then
              DETECTED="vue"
            elif grep -q '"svelte"' "$PKG_JSON" 2>/dev/null; then
              DETECTED="svelte"
            else
              DETECTED="web"
            fi
            echo "Projet web detecte ($DETECTED)"
          elif [ -n "$(find_file "index.html")" ]; then
            DETECTED="web"
            echo "Site statique detecte"
          else
            DETECTED="unknown"
            BUILD_SHOULD_RUN="false"
            ERROR_CODE="project_type_not_detected"

            if [ -n "$(find_file "*.py")" ]; then
              ERROR_HINT="Des fichiers .py ont ete trouves, mais aucun n'est nomme main.py, app.py, ni accompagne d'un pyproject.toml ou buildozer.spec. Renommez votre script principal en main.py ou ajoutez un buildozer.spec."
            elif [ -n "$(find_file "*.kt")" ] || [ -n "$(find_file "*.java")" ]; then
              ERROR_HINT="Des fichiers Kotlin/Java ont ete trouves, mais aucun build.gradle ou build.gradle.kts n'est present. Verifiez que le projet Android Studio complet (avec settings.gradle) est bien inclus dans le zip."
            elif [ -n "$(find_file "*.js")" ] || [ -n "$(find_file "*.ts")" ]; then
              ERROR_HINT="Des fichiers JS/TS ont ete trouves, mais aucun package.json n'est present a la racine. Assurez-vous que package.json est bien inclus dans le zip."
            else
              ERROR_HINT="Aucun marqueur de projet reconnu (package.json, pubspec.yaml, build.gradle, *.csproj, go.mod, main.py, project.godot...) n'a ete trouve."
            fi

            ERROR_MSG="Impossible de detecter le type de projet. $ERROR_HINT"
            echo "Type inconnu: $ERROR_HINT"
          fi

          CLIENT_TYPE="${{ github.event.inputs.project_type }}"
          if [ "$CLIENT_TYPE" != "" ] && [ "$CLIENT_TYPE" != "web" ]; then
            echo "Client force: $CLIENT_TYPE"
            DETECTED="$CLIENT_TYPE"
          fi

          echo "detected_type=$DETECTED" >> "$GITHUB_OUTPUT"
          echo "build_should_run=$BUILD_SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "error_message=$ERROR_MSG" >> "$GITHUB_OUTPUT"
          echo "error_code=$ERROR_CODE" >> "$GITHUB_OUTPUT"
          echo "error_hint=$ERROR_HINT" >> "$GITHUB_OUTPUT"
          echo "=== TYPE FINAL: $DETECTED ==="

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        id: keystore
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          set -e
          KEYSTORE_NAME="my-release-key-${{ github.event.inputs.build_id }}.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_NAME" \
            -alias "${{ github.event.inputs.keystore_alias }}" \
            -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 10950 \
            -storetype PKCS12 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=${{ github.event.inputs.app_name }}, O=${{ github.event.inputs.app_name }} Developer, C=CI"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_filename=$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download user keystore
        id: keystore-download
        if: ${{ github.event.inputs.platform != 'windows' && github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'upload' && github.event.inputs.keystore_url != '' }}
        run: |
          set -e
          KEYSTORE_NAME="my-release-key-${{ github.event.inputs.build_id }}.keystore"
          curl -L -o "$KEYSTORE_NAME" "${{ github.event.inputs.keystore_url }}"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$GITHUB_WORKSPACE/$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"
          echo "keystore_filename=$KEYSTORE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/
          retention-days: 1

      - name: Upload keystore artifact
        if: ${{ steps.keystore.outputs.has_keystore == 'true' || steps.keystore-download.outputs.has_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}
          path: ${{ steps.keystore.outputs.keystore_path || steps.keystore-download.outputs.keystore_path }}
          retention-days: 7

      - name: Notify error if project not detected
        if: ${{ steps.detect-project.outputs.build_should_run == 'false' }}
        run: |
          set -e
          JSON_PAYLOAD=$(jq -n \
              --arg build_id "${{ github.event.inputs.build_id }}" \
              --arg message "${{ steps.detect-project.outputs.error_message }}" \
              --arg error_code "${{ steps.detect-project.outputs.error_code }}" \
              --arg hint "${{ steps.detect-project.outputs.error_hint }}" \
              '{
                build_id: $build_id,
                state: "error",
                detected_type: "unknown",
                error_code: $error_code,
                message: $message,
                hint: $hint
              }')
          curl -sf -X POST -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "${{ github.event.inputs.callback_url }}" || true
          exit 1

  # ============================================================
  # JOB 2: BUILD WEB (Cordova)
  # ============================================================
  build-web:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["web","react","vue","svelte"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build web project
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "package.json" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && PROJECT_ROOT="."
          cd "$PROJECT_ROOT"

          if [ -f "package.json" ]; then
            npm ci --prefer-offline || npm install
            if grep -q '"build"' package.json; then
              npm run build
            fi
          fi

          PKG_ID="${{ github.event.inputs.package_id }}"
          [ -z "$PKG_ID" ] && PKG_ID="com.philtech.app"

          CORDOVA_DIR="cordova-project-${{ github.event.inputs.build_id }}"
          cordova create "$CORDOVA_DIR" "$PKG_ID" "${{ github.event.inputs.app_name }}"
          rm -rf "$CORDOVA_DIR"/www/*

          COPY_FROM="."
          if [ -d "dist" ]; then COPY_FROM="dist"
          elif [ -d "build" ]; then COPY_FROM="build"
          fi

          cp -r "$COPY_FROM"/* "$CORDOVA_DIR"/www/ 2>/dev/null || true

          sed -i 's#</widget>#  <preference name="android-minSdkVersion" value="24" />\n  <preference name="android-targetSdkVersion" value="34" />\n  <preference name="SplashScreenDelay" value="0" />\n</widget>#' "$CORDOVA_DIR"/config.xml

          echo "SAVED_CORDOVA_DIR=$PWD/$CORDOVA_DIR" >> "$GITHUB_ENV"

      - name: Add Cordova Android platform
        run: |
          set -e
          cd "$SAVED_CORDOVA_DIR"
          cordova platform add android

      - name: Apply custom icon (Cordova)
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          set -e
          cd "$SAVED_CORDOVA_DIR"
          mkdir -p resources
          curl -f -L -o resources/icon.png "${{ github.event.inputs.icon_url }}"
          npm install -g cordova-res
          cordova-res android --copy --type icon

      - name: Build Cordova
        run: |
          set -e
          cd "$SAVED_CORDOVA_DIR"
          KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
          FORMAT="${{ github.event.inputs.output_format }}"

          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
            if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- --packageType=apk --keystore="$KEYSTORE_FILE" --storePassword="${{ github.event.inputs.keystore_password }}" --alias="${{ github.event.inputs.keystore_alias }}" --password="${{ github.event.inputs.keystore_password }}"
            fi
            if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
              cordova build android --release -- --packageType=bundle --keystore="$KEYSTORE_FILE" --storePassword="${{ github.event.inputs.keystore_password }}" --alias="${{ github.event.inputs.keystore_alias }}" --password="${{ github.event.inputs.keystore_password }}"
            fi
          else
            cordova build android --debug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-web-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 3: BUILD CAPACITOR
  # ============================================================
  build-capacitor:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && contains(fromJson('["angular","svelte","solidjs","preact","ionic","capacitor"]'), needs.prepare.outputs.detected_type) && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
        with:
          name: source-${{ github.event.inputs.build_id }}
          path: src/

      - name: Download keystore
        if: ${{ needs.prepare.outputs.has_keystore == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: keystore-${{ github.event.inputs.build_id }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Prepare Capacitor project
        id: build
        run: |
          set -e
          cd src/
          PROJECT_ROOT=$(find . -name "package.json" -type f -not -path "*/node_modules/*" -not -path "*/.git/*" -exec dirname {} \; | head -1)
          [ -z "$PROJECT_ROOT" ] && exit 0
          cd "$PROJECT_ROOT"
          echo "SAVED_PROJECT_ROOT=$PWD" >> "$GITHUB_ENV"

          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.js" ]; then
            npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_id || 'com.philtech.app' }}" --web-dir "dist" 2>/dev/null || npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_id || 'com.philtech.app' }}" --web-dir "www" 2>/dev/null || true
          fi

          npm ci --prefer-offline || npm install
          if grep -q '"build"' package.json 2>/dev/null; then
            npm run build
          fi

          if [ ! -d "android" ]; then
            npx cap add android || true
          fi

      - name: Apply custom icon (Capacitor)
        if: ${{ github.event.inputs.icon_url != '' }}
        run: |
          set -e
          cd "$SAVED_PROJECT_ROOT"
          mkdir -p resources
          curl -f -L -o resources/icon.png "${{ github.event.inputs.icon_url }}"
          npm install -g @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' || true

      - name: Disable default splash screen
        run: |
          set -e
          cd "$SAVED_PROJECT_ROOT" 2>/dev/null || exit 0
          if [ -f "capacitor.config.json" ]; then
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json'));
              cfg.plugins = cfg.plugins || {};
              cfg.plugins.SplashScreen = { launchShowDuration: 0 };
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            " || true
          fi

      - name: Sync and build Capacitor Android
        run: |
          set -e
          cd "$SAVED_PROJECT_ROOT" 2>/dev/null || exit 0
          npx cap sync android || true
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            KEYSTORE_FILE=$(find "$GITHUB_WORKSPACE" -name "*.keystore" -type f | head -1)
            FORMAT="${{ github.event.inputs.output_format }}"

            if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -n "$KEYSTORE_FILE" ]; then
              mkdir -p app
              cat > app/signing.gradle << GRADLE_EOF
          android {
            signingConfigs {
              release {
                storeFile file("$KEYSTORE_FILE")
                storePassword "${{ github.event.inputs.keystore_password }}"
                keyAlias "${{ github.event.inputs.keystore_alias }}"
                keyPassword "${{ github.event.inputs.keystore_password }}"
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE_EOF
              if ! grep -q "signing.gradle" app/build.gradle 2>/dev/null; then
                echo "apply from: 'signing.gradle'" >> app/build.gradle
              fi
              if [ "$FORMAT" == "apk" ] || [ "$FORMAT" == "both" ]; then
                ./gradlew assembleRelease
              fi
              if [ "$FORMAT" == "aab" ] || [ "$FORMAT" == "both" ]; then
                ./gradlew bundleRelease
              fi
            else
              ./gradlew assembleDebug
            fi
          fi

      - name: Collect artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $GITHUB_WORKSPACE/src/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true
          find $GITHUB_WORKSPACE/src/ -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-capacitor-${{ github.event.inputs.build_id }}
          path: output/*
          retention-days: 1
          if-no-files-found: warn

  # ============================================================
  # JOB 4: BUILD REACT NATIVE
  # ============================================================
  build-react-native:
    needs: prepare
    if: ${{ github.event.inputs.platform != 'windows' && needs.prepare.outputs.detected_type == 'react-native' && needs.prepare.outputs.build_should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/download-artifact@v4
