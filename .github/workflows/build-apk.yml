name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      package_id:
        required: true
        type: string
      build_id:
        required: true
        type: string
      supabase_url:
        required: true
        type: string
      supabase_key:
        required: true
        type: string
      bucket:
        required: true
        type: string
      callback_url:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source zip
        run: |
          curl -X GET "${{ inputs.supabase_url }}/storage/v1/object/download/${{ inputs.bucket }}/${{ inputs.build_id }}/source.zip" \
            -H "Authorization: Bearer ${{ inputs.supabase_key }}" \
            -o source.zip
          ls -la source.zip
          mkdir -p src
          unzip source.zip -d src/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: |
          npm install -g cordova

      - name: Build APK
        run: |
          cd src
          cordova create app ${{ inputs.package_id }} "${{ inputs.app_name }}"
          cd app
          cp -r ../www/* www/ 2>/dev/null || cp -r ../* www/ 2>/dev/null || true
          cordova platform add android
          cordova build android --debug

      - name: Upload APK to Supabase
        run: |
          cd src/app/platforms/android/app/build/outputs/apk/debug
          curl -X POST "${{ inputs.supabase_url }}/storage/v1/object/${{ inputs.bucket }}/${{ inputs.build_id }}/app-debug.apk" \
            -H "Authorization: Bearer ${{ inputs.supabase_key }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @app-debug.apk

      - name: Notify backend
        run: |
          curl -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -d '{"state":"success"}'
