name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL du zip source'
        required: true
        type: string
      app_name:
        description: 'Nom de l application'
        required: true
        type: string
      package_id:
        description: 'Package ID'
        required: true
        type: string
      build_id:
        description: 'ID du build'
        required: true
        type: string
      build_type:
        description: 'Type de build'
        required: true
        type: string
      keystore_mode:
        description: 'Mode keystore'
        required: true
        type: string
      keystore_url:
        description: 'URL du keystore'
        required: false
        type: string
      keystore_password:
        description: 'Mot de passe du keystore'
        required: false
        type: string
      keystore_alias:
        description: 'Alias du keystore'
        required: false
        type: string
      callback_url:
        description: 'URL de callback'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source zip
        run: |
          curl -L -o source.zip "${{ github.event.inputs.zip_url }}"
          mkdir -p project
          unzip source.zip -d project/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Setup project
        run: |
          cd project
          
          # Si c'est déjà un projet Capacitor
          if [ -f "capacitor.config.ts" ] || [ -f "capacitor.config.js" ] || [ -f "package.json" ]; then
            echo "Existing project detected"
            npm install
          else
            # Sinon, créer un projet minimal
            echo '{"name":"app","version":"1.0.0"}' > package.json
            npm install @capacitor/core @capacitor/android
            npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_id }}" --web-dir www
          fi
          
          # S'assurer que www existe
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          
          npx cap add android
          npx cap sync

      - name: Generate keystore
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'generate' }}
        run: |
          keytool -genkey -v \
            -keystore my-release-key.keystore \
            -alias "${{ github.event.inputs.keystore_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "CN=PhilTech, O=PhilTech, C=CI"
          ls -la my-release-key.keystore

      - name: Download user keystore
        if: ${{ github.event.inputs.build_type == 'release' && github.event.inputs.keystore_mode == 'upload' && github.event.inputs.keystore_url != '' }}
        run: |
          curl -L -o my-release-key.keystore "${{ github.event.inputs.keystore_url }}"
          ls -la my-release-key.keystore

      - name: Build APK with Capacitor
        run: |
          cd project/android
          
          if [ "${{ github.event.inputs.build_type }}" == "release" ] && [ -f "../../my-release-key.keystore" ]; then
            echo "Building RELEASE with signing"
            
            # Copier le keystore dans le projet
            cp ../../my-release-key.keystore app/my-release-key.keystore
            
            # Configurer le signing dans build.gradle
            cat >> app/build.gradle << 'EOF'
            
            android {
                signingConfigs {
                    release {
                        storeFile file('my-release-key.keystore')
                        storePassword '${{ github.event.inputs.keystore_password }}'
                        keyAlias '${{ github.event.inputs.keystore_alias }}'
                        keyPassword '${{ github.event.inputs.keystore_password }}'
                    }
                }
                buildTypes {
                    release {
                        signingConfig signingConfigs.release
                    }
                }
            }
            EOF
            
            ./gradlew assembleRelease
          else
            echo "Building DEBUG"
            ./gradlew assembleDebug
          fi

      - name: Find and encode APK
        id: apk
        run: |
          cd project/android/app/build/outputs/apk
          
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            APK_PATH=$(find release -name "*.apk" | head -1)
          else
            APK_PATH=$(find debug -name "*.apk" | head -1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            exit 1
          fi
          
          echo "APK found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          
          # Encoder en base64 pour l'envoyer dans le callback
          BASE64_APK=$(base64 -w 0 "$APK_PATH")
          echo "apk_base64_length=${#BASE64_APK}" >> $GITHUB_OUTPUT
          
          # Sauvegarder dans un fichier pour l'étape suivante
          echo "$BASE64_APK" > /tmp/apk_base64.txt

      - name: Send APK to backend via callback
        run: |
          # Envoyer l'APK encodée en base64 au backend
          # On envoie par morceaux si trop grand, ou on envoie juste l'URL de téléchargement GitHub Artifact
          
          # Solution simple : upload comme artifact et envoyer l'URL
          echo "APK uploaded as artifact"

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_id }}
          path: project/android/app/build/outputs/apk/*/*.apk
          retention-days: 1

      - name: Get artifact URL and notify backend
        run: |
          # L'URL de l'artifact
          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          for i in 1 2 3 4 5; do
            curl -X POST "${{ github.event.inputs.callback_url }}" \
              -H "Content-Type: application/json" \
              -d "{\"state\":\"success\",\"message\":\"Build success\",\"artifact_url\":\"${ARTIFACT_URL}\",\"build_id\":\"${{ github.event.inputs.build_id }}\"}" && break
            echo "Retry $i..."
            sleep 15
          done
